ông Việt Nam."],["C","Cục Quản lý xuất nhập cảnh."],["D","Hãng hàng không."]],"a":null,"e":"","g":""},{"n":55,"q":"Trong công tác đảm bảo an ninh soi chiếu đối với hành khách, hành lý, việc dán tem an ninh niêm phong được thực hiện đối với trường hợp nào sau đây?","o":[["A","Hành lý thất lạc, hành lý không có người nhận"],["B","Hành lý tạm gửi tại phòng dịch vụ giữ đồ của đơn vị khai thác thuộc Cảng hàng không"],["C","Hành lý ký gửi của hành khách thuộc danh sách kiểm tra Selectee/Ngẫu nhiên của Hãng hàng không Vietnam Airlines"],["D","Tất cả đáp án trên"]],"a":"D","e":"","g":""},{"n":56,"q":"Văn bản số 430/HD-CACKTSN ban hành ngày 08/09/2026 hướng dẫn thực hiện về nội dung nào?","o":[["A","Tăng cường công tác kiểm tra, kiểm soát người, đồ vật mang theo và phương tiện vào/ra khu vực hạn chế, cách ly."],["B","Kiểm soát an ninh đối với các hãng hàng không khi ký gửi hành lý tại cửa khởi hành và Kiểm tra trực quan hành lý ký gửi vắng mặt hành khách."],["C","Công tác kiểm tra, kiểm soát người, đồ vật mang theo và phương tiện vào/ra khu vực công cộng."],["D","Kiểm tra, xử lý đối với hành lý vô chủ, bỏ quên tại điểm kiểm tra an ninh."]],"a":null,"e":"","g":""},{"n":57,"q":"Theo văn bản số 430/HD-CACKTSN ban hành ngày 08/09/2026 thì quy trình thực hiện kiểm tra trực quan hành lý ký gửi vắng mặt hành khách gồm có bao nhiêu bước?","o":[["A","2 bước"],["B","3 bước"],["C","4 bước"],["D","5 bước"]],"a":null,"e":"","g":""},{"n":59,"q":"Theo Danh mục vật phẩm nguy hiểm cấm, hạn chế mang vào khu vực hạn chế, mang lên tàu bay thì pin sạc dự phòng được phép để bên trong hành lý ký gửi?","o":[["A","Đúng."],["B","Sai."]],"a":"B","e":"","g":""},{"n":60,"q":"Xe lăn chạy bằng pin hoặc các thiết bị hỗ trợ di chuyển tương tự khác chạy bằng pin Lithium-ion hoặc pin ướt chỉ được phép vận chuyển như thế nào sau đây?","o":[["A","Hành lý ký gửi."],["B","Hành lý xách tay, theo người."],["C","Phải được Người khai thác tàu bay chấp nhận."],["D","A và C đúng."],["E","Tất cả đáp trên đúng."]],"a":null,"e":"","g":""},{"n":61,"q":"Đối với pin lithium-ion dự phòng của các thiết bị điện tử cầm tay có công suất từ 100wh-160wh, được người khai thác tàu bay chấp nhận vận chuyển bên trong hành xách tay, theo người thì mỗi hành khác được mang tối đa bao nhiêu viên?","o":[["A","02 viên."],["B","03 viên."],["C","04 viên."],["D","Không giới hạn số lượng."]],"a":"A","e":"","g":""},{"n":62,"q":"Đối với pin dự phòng (lithium-ion) của xe lăn chạy bằng pin hoặc các thiết bị hỗ trợ di chuyển tương tự khác được quy định như thế nào?","o":[["A","Tối đa 02 pin dự phòng không quá 300wh hoặc 02 pin dự phòng không quá 160wh và phải được Người khai thác tàu bay chấp nhận"],["B","Tối đa 01 pin dự phòng không quá 300wh hoặc 02 pin dự phòng không quá 160wh."],["C","Tối đa 01 pin dự phòng không quá 300wh hoặc 02 pin dự phòng không quá 160wh và phải được Người khai thác tàu bay chấp nhận."],["D","Không giới hạn công suất và số lượng."]],"a":"C","e":"","g":""},{"n":63,"q":"Đối với pin khô dự phòng đáp ứng các quy định của Điều khoản đặc biệt A67, có điện áp dưới 12 volts và công suất dưới 100wh, được phép:","o":[["A","Ký gửi và xách tay. Không quá 02 viên pin cho mỗi hành khách."],["B","Xách tay. Không quá 02 viên pin cho mỗi hành khách."],["C","Ký gửi. Không quá 02 viên pin cho mỗi hành khách."],["D","Xách tay. Không giới hạn số lượng."]],"a":"B","e":"","g":""},{"n":64,"q":"Các loại động cơ đốt trong hoặc động cơ chạy pin nhiên liệu đã được xả sạch hoàn toàn, không còn chứa bất kỳ loại nhiên liệu nào (xăng, dầu, khí gas hoặc chất lỏng dễ cháy khác) từng dùng để tạo ra năng lượng đáp ứng theo Điều khoản đặc biệt A70 thì được phép vận chuyển như thế nào?","o":[["A","Được phép ký gửi."],["B","Được phép xách tay."],["C","A và B đúng."],["D","A và B sai."]],"a":"C","e":"","g":""},{"n":65,"q":"Hành khách đã được soi chiếu nhưng sau đó tiếp xúc với người hoặc hành lý chưa được soi chiếu. Cách xử lý nào đúng trước khi cho lên tàu bay?","o":[["A","Phải soi chiếu lại theo quy định."],["B","Không cần nếu hành khách vẫn giữ thẻ lên tàu bay."],["C","Không cần nếu tiếp xúc trong thời gian ngắn."],["D","Chỉ cần hãng hàng không xác nhận hành khách không nhận thêm đồ."]],"a":"A","e":"Đã từng soi chiếu không đồng nghĩa với luôn duy trì tình trạng bảo đảm an ninh sau đó. Căn cứ: khoản 2 Điều 10 và khoản 1 Điều 15 Nghị định 215/2026/NĐ-CP.","g":"AN NINH HÀNG KHÔNG VÀ PHẠM VI SỬ DỤNG THẺ"},{"n":66,"q":"Nhận định nào đúng về thẩm quyền quyết định lục soát an ninh hàng không tại Điều 13 Nghị định 215/2026/NĐ-CP?","o":[["A","Kiểm soát viên ở bất kỳ vị trí nào đều được quyết định lục soát người và tàu bay."],["B","Chỉ huy Đội trực ca được quyết định mọi trường hợp, kể cả lục soát tàu bay."],["C","Chỉ huy Đội trực ca tại mục tiêu đảm nhiệm quyết định các trường hợp tại điểm a, b, c khoản 1 Điều 12; người đứng đầu đơn vị kiểm soát an ninh hàng không tại cảng hàng không quyết định trường hợp tại điểm d."],["D","Cơ trưởng quyết định thay lực lượng kiểm soát an ninh trong mọi trường hợp."]],"a":"C","e":"Không được mở rộng thẩm quyền của Chỉ huy Đội đối với trường hợp lục soát tàu bay thuộc nhánh riêng. Căn cứ: khoản 1 Điều 13.","g":"AN NINH HÀNG KHÔNG VÀ PHẠM VI SỬ DỤNG THẺ"},{"n":70,"q":"Lực lượng An ninh Soi chiếu có trách nhiệm phối hợp với lực lượng nào tại cửa khẩu hàng không khi phát hiện hàng hóa/hành lý có dấu hiệu buôn lậu, vận chuyển trái phép chất ma túy, ngoại tệ?","o":[["A","Lực lượng Hải quan và các Đội nghiệp vụ CACK."],["B","Nhân viên làm thủ tục hãng hàng không."],["C","Đại diện hãng hàng không."],["D","Lực lượng Cảnh sát giao thông đường bộ."]],"a":"A","e":"","g":"AN NINH HÀNG KHÔNG VÀ PHẠM VI SỬ DỤNG THẺ"},{"n":71,"q":"Việc bàn giao tang vật là vũ khí, đạn dược, vật liệu nổ phát hiện qua soi chiếu cho cơ quan điều tra phải đảm bảo nguyên tắc nào?","o":[["A","Niêm phong tang vật đúng quy cách, có sự chứng kiến của các bên, lập biên bản bàn giao chi tiết số lượng, chủng loại, tình trạng."],["B","Cho tang vật vào túi ni lông không cần niêm phong."],["C","Gửi qua đường bưu điện."],["D","Đưa tang vật cho nhân viên hãng hàng không cầm hộ."]],"a":"B","e":"","g":"AN NINH HÀNG KHÔNG VÀ PHẠM VI SỬ DỤNG THẺ"},{"n":72,"q":"Khi thực hiện kiểm tra an ninh đối với đối tượng ưu tiên/khách VIP (theo quy định của Nhà nước), quy tắc kiểm tra soi chiếu là gì?","o":[["A","Miễn kiểm tra soi chiếu hoàn toàn trong mọi trường hợp."],["B","Thực hiện kiểm tra an ninh theo quy định/nghị định thư đặc biệt đối với đối tượng ưu tiên nhưng vẫn phải đảm bảo tuyệt đối an toàn an ninh hàng không."],["C","Kiểm tra gắt gao hơn khách thông thường."],["D","Yêu cầu đối tượng xếp hàng như hành khách phổ thông."]],"a":"B","e":"","g":"AN NINH HÀNG KHÔNG VÀ PHẠM VI SỬ DỤNG THẺ"},{"n":73,"q":"Khi phát hiện VŨ KHÍ QUÂN DỤNG (Súng ngắn, đạn) trong hành lý xách tay của hành khách tại luồng soi chiếu, thao tác ứng xử ban đầu của lực lượng soi chiếu là:","o":[["A","Hô khoán lên cho toàn bộ sảnh bay biết."],["B","Bình tĩnh khống chế luồng soi, dừng băng chuyền, cô lập hành lý, báo hiệu nội bộ cho đồng đội tiếp cận giám sát chặt chẽ hành khách, báo cáo Chỉ huy xử lý và tạm giữ đối tượng."],["C","Lấy súng ra khỏi túi."],["D","Trả lại túi cho khách và yêu cầu khách cất đi."]],"a":"B","e":"","g":"AN NINH HÀNG KHÔNG VÀ PHẠM VI SỬ DỤNG THẺ"},{"n":74,"q":"Trong quy trình kiểm tra soi chiếu hành khách, yêu cầu cởi bỏ áo khoác, mũ, giày, thắt lưng, thiết bị điện tử lớn (laptop, tablet) ra khỏi hành lý để soi riêng nhằm mục đích gì?","o":[["A","Gây khó khăn cho hành khách để kéo dài thời gian ca trực."],["B","Giảm mật độ hình ảnh đè đè lớp trong máy soi, giúp hình ảnh rõ ràng và tránh bỏ sót vật phẩm nguy hiểm."],["C","Giúp nhân viên phục vụ hành lý làm việc nhanh hơn."],["D","Theo yêu cầu của cơ quan Hải quan."]],"a":"B","e":"","g":"AN NINH HÀNG KHÔNG VÀ PHẠM VI SỬ DỤNG THẺ"},{"n":75,"q":"Giới hạn dung lượng đối với Pin Lithium-ion trong thiết bị điện tử/pin dự phòng được phép mang theo người, hành lý xách tay mà KHÔNG CẦN sự chấp thuận của hãng hàng không là:","o":[["A","Không quá 100 Wh."],["B","Từ 100 Wh đến 160 Wh."],["C","Trên 160 Wh."],["D","Không giới hạn dung lượng."]],"a":"A","e":"","g":"AN NINH HÀNG KHÔNG VÀ PHẠM VI SỬ DỤNG THẺ"},{"n":76,"q":"Mục đích chính của công tác kiểm tra soi chiếu an ninh hàng không là gì?","o":[["A","Thu thuế hàng hóa của hành khách."],["B","Phát hiện, ngăn chặn kịp thời vũ khí, đạn dược, chất nổ, vật phẩm nguy hiểm đưa trái phép vào khu vực hạn chế và lên tàu bay."],["C","Kiểm tra hành lý quá cước của các hãng hàng không."],["D","Phát hiện hàng giả, hàng nhái thương hiệu."]],"a":"B","e":"","g":"AN NINH HÀNG KHÔNG VÀ PHẠM VI SỬ DỤNG THẺ"},{"n":77,"q":"Khi kiểm tra thủ công (mở hành lý) của hành khách tại bàn kiểm tra, nguyên tắc an toàn nghiệp vụ quan trọng nhất là gì?","o":[["A","Nhân viên tự ý thò tay thấu sâu vào đáy túi ngay lập tức."],["B","Yêu cầu hành khách tự mở hành lý/túi xách dưới sự quan sát của cán bộ soi chiếu, quan sát trực quan cẩn thận trước khi chạm vào để tránh bị vật nhọn/vật nguy hiểm gây thương tích hoặc bị vu khống."],["C","Đổ toàn bộ đồ đạc trong túi hành khách ra sàn nhà."],["D","Mở túi ở nơi kín đáo không có camera."]],"a":"B","e":"","g":"AN NINH HÀNG KHÔNG VÀ PHẠM VI SỬ DỤNG THẺ"},{"n":78,"q":"Thời gian tối đa cho phép một cán bộ soi chiếu ngồi liên tục quan sát màn hình máy soi X-ray (để đảm bảo sự tập trung thị giác) ở khu vực hành lí xách tay theo tiêu chuẩn quy định thường là bao lâu?","o":[["A","30 phút (sau đó phải luôn phiên vị trí)."],["B","2 tiếng liên tục."],["C","4 tiếng liên tục."],["D","Toàn bộ ca trực."]],"a":"A","e":"","g":"AN NINH HÀNG KHÔNG VÀ PHẠM VI SỬ DỤNG THẺ"},{"n":79,"q":"Khi phát hiện hình ảnh nghi vấn là THIẾT BỊ NỔ TỰ CHẾ (IED) gồm có: kíp nổ, nguồn điện, dây dẫn, khối chất nổ/chất màu cam đậm trong hành lý tại máy soi, cán bộ vận hành máy soi phải lập tức làm gì?","o":[["A","Ấn nút dừng khẩn cấp băng chuyền (giữ hành lý bên trong khoang soi), không di chuyển hành lý, lập tức báo cáo Tổ trưởng/Chỉ huy kích hoạt phương án ứng phó khẩn cấp."],["B","Kéo hành lý ra ngoài để kiểm tra xem dây điện nối đi đâu."],["C","Gọi hành khách lại tự mở túi ra kiểm tra."],["D","Bê hành lý chạy ra ngoài sảnh công cộng."]],"a":"A","e":"","g":"AN NINH HÀNG KHÔNG VÀ PHẠM VI SỬ DỤNG THẺ"},{"n":80,"q":"Việc ghi âm, ghi hình trong khu vực hạn chế, tại các điểm kiểm tra an ninh hàng không, trong nơi làm việc của cơ quan quản lý nhà nước tại cảng hàng không, sân bay phải được đơn vị chủ quản cho phép bằng văn bản, trừ các trường hợp sau:","o":[["A","Việc ghi âm, ghi hình thông tin, tài liệu thuộc phạm vi bí mật nhà nước thực hiện theo các quy định về bảo vệ bí mật Nhà nước;"],["B","Ghi âm, ghi hình tại phòng chờ lên tàu bay, chờ lấy hành lý mà không phải điểm kiểm tra an ninh hàng không;"],["C","Cơ quan quản lý nhà nước, đơn vị kiểm soát an ninh hàng không ghi âm, ghi hình phục vụ công vụ theo thẩm quyền, trách nhiệm được giao."],["D","Cả a, b và c đều đúng"]],"a":"D","e":"","g":"AN NINH HÀNG KHÔNG VÀ PHẠM VI SỬ DỤNG THẺ"},{"n":81,"q":"Người sử dụng thẻ kiểm soát an ninh hàng không có giá trị sử dụng ngắn khi vào, hoạt động trong khu vực hạn chế phải được Người có thẻ kiểm soát an ninh giá trị sử dụng dài hạn phù hợp hộ tống?","o":[["A","Đúng"],["B","Sai"]],"a":"A","e":"","g":"AN NINH HÀNG KHÔNG VÀ PHẠM VI SỬ DỤNG THẺ"},{"n":82,"q":"Khi Người hộ tống đưa Người có thẻ kiểm soát an ninh ngắn hạn vào khu vực hạn chế phải?","o":[["A","Đăng ký với ca trực của đơn vị kiểm soát an ninh hàng không tại điểm kiểm tra an ninh trước khi đưa người được hộ tống vào."],["B","Sau khi hoàn thành việc hộ tống, người hộ tống phải xác nhận về việc đưa người được hộ tống ra khỏi khu vực hạn chế với ca trực của đơn vị kiểm soát an ninh hàng không."],["C","Việc đăng ký đưa vào và xác nhận đưa ra phải thực hiện tại cùng một điểm kiểm tra an ninh."],["D","Cả a, b và c đều đúng"]],"a":"D","e":"","g":"AN NINH HÀNG KHÔNG VÀ PHẠM VI SỬ DỤNG THẺ"},{"n":83,"q":"Việc kiểm tra đối với người khi vào, ra và hoạt động tại khu vực hạn chế trừ trường hợp hành khách, hành lý, hàng hóa, bưu gửi và đồ vật đưa lên tàu bay phải đảm bảo:","o":[["A","Kiểm tra thẻ kiểm soát an ninh hàng không, quan sát đối chiếu thực tế;"],["B","Kiểm tra người bằng cổng từ, thiết bị phát hiện kim loại cầm tay tại những nơi có cổng từ, thiết bị phát hiện kim loại cầm tay."],["C","Kiểm tra trực quan tại những điểm không có cổng từ, thiết bị phát hiện kim loại cầm tay."],["D","Cả a, b và c đều đúng"]],"a":"D","e":"","g":"AN NINH HÀNG KHÔNG VÀ PHẠM VI SỬ DỤNG THẺ"},{"n":84,"q":"Việc kiểm tra phương tiện khi vào, ra và hoạt động tại khu vực hạn chế trừ trường hợp hành khách, hành lý, hàng hóa, bưu gửi và đồ vật đưa lên tàu bay phải đảm bảo:","o":[["A","Yêu cầu người điều khiển phương tiện và những người đi cùng rời khỏi phương tiện;"],["B","Kiểm tra giấy phép của phương tiện; Quan sát, kiểm tra bên ngoài phương tiện; Dùng gương soi kiểm tra gầm, bề mặt phía trên của phương tiện;"],["C","Kiểm tra trực quan bên trong buồng lái, khoang máy của phương tiện."],["D","Cả a, b và c đều đúng."]],"a":"D","e":"","g":"AN NINH HÀNG KHÔNG VÀ PHẠM VI SỬ DỤNG THẺ"},{"n":85,"q":"Những trường hợp nào cần phải được niêm phong an ninh hàng không sau khi kiểm tra?","o":[["A","Thùng đựng hàng hóa, bưu gửi, thùng hoặc mâm đựng hàng hóa rời, hành lý thất lạc, hành lý không có người nhận, tủ, túi đựng suất ăn;"],["B","Thùng, túi đựng đồ vật phục vụ trên tàu bay, trừ đồ vật phục vụ cho việc bảo dưỡng, sửa chữa tàu bay;"],["C","Phương tiện tra nạp nhiên liệu cho tàu bay sau khi tiếp nhận nhiên liệu để nạp cho tàu bay phải niêm phong an ninh các cửa nạp, cửa xả; tàu bay không khai thác phải niêm phong an ninh các cửa của tàu bay."],["D","Cả a, b và c đều đúng."]],"a":"D","e":"","g":"AN NINH HÀNG KHÔNG VÀ PHẠM VI SỬ DỤNG THẺ"},{"n":86,"q":"Việc kiểm tra an ninh hàng không đối với hành khách khuyết tật, thương binh, bệnh nhân sử dụng xe đẩy, cáng cứu thương, có gắn các thiết bị phụ trợ y tế trên người được thực hiện như thế nào?","o":[["A","Bằng trực quan"],["B","Bằng các biện pháp thích hợp khác tại nơi phù hợp."],["C","Bằng trực quan hoặc các biện pháp thích hợp khác tại nơi phù hợp."],["D","Cả A, B và C đều sai."]],"a":"C","e":"","g":"AN NINH HÀNG KHÔNG VÀ PHẠM VI SỬ DỤNG THẺ"},{"n":87,"q":"Trường hợp Hành khách đi qua cổng từ hoặc thiết bị soi chiếu cơ thể (nếu có), nếu cổng từ hoặc thiết bị soi chiếu cơ thể báo động hoặc hành khách có biểu hiện nghi vấn thì cán bộ kiểm soát an ninh hàng không kiểm tra như thế nào?","o":[["A","Kiểm tra bằng thiết bị phát hiện kim loại cầm tay."],["B","Kiểm tra trực quan hành khách."],["C","Sử dụng kết hợp thiết bị phát hiện kim loại cầm tay và kiểm tra trực quan để kiểm tra hành khách"],["D","Cả A, B và C đều sai."]],"a":"C","e":"","g":"AN NINH HÀNG KHÔNG VÀ PHẠM VI SỬ DỤNG THẺ"},{"n":88,"q":"Hành khách, hành lý xách tay đã hoàn tất thủ tục kiểm tra an ninh thì không cần phải giám sát liên tục bằng ca-me-ra an ninh hoặc cán bộ kiểm soát an ninh hàng không cho đến khi lên tàu bay.","o":[["A","Đúng"],["B","Sai"]],"a":"B","e":"","g":"AN NINH HÀNG KHÔNG VÀ PHẠM VI SỬ DỤNG THẺ"},{"n":89,"q":"Việc kiểm tra an ninh hàng không đối với thi thể người đặt trong hòm kẽm gắn kín được vận chuyển bằng tàu bay như thế nào?","o":[["A","Miễn soi chiếu và kiểm tra trực quan."],["B","Phải được cơ quan y tế có thẩm quyền giám sát. Hòm kẽm phải còn nguyên niêm phong."],["C","Có văn bản xác nhận của cơ quan y tế giám sát kèm theo giấy chứng tử."],["D","Cả a, b và c đều đúng"]],"a":"D","e":"","g":"AN NINH HÀNG KHÔNG VÀ PHẠM VI SỬ DỤNG THẺ"},{"n":90,"q":"Việc kiểm tra an ninh đối với những hàng hóa nguy hiểm như các vật liệu cho nghiên cứu hạt nhân, vật liệu phóng xạ như nào?","o":[["A","Miễn soi chiếu và kiểm tra trực quan"],["B","Bao bì phải có niêm phong"],["C","Có văn bản xác nhận tình trạng đóng gói an toàn, văn bản đề nghị của cơ quan nhà nước có thẩm quyền"],["D","Cả a, b và c đều đúng"]],"a":"D","e":"","g":"AN NINH HÀNG KHÔNG VÀ PHẠM VI SỬ DỤNG THẺ"},{"n":91,"q":"Việc kiểm tra an ninh đối với hài cốt, tro cốt như thế nào?","o":[["A","Được thực hiện như đối với hàng hóa, hành lý thông thường"],["B","Trừ trường hợp có đề nghị miễn soi chiếu của cơ quan nhà nước có liên quan, cơ quan đại diện ngoại giao của nước ngoài"],["C","Phải được người đứng đầu đơn vị kiểm soát an ninh hàng không tại cảng hàng không, sân bay chấp nhận."],["D","Cả a, b và c đều đúng"]],"a":"D","e":"","g":"AN NINH HÀNG KHÔNG VÀ PHẠM VI SỬ DỤNG THẺ"},{"n":92,"q":"Quy định về việc mang trang thiết bị y tế là vật phẩm nguy hiểm theo người lên tàu bay để chăm sóc bệnh nhân và đối tượng cảnh vệ như thế nào?","o":[["A","Phải có đề nghị bằng văn bản"],["B","Được sự đồng ý của đại diện hãng hàng không"],["C","Được sự đồng ý của người đứng đầu đơn vị kiểm soát an ninh hàng không tại cảng hàng không, sân bay."],["D","Cả a, b và c đều đúng"]],"a":"D","e":"","g":"AN NINH HÀNG KHÔNG VÀ PHẠM VI SỬ DỤNG THẺ"},{"n":94,"q":"Việc tái kiểm tra an ninh hàng không đối hành khách, hành lý trong khu vực hạn chế khi có sự tiếp xúc, trộn lẫn với người nghi ngờ mang theo vật phẩm nguy hiểm hoặc phương tiện, đồ vật nghi ngờ chứa vật phẩm nguy hiểm, đồ vật chưa qua kiểm tra an ninh hàng không được thực hiện như thế nào?","o":[["A","Tất cả hành khách, hành lý xách tay phải được chuyển sang một khu vực khác, kiểm tra lại toàn bộ khu vực hạn chế liên quan;"],["B","Tái kiểm tra an ninh hàng không toàn bộ hành khách, hành lý xách tay trước khi cho lên tàu bay"],["C","Trường hợp hành khách đã lên tàu bay, toàn bộ hành khách, hành lý xách tay và khoang hành khách của tàu bay phải được tái kiểm tra an ninh hàng không."],["D","Cả a, b và c đều đúng"]],"a":"D","e":"","g":"AN NINH HÀNG KHÔNG VÀ PHẠM VI SỬ DỤNG THẺ"},{"n":95,"q":"Lực lượng kiểm soát an ninh hàng không làm gì khi phát hiện hoặc nghi vấn bom, mìn, vật liệu nổ, tiền chất thuốc nổ, chất cháy,  tác nhân sinh học, hóa học, chất độc, phóng xạ có nguy cơ gây nguy hiểm?","o":[["A","Phải lập tức đánh giá nguy cơ để có biện pháp xử lý thích hợp."],["B","Trường hợp là bom, mìn, vật liệu nổ nếu không biết rõ về cơ chế nổ thì để nguyên tại chỗ,"],["C","Nhanh chóng phong tỏa khu vực đó, sơ tán hành khách đến nơi an toàn và thông báo ngay cho lực lượng phá dỡ bom mìn của ngành công an, quân đội đến để tháo gỡ."],["D","Cả a, b và c đều đúng"]],"a":"D","e":"","g":"AN NINH HÀNG KHÔNG VÀ PHẠM VI SỬ DỤNG THẺ"},{"n":96,"q":"Lực lượng kiểm soát an ninh hàng không làm gì khi phát hiện vũ khí, vật liệu nổ trong người hành khách ?","o":[["A","Phải nhanh chóng bằng biện pháp thích hợp khống chế,"],["B","Ngăn chặn để xử lý; phát hiện vũ khí, vật liệu nổ trong của hành"],["C","Cả a và b đều đúng"]],"a":"C","e":"","g":"AN NINH HÀNG KHÔNG VÀ PHẠM VI SỬ DỤNG THẺ"},{"n":97,"q":"Lực lượng kiểm soát an ninh hàng không làm gì khi phát hiện vũ khí, vật liệu nổ trong hành lý xách tay của người hành khách ?","o":[["A","Phải cách ly ngay hành khách với hành lý,"],["B","Khống chế hành khách để xử lý."],["C","Cả a và b đều đúng"]],"a":"C","e":"","g":"AN NINH HÀNG KHÔNG VÀ PHẠM VI SỬ DỤNG THẺ"},{"n":98,"q":"Cơ quan nào có chức năng phối hợp với nhà chức trách có thẩm quyền của nước ngoài và các hãng hàng không trong việc triển khai sĩ quan an ninh trên không thực hiện nhiệm vụ trên các chuyến bay?","o":[["A","Cục hàng không Việt Nam"],["B","Cục Quản lý xuất nhập cảnh"],["C","Cảng vụ hàng không"],["D","Tổng công ty Cảng hàng không"]],"a":"B","e":"","g":"AN NINH HÀNG KHÔNG VÀ PHẠM VI SỬ DỤNG THẺ"},{"n":99,"q":"Trách nhiệm của Lực lượng kiểm soát an ninh hàng không khi xử lý ban đầu các vụ việc vi phạm an ninh hàng không, trật tự công cộng xảy ra tại cảng hàng không, sân bay gồm những gì?","o":[["A","Ngăn chặn hành vi vi phạm; tạm giữ đối tượng vi phạm;"],["B","Kiểm tra, lục soát, thu giữ tang vật, chứng cứ;"],["C","Đưa người, tang vật vi phạm về nơi quy định để giải quyết, xử lý vi phạm, lập biên bản vi phạm."],["D","Bảo vệ hiện trường và trao đổi các cơ quan, đơn vị liên quan tại cảng hàng không, sân bay nếu xét thấy cần thiết."],["E","Cả a, b, c, d đều đúng"]],"a":"E","e":"","g":"AN NINH HÀNG KHÔNG VÀ PHẠM VI SỬ DỤNG THẺ"}]},{"id":"antt","name":"ANTT – An ninh trật tự nhà ga","open":false,"qs":[{"n":1,"q":"Theo Nghị định số 215/2026/NĐ-CP ngày 18/6/2026, khái niệm thẻ kiểm soát ANHK là gì?","o":[["A","Là tài liệu xác nhận phương tiện được phép ra vào và hoạt động trong khu vực hạn chế của cảng hàng không, sân bay."],["B","Là tài liệu xác nhận người được phép vào và hoạt động trong khu vực hạn chế liên quan của cảng hàng không, sân bay."],["C","Là tài liệu xác nhận người và phương tiện được phép vào và hoạt động trong khu vực hạn chế liên quan của cảng hàng không, sân bay."],["D","Tất cả các phương án trên đều sai."]],"a":"B","e":"","g":""},{"n":2,"q":"Khu vực nào sau đây KHÔNG phải là khu vực hạn chế tại Cảng hàng không, sân bay?","o":[["A","Khu vực giao nhận hành lý cho khách tại nhà ga đến."],["B","Khu vực làm thủ tục hàng không."],["C","Khu vực dành cho hành khách quá cảnh nối chuyến chờ để chuyển tiếp chuyến bay."],["D","Khu vực phục vụ hành lý ký gửi sau khi đã được kiểm tra an ninh hàng không để đưa lên tàu bay."]],"a":"B","e":"","g":""},{"n":3,"q":"Đâu KHÔNG phải là đối tượng tiềm ẩn uy hiếp an ninh hàng không?","o":[["A","Người bị mất khả năng nhận thức hoặc điều khiển hành vi của mình."],["B","Người bị từ chối nhập cảnh, người bị trục xuất."],["C","Bị can, bị cáo phạm nhân."],["D","Người bị dẫn độ hoặc bị bắt theo quyết định truy nã."]],"a":"B","e":"","g":""},{"n":4,"q":"Thẩm quyền quyết định việc lục soát ANHK đối với hành lý, đồ vật không xác định được chủ sở hữu?","o":[["A","Chỉ huy đội trực ca công tác tại các vị trí."],["B","Người đứng đầu tổ chức xử lý hàng hóa, bưu gửi để đưa lên tàu bay."],["C","Đại diện hãng hàng không đối với các hành lý có Tag hành lý của hãng hàng không đó."],["D","Chỉ huy đội trực ca công tác tại mục tiêu đảm nhiệm."]],"a":"D","e":"","g":""},{"n":5,"q":"Điểm kiểm tra an ninh hàng không là gì?","o":[["A","Là vị trí làm việc của cán bộ, chiến sĩ, nhân viên kiểm soát an ninh hàng không."],["B","Là vị trí làm việc của cán bộ, chiến sĩ, nhân viên kiểm soát an ninh hàng không được thiết lập tại các cổng, cửa, lối đi giữa các khu vực hạn chế nhằm kiểm tra an ninh hàng không người, phương tiện, đồ vật, duy trì an ninh, trật tự khu vực điểm kiểm tra an ninh hàng không."],["C","Là vị trí làm việc của cán bộ, chiến sĩ, nhân viên kiểm soát an ninh hàng không được thiết lập tại các cổng, cửa, lối đi giữa các khu vực hạn chế hoặc giữa khu vực hạn chế với khu vực khác, nhằm kiểm tra an ninh hàng không người, phương tiện, đồ vật, duy trì an ninh, trật tự khu vực điểm kiểm tra an ninh hàng không."],["D","Là vị trí làm việc của nhân viên kiểm soát an ninh hàng không được thiết lập tại các cổng, cửa, lối đi giữa các khu vực hạn chế hoặc giữa khu vực hạn chế với khu vực khác, nhằm kiểm tra an ninh hàng không người, phương tiện, đồ vật, duy trì an ninh, trật tự khu vực điểm kiểm tra an ninh hàng không."]],"a":"C","e":"","g":""},{"n":6,"q":"Khái niệm điểm kiểm soát ANHK?","o":[["A","Là vị trí làm việc của cán bộ, chiến sĩ, nhân viên kiểm soát an ninh hàng không được thiết lập tại các cổng, cửa, lối đi giữa các khu vực hạn chế hoặc giữa khu vực hạn chế với khu vực khác, nhằm kiểm tra an ninh hàng không người, phương tiện, đồ vật, duy trì an ninh, trật tự khu vực điểm kiểm tra an ninh hàng không."],["B","Là vị trí làm việc của cán bộ, chiến sĩ, nhân viên kiểm soát an ninh hàng không được thiết lập tại khu vực công cộng hoặc khu vực hạn chế nhằm kiểm soát hoạt động của người, phương tiện, duy trì an ninh, trật tự trong phạm vi được giới hạn quanh điểm kiểm soát."],["C","Là vị trí làm việc của cán bộ, chiến sĩ, nhân viên kiểm soát an ninh hàng không được thiết lập tại khu vực hạn chế nhằm kiểm soát hoạt động của người, phương tiện, duy trì an ninh, trật tự trong phạm vi được giới hạn quanh điểm kiểm soát."],["D","Là vị trí làm việc của cán bộ, chiến sĩ, nhân viên kiểm soát an ninh hàng không được thiết lập tại khu vực công cộng nhằm kiểm soát hoạt động của người, phương tiện, duy trì an ninh, trật tự trong phạm vi được giới hạn quanh điểm kiểm soát."]],"a":"B","e":"","g":""},{"n":7,"q":"Điền nội dung thích hợp vào chỗ trống: Kiểm tra trực quan là việc cán bộ, chiến sĩ, nhân viên kiểm soát an ninh hàng không trực tiếp ......(1) ...... để kiểm tra ...... (2) ...... nhằm nhận biết và phát hiện vật có nghi ngờ, vật phẩm nguy hiểm.","o":[["A","(1) sử dụng tay, mắt và các giác quan khác; (2) người, phương tiện, đồ vật."],["B","(1) sử dụng tay, mắt và các giác quan khác (2) người, phương tiện."],["C","(1) sử dụng tay, mắt; (2) người, phương tiện."],["D","(1) các giác quan; (2) người, phương tiện."]],"a":"A","e":"","g":""},{"n":8,"q":"Quy định về việc ra, vào và hoạt động tại khu vực hạn chế nào sau đây là SAI?","o":[["A","Người, phương tiện khi ra, vào và hoạt động tại khu vực hạn chế phải có thẻ, giấy phép kiểm soát an ninh nội bộ, thẻ giám sát viên an ninh hàng không do cơ quan, đơn vị có thẩm quyền cấp được phép ra, vào khu vực đó."],["B","Thẻ phải đeo ở vị trí phía trước ngực bảo đảm quan sát được mặt trước của thẻ trong suốt thời gian hoạt động trong khu vực hạn chế, giấy phép phải để ở phía trước buồng lái hoặc tại vị trí dễ nhận biết của phương tiện."],["C","Người, đồ vật mang theo, phương tiện ra, vào khu vực hạn chế phải đúng cổng, cửa quy định, tuân thủ hướng dẫn và các quy định về an ninh, khai thác tại khu vực hạn chế; chịu sự kiểm tra, giám sát an ninh hàng không thích hợp."],["D","Người sử dụng thẻ kiểm soát an ninh hàng không có giá trị sử dụng ngắn hạn phải được hộ tống khi vào, hoạt động trong khu vực hạn chế."]],"a":"A","e":"","g":""},{"n":9,"q":"Theo Thông tư 14/2026/TT-BCA, người được giao nhiệm vụ hộ tống người sử dụng thẻ KSAN hàng không có giá trị sử dụng ngắn hạn phải là?","o":[["A","Người thường xuyên làm việc tại khu vực hạn chế của cơ quan đề nghị cấp thẻ ngắn hạn; Người của: cơ quan chủ quản khu vực hạn chế; cơ quan quản lý khu vực hạn chế; đơn vị hoạt động thường xuyên tại khu vực hạn chế."],["B","Người của đơn vị kiểm soát an ninh hàng không, Cảng vụ hàng không."],["C","Cả A & B đều đúng."],["D","Cả A & B đều sai."]],"a":"C","e":"","g":""},{"n":10,"q":"Hành khách được phép ghi âm, ghi hình tại địa điểm nào sau đây?","o":[["A","Phòng chờ lên tàu bay, chờ lấy hành lý mà không phải điểm kiểm tra an ninh hàng không."],["B","Khu vực làm thủ tục nhập cảnh, xuất cảnh."],["C","Khu vực văn phòng của các cơ quan Nhà nước tại Cảng hàng không, sân bay."],["D","Điểm kiểm tra soi chiếu hành khách, hành lý."]],"a":"A","e":"","g":""},{"n":11,"q":"Nhận định nào sau đây quy định việc mang vật phẩm nguy hiểm vào khu vực hạn chế là ĐÚNG?","o":[["A","Việc mang, quản lý, sử dụng vật phẩm nguy hiểm trong khu vực hạn chế phải được quy định cụ thể trong chương trình an ninh hàng không của đơn vị sử dụng vật phẩm nguy hiểm trên cơ sở danh mục các vật phẩm nguy hiểm cấm hoặc hạn chế mang theo người và hành lý vào khu vực hạn chế, lên tàu bay do Cục Quản lý xuất nhập cảnh ban hành."],["B","Đơn vị sử dụng vật phẩm nguy hiểm phục vụ cho công việc của các cơ quan, đơn vị trong khu vực hạn chế thuộc nhà ga, sân bay phải đăng ký với đơn vị kiểm soát an ninh hàng không."],["C","Đơn vị sử dụng vật phẩm nguy hiểm tự tổ chức kiểm tra, giám sát việc mang vật phẩm nguy hiểm ra vào khu vực hạn chế."],["D","Đơn vị kiểm soát an ninh hàng có trách nhiệm tổ chức quản lý đối với vật phẩm nguy hiểm trong khu vực hạn chế."]],"a":"B","e":"","g":""},{"n":12,"q":"Đâu KHÔNG phải là tài liệu cần có tại điểm kiểm tra an ninh hàng không?","o":[["A","Quy trình kiểm tra người, đồ vật, phương tiện khi ra, vào khu vực hạn chế."],["B","Mẫu thẻ, giấy phép kiểm soát an ninh hàng không được phép vào khu vực; mẫu thẻ giám sát viên an ninh hàng không."],["C","Danh sách những người, phương tiện được phép ra, vào khu vực hạn chế."],["D","Danh bạ các số điện thoại liên quan và các biểu mẫu, biên bản, phiếu đăng ký vật phẩm nguy hiểm, phương tiện, đồ vật mang vào khu vực hạn chế; danh mục đồ vật phải đăng ký hoặc khai báo tại điểm kiểm tra an ninh hàng không khi mang theo người vào trong khu vực hạn chế; đồ vật không được mang theo người vào làm việc tại các khu vực hạn chế."]],"a":"C","e":"","g":""},{"n":13,"q":"Điền nội dung thích hợp vào chỗ trống: Đơn vị kiểm soát an ninh hàng không phải .......(1)........ đối với hành khách, người, phương tiện hoạt động trong các khu vực hạn chế bằng các biện pháp thích hợp nhằm phát hiện những biểu hiện nghi ngờ, .....(2)...... những hành vi vi phạm; ........................(3)..........................và thực hiện các biện pháp an ninh hàng không khác.","o":[["A","(1) tổ chức giám sát liên tục; (2) ngăn chặn kịp thời; (3) kiểm tra, xử lý hành lý, đồ vật không xác nhận được chủ."],["B","(1) theo dõi ; (2) răn đe, giáo dục; (3) kiểm tra, xử lý hành lý, đồ vật không xác nhận được chủ."],["C","(1) tổ chức giám sát liên tục; (2) răn đe, giáo dục; (3) kiểm tra, xử lý hành lý, đồ vật không xác nhận được chủ."],["D","(1) theo dõi; (2) ngăn chặn kịp thời; (3) kiểm tra, xử lý hành lý, đồ vật không xác nhận được chủ."]],"a":"A","e":"","g":""},{"n":14,"q":"Nội dung kiểm tra đối với người, phương tiện, hàng hóa, đồ vật đưa vào khu vực hạn chế?","o":[["A","Thẻ, giấy phép kiểm soát an ninh hàng không."],["B","Người, đồ vật mang theo người; hàng hoá, đồ vật phục vụ trong khu vực hạn chế và giấy tờ cần thiết (nếu có)."],["C","Phương tiện và đồ vật trên phương tiện."],["D","Cả 03 đáp án trên."]],"a":"D","e":"","g":""},{"n":15,"q":"Trường hợp nào người, phương tiện, hàng hóa, đồ vật đưa ra ngoài khu vực hạn chế được lực lượng kiểm soát ANHK kiểm tra?","o":[["A","Có biểu hiện nghi ngờ: trộm cắp tài sản, buôn lậu và gian lận thương mại."],["B","Trong các trường hợp tăng cường bảo đảm ANHK."],["C","Theo chỉ đạo của cơ quan quản lý nhà nước có thẩm quyền."],["D","Cả 03 đáp án nêu trên."]],"a":"D","e":"","g":""},{"n":16,"q":"Tại điểm kiểm tra ANHK đối với người, đồ vật khi ra, vào hoạt động tại khu vực hạn chế (trừ trường hợp hành khách, hành lý, hàng hóa, bưu gửi và đồ vật đưa lên tàu bay), trong trường hợp cổng từ, thiết bị phát hiện kim loại cầm tay không có báo động thì phải kiểm tra trực quan ngẫu nhiên","o":[["A","Tối thiểu 5%"],["B","Tối thiểu 7%"],["C","Tối thiểu 10%"],["D","Tối thiểu 15%"]],"a":"A","e":"","g":""},{"n":17,"q":"Sắp xếp các nội dung sau đây theo quy trình xử lý hành khách gây rối (trường hợp hành khách chưa lên tàu bay) (1) Báo cáo ngay cho chỉ huy đơn vị trực ca công tác, lập biên bản vi phạm theo mẫu quy định tại Phụ lục XVIII ban hành kèm theo Thông tư số 14/2026/TT-BCA. (2) Kiểm tra, lục soát, thu giữ tang vật, chứng cứ. (3) Đưa người, tang vật vi phạm về nơi quy định để giải quyết, xử lý vi phạm. (4) Ngăn chặn không cho phép hành khách lên tàu bay, tạm giữ người, giấy tờ về nhân thân của hành khách. (5)  Bảo vệ hiện trường và trao đổi các cơ quan, đơn vị liên quan tại cảng hàng không, sân bay nếu xét thấy cần thiết. Kết quả là:","o":[["A","(4)-(2)-(3)-(1)-(5)."],["B","(4)-(2)-(1)-(5)-(3)."],["C","(1)-(2)-(5)-(4)-(3)."],["D","(1)-(2)-(4)-(5)-(3)."]],"a":"A","e":"","g":""},{"n":18,"q":"Hành lý không có người nhận là gì?","o":[["A","Là hành lý được hành khách, thành viên tổ bay mang theo người lên tàu bay và do hành khách, thành viên tổ bay bảo quản trong quá trình vận chuyển."],["B","Là hành lý bị bỏ tại cảng hàng không, sân bay mà không có căn cứ xác định được chủ của đồ vật, hành lý đó."],["C","Là hành lý của hành khách, tổ bay bị tách rời khỏi hành khách, tổ bay trong quá trình vận chuyển."],["D","Là hành lý đến một cảng hàng không, sân bay mà không được hành khách, tổ bay lấy hoặc nhận."]],"a":"D","e":"","g":""},{"n":19,"q":"Theo Thông tư 14/2026/TT-BCA, đồ vật, hành lý không xác định được chủ là gì?","o":[["A","Là đồ vật, hành lý bị bỏ lại tại cảng hàng không, sân bay mà không có căn cứ xác định được chủ của đồ vật, hành lý đó."],["B","Là hành lý đến một cảng hàng không, sân bay mà không được hành khách, tổ bay lấy hoặc nhận."],["C","Là hành lý của hành khách, tổ bay bị tách rời khỏi hành khách, tổ bay trong quá trình vận chuyển."],["D","Là đồ vật của hành khách, tổ bay đến một cảng hàng không, sân bay mà không được hành khách, tổ bay lấy hoặc nhận."]],"a":"A","e":"","g":""},{"n":20,"q":"Theo Thông tư 14/2026/TT-BCA, việc lên tàu bay của lực lượng kiểm soát an ninh hàng không để trấn áp, cưỡng chế, áp giải đối tượng vi phạm được thực hiện theo yêu cầu của tổ chức, cá nhân nào (trừ trường hợp đối phó với hành vi can thiệp bất hợp pháp vào hoạt động hàng không dân dụng)","o":[["A","Người khai thác cảng hoặc đại diện hãng hàng không."],["B","Cảng vụ hàng không hoặc người khai thác cảng."],["C","Người chỉ huy tàu bay hoặc người khai thác cảng."],["D","Người chỉ huy tàu bay hoặc người đứng đầu đơn vị kiểm soát an ninh hàng không."]],"a":"D","e":"","g":""},{"n":21,"q":"Đâu KHÔNG phải là đối tượng kiểm tra tại điểm kiểm tra an ninh hàng không ĐKT-QT-06-T2 (Nội bộ 2)?","o":[["A","Nhân viên nội bộ và đồ vật mang theo người vào/ra khu vực hạn chế để thực hiện nhiệm vụ đảm bảo hoạt động bay và các dịch vụ khác tại Cảng HKQT Tân Sơn Nhất đã được cấp thẻ kiểm soát an ninh hàng không theo quy định."],["B","Người, vật tư, công cụ, dụng cụ, trang thiết bị vào/ra khu vực hạn chế để khảo sát, thi công, bảo trì, bảo dưỡng đã được cấp thẻ kiểm soát an ninh hàng không và danh mục công cụ, dụng cụ đã được lãnh đạo Công an cửa khẩu Cảng HKQT Tân Sơn Nhất phê duyệt theo quy định."],["C","Hàng hóa, đồ vật mang vào bán, sử dụng trong khu vực cách ly."],["D","Hành khách, hành lý được giám sát, hộ tống bởi nhân viên phục vụ mặt đất hoặc Đại diện hãng hàng không vào/ra khu vực hạn chế để kiểm tra, xác minh trong trường hợp bị mất mát, thất lạc hành lý trong quá trình vận chuyển."]],"a":"D","e":"","g":""},{"n":22,"q":"Hãy chọn bước 1 của quy trình kiểm tra người bằng thiết bị phát hiện kim loại cầm tay","o":[["A","Đưa thiết bị phát hiện kim loại từ ngang đầu phía trên tai trái (phải), dọc theo phần thân bên trái (phải), đến mắt cá chân."],["B","Đưa thiết bị phát hiện kim loại từ mắt cá chân bên phải (trái) lên phần thân bên phải (trái), đến ngang đầu phía trên tai phải (trái)."],["C","Đưa thiết bị phát hiện kim loại ra phía trước ngực, dò xuống đến cổ chân (đảm bảo phủ kính phần thân trước và hai chân)."],["D","Quét dò 02 chân bằng cách đưa thiết bị phát hiện kim loại lên xuống giữa 02 chân (từ mắt cá trong đến đáy quần)."]],"a":"A","e":"","g":""},{"n":23,"q":"Hãy chọn bước 5 của quy trình kiểm tra người bằng thiết bị phát hiện kim loại cầm tay","o":[["A","Đưa thiết bị phát hiện kim loại từ mắt cá chân bên phải (trái) lên phần thân bên phải (trái), đến ngang đầu phía trên tai phải (trái)."],["B","Xoay người được kiểm tra về hướng đặt máy soi hoặc đặt đồ vật, dò từ trên đỉnh đầu, xuống cổ, xuống phía lưng, tới gót chân kể cả lòng bàn chân (đảm bảo phủ kín phần thân sau và phía sau hai chân)."],["C","Đưa thiết bị phát hiện kim loại ra phía trước ngực, dò xuống đến cổ chân (đảm bảo phủ kính phần thân trước và hai chân)."],["D","Quét dò 02 chân bằng cách đưa thiết bị phát hiện kim loại lên xuống giữa 02 chân (từ mắt cá trong đến đáy quần)."]],"a":"B","e":"","g":""},{"n":24,"q":"Hãy chọn bước 2 của quy trình kiểm tra trực quan người","o":[["A","Kiểm tra phần cổ bằng cách vuốt từ phần sau gáy ra phía trước, dùng lưng bàn tay vuốt xuống để kiểm tra phần thân trước đến dây lưng (chú ý cổ áo, túi áo, cà vạt …)."],["B","Kiểm tra hai cánh tay bằng cách đặt lòng bàn tay tại vị trí tiếp giáp giữa cổ và vai của người được kiểm tra, lòng bàn tay đặt tại vị trí nách, vuốt dọc theo cánh tay từ trong ra ngoài đến hết bàn tay."],["C","Dùng hai lòng bàn tay vuốt dọc hai bên thân người từ nách đến dây lưng."],["D","Đặt hai ngón tay cái phía trong lưng (cạp) quần và hai ngón tay phía ngoài dây lưng, tại vị trí hai bên hông. Vuốt theo lưng (cạp) quần về phía trước đến đầu khóa, lật mặt trong của khóa để kiểm tra."]],"a":"B","e":"","g":""},{"n":25,"q":"Hãy chọn bước 6 của quy trình kiểm tra trực quan người","o":[["A","Cán bộ, chiến sĩ an ninh hàng không hạ thấp người, dùng hai mu (lưng) bàn tay vuốt kiểm tra phần kín của người được kiểm tra."],["B","Kiểm tra hai chân bằng cách đặt lòng bàn tay phía trong và phía ngoài, vuốt dọc từ trên xuống đến cổ chân đảm bảo phủ kín mặt trước của chân trái."],["C","Hướng dẫn người được kiểm tra xoay người để kiểm tra phía sau lưng. Người kiểm tra đứng đối diện với lưng của người được kiểm tra, dùng hai lòng bàn tay vuốt dọc phần thân sau từ vai xuống thắt lưng."],["D","Đặt hai ngón tay cái phía trong lưng (cạp) quần và hai ngón tay trỏ phía ngoài lưng (cạp) quần tại vị trí bên hông. Vuốt theo lưng (cạp) quần về phía sau đến vị trí giữa sống lưng."]],"a":"B","e":"","g":""},{"n":26,"q":"Hãy chọn bước 9 của quy trình kiểm tra trực quan người","o":[["A","Hướng dẫn người được kiểm tra xoay người để kiểm tra phía sau lưng. Người kiểm tra đứng đối diện với lưng của người được kiểm tra, dùng hai lòng bàn tay vuốt dọc phần thân sau từ vai xuống thắt lưng."],["B","Đặt hai ngón tay cái phía trong lưng (cạp) quần và hai ngón tay trỏ phía ngoài lưng (cạp) quần tại vị trí bên hông. Vuốt theo lưng (cạp) quần về phía sau đến vị trí giữa sống lưng."],["C","Kiểm tra hai chân bằng cách đặt lòng bàn tay vị trí hông giáp thắt lưng, lòng tay đặt tại vị trí giữa hông, khu vực thắt lưng. Vuốt dọc từ trên xuống dưới đến cổ chân."],["D","Kiểm tra lòng bàn chân."]],"a":"C","e":"","g":""},{"n":27,"q":"Hãy chọn bước 2 của quy trình kiểm tra trực quan đối với đồ vật","o":[["A","Thông báo lý do kiểm tra đồ vật, phỏng vấn về nguồn gốc, chủng loại đồ vật."],["B","Quan sát bên ngoài để nhận biết dấu hiệu bất thường (hình dáng, kích thước, nhãn mác, tiếng động, dây dẫn quấn quanh …). Nếu phát hiện bất thường cán bộ, chiến sĩ an ninh hàng không báo cáo trực chỉ huy Đội công tác để kiểm tra bằng thiết bị phát hiện chất nổ."],["C","Tiến hành mở đồ vật ra kiểm tra, sử dụng các giác quan nhằm phát hiện dấu hiệu bất thường."],["D","Kiểm tra đồ vật theo thứ tự từ ngoài vào trong, từ trái qua phải, từ trên xuống dưới. Lưu ý đồ vật có nhiều ngăn phải kiểm tra lần lượt từng ngăn cho đến hết."]],"a":"B","e":"","g":""},{"n":28,"q":"Hãy chọn bước 6 của quy trình kiểm tra trực quan đối với đồ vật","o":[["A","Tiến hành mở đồ vật ra kiểm tra, sử dụng các giác quan nhằm phát hiện dấu hiệu bất thường."],["B","Kiểm tra đồ vật theo thứ tự từ ngoài vào trong, từ trái qua phải, từ trên xuống dưới. Lưu ý đồ vật có nhiều ngăn phải kiểm tra lần lượt từng ngăn cho đến hết."],["C","Trường hợp không phát hiện vật phẩm nguy hiểm cấm mang vào khu vực hạn chế, hoàn thành thủ tục kiểm tra an ninh hàng không."],["D","Trường hợp phát hiện vật phẩm nguy hiểm tiến hành xử lý theo quy định."]],"a":"D","e":"","g":""},{"n":29,"q":"Trong trường hợp từ chối cho người, phương tiện, đồ vật vào khu vực hạn chế, cán bộ, chiến sĩ an ninh hàng không phải","o":[["A","Ghi nhận các thông tin vào sổ trực ca, lập biên bản vi phạm theo mẫu quy định tại Phụ lục XVIII ban hành kèm theo Thông tư 14/2026/TT-BCA."],["B","Báo cáo ngay cho trực chỉ huy Đội công tác để nắm thông tin, tình hình."],["C","Báo cáo ngay cho trực chỉ huy Đội công tác để nắm thông tin, tình hình, ghi nhận các thông tin vào sổ trực ca và báo cáo lãnh đạo Công an cửa khẩu Cảng HKQT Tân Sơn Nhất (nếu cần)."],["D","Báo cáo ngay cho chỉ huy đơn vị trực ca công tác, lập biên bản vi phạm theo mẫu quy định tại Phụ lục XVIII ban hành kèm theo Thông tư 14/2026/TT-BCA."]],"a":"C","e":"","g":""},{"n":30,"q":"Việc lục soát ANHK đối với nhân viên nội bộ cần chú ý điều gì?","o":[["A","Việc lục soát an ninh hàng không tiến hành tại buồng lục soát phải do người cùng giới tính thực hiện, có người thứ ba cùng giới chứng kiến."],["B","Giữ thái độ nghiêm túc trong từng động tác, tránh gây tâm lý không tốt cho người bị lục soát, tôn trọng những vấn đề cá nhân của người bị lục soát."],["C","Luôn cảnh giác quan sát liên tục người bị lục soát, không quay lưng lại phía người bị lục soát."],["D","Cả 03 đáp án trên."]],"a":"D","e":"","g":""},{"n":31,"q":"Những trường hợp cần kiểm tra bằng dụng cụ, thiết bị phát hiện chất nổ","o":[["A","Hành lý ký gửi có dấu hiệu nghi vấn chứa chất nổ."],["B","Hành lý ký gửi không thể đưa qua máy soi (hành lý quá khổ, mẫu bệnh phẩm, những trường hợp hành lý đặc biệt khác…)."],["C","Hành lý ký gửi vận chuyển không cùng hành khách trên chuyến bay phải áp dụng ít nhất một trong các biện pháp kiểm tra an ninh hàng không bổ sung."],["D","Cả 03 đáp án trên."]],"a":"D","e":"","g":""},{"n":32,"q":"Khi kiểm tra thẻ kiểm soát an ninh hàng không có giá trị sử dụng dài hạn, cán bộ kiểm soát an ninh hàng không phải tập trung vào nội dung nào sau đây (1) Số thẻ, giấy phép. (2) Ký hiệu đơn vị cấp thẻ, giấy phép. (3) Khu vực hạn chế được phép vào/ra và hoạt động. (4) Thời gian hiệu lực của thẻ, giấy phép. (5) Họ và tên, chức danh, đơn vị của người được cấp thẻ và đối chiếu hình ảnh trên thẻ với người mang thẻ kiểm soát an ninh hàng không. (6) Biển kiểm soát phương tiện và đối chiếu với giấy phép kiểm soát an ninh hàng không. (7) Kiểm tra, đối chiếu với danh sách mất thẻ, giấy phép kiểm soát an ninh hàng không.","o":[["A","(1); (2); (3); (4); (5); (6)."],["B","(1); (2); (3); (4); (5); (7)."],["C","(1); (2); (3); (5); (6); (7)."],["D","(1); (2); (4); (5); (6); (7)."]],"a":"B","e":"","g":""},{"n":33,"q":"Mục đích của việc kiểm tra tại các điểm kiểm tra ANHK là gì?","o":[["A","Đảm bảo các đối tượng vào/ra khu vực hạn chế đúng điều kiện, quy định về công tác đảm bảo an ninh hàng không."],["B","Kiểm tra người và phương tiện nhằm phát hiện các hành vi vi phạm quy định về an ninh, an toàn trong khu vực hạn chế."],["C","Kiểm soát người và phương tiện ra, vào khu vực hạn chế nhằm hạn chế tối đa các nguy cơ có thể ảnh hưởng đến hoạt động hàng không."],["D","Kiểm tra giấy tờ, phương tiện và các điều kiện liên quan trước khi cho phép người, phương tiện tiếp tục hoạt động trong khu vực hạn chế."]],"a":"A","e":"","g":""},{"n":34,"q":"Trang thiết bị, phương tiện đảm bảo an ninh hàng không tại điểm kiểm tra an ninh hàng không ĐKT-QT-06-T2 (Nội bộ 2) gồm","o":[["A","Máy soi, cổng từ, thiết bị phát hiện kim loại cầm tay, thiết bị phát hiện chất nổ, bộ đàm."],["B","Máy soi, cổng từ, thiết bị phát hiện kim loại cầm tay."],["C","Thiết bị phát hiện kim loại cầm tay, thiết bị phát hiện chất nổ, bộ đàm."],["D","Máy soi, cổng từ, thiết bị phát hiện chất nổ, bộ đàm."]],"a":"A","e":"","g":""},{"n":35,"q":"Nhiệm vụ cần thực hiện ngay khi nhận ca công tác là gì?","o":[["A","Kiểm tra số lượng và tình trạng hoạt động của các phương tiện, thiết bị phục vụ công tác, đối chiếu với nội dung ghi nhật ký của ca trước và xác nhận vào sổ nhật ký."],["B","Nếu thấy nhiệm vụ được giao có vấn đề chưa rõ hoặc phát hiện có dấu hiệu khác thường, trái quy định thì báo cáo ngay Chỉ huy Đội để báo cáo lãnh đạo Công an cửa khẩu trực ca công tác quyết định."],["C","Kiểm tra lại toàn bộ khu vực mình đảm nhiệm; đưa máy tính và các thiết bị điện trở về trạng thái an toàn; làm vệ sinh khu vực làm việc; cất giữ, bảo quản thiết bị kỹ thuật; ghi Sổ nhật ký tình hình."],["D","A & B đúng."]],"a":"D","e":"","g":""},{"n":36,"q":"Nối thông tin ở cột A và cột B sao cho phù hợp nhất Kết quả là","o":[["A","1-c; 2-b; 3-a"],["B","1-c; 2-a; 3-b"],["C","1-b; 2-c; 3-a"],["D","1-b; 2-a; 3-c"]],"a":"B","e":"","g":"","t":[["A","B"],["1. Cửa khởi hành số 8","a. Hỗ trợ và giám sát chặt chẽ việc mở cửa cầu thang kỹ thuật phục vụ khách VVIP, CIP."],["2. Đối với tất cả các cửa khởi hành có ống lồng","b. Hỗ trợ các hãng hàng không việc đóng/mở cửa bằng chìa khóa cơ, thường xuyên kiểm tra đảm bảo trụ và cánh cửa phải chắc chắn, khóa an toàn bảo đảm độ kín, khít."],["3. Các cửa khởi hành 10-14 và 22-25","c. Chú ý các chuyến bay trả khách tại ống lồng số 18, không để xảy ra tình trạng hành khách trên các chuyến bay quốc tế đi nhầm sang lối đi vào nhà ga quốc nội và ngược lại, hành khách trên các chuyến bay quốc nội đi nhầm vào lối đi sang khu nhập cảnh thuộc nhà ga quốc tế."]]},{"n":37,"q":"Nhiệm vụ nào sau đây là nhiệm vụ đặc trưng của khu vực băng chuyền giao, nhận hành lý ký gửi cho hành khách tại ga đến và khu vực băng chuyền BHS chất xếp, phân loại hành lý ký gửi","o":[["A","Nắm thông tin, tình hình cụ thể liên quan trực tiếp đến vị trí công tác được phân công."],["B","Bảo quản, sử dụng tốt tài sản, trang thiết bị, công cụ hỗ trợ được giao; bảo vệ tài sản, các công trình, thiết bị của nhà ga, Cảng hàng không, phòng chống cháy nổ."],["C","Thực hiện nghiêm chế độ thông tin báo cáo, trong quá trình thực hiện nhiệm vụ, trường hợp phát sinh các vấn đề ngoài thẩm quyền, cán bộ chiến sĩ tại các vị trí công tác phải báo cáo Chỉ huy Đội, báo cáo lãnh đạo Công an cửa khẩu trực ca công tác xem xét, quyết định."],["D","Tổ chức giám sát an ninh hàng không, an ninh trật tự và giám sát việc thực hiện các biện pháp phòng, chống trộm cắp tài sản trong hành lý ký gửi của các cơ quan, đơn vị, nhân viên nội bộ trong ngành hàng không."]],"a":"D","e":"","g":""},{"n":38,"q":"Cho các phát biểu sau về nhiệm vụ của cán bộ kiểm soát ANHK trong ca công tác: (1) Nắm thông tin, tình hình cụ thể liên quan trực tiếp đến vị trí công tác được phân công. (2) Duy trì đảm bảo an ninh trật tự tại phạm vi điểm kiểm soát và tại khu vực tuần tra; kiểm soát, giám sát, giúp hành khách, nhân viên nội bộ vào, ra khu vực nhà ga theo lối đi thuận tiện nhất. (3) Kiểm tra, kiểm soát, giám sát an ninh hàng không đối với người, phương tiện, vật tư, công cụ, dụng cụ, đồ vật vào, ra, hoạt động trong khu vực công cộng, khu vực hạn chế, cách ly để khảo sát, thi công, bảo trì, bảo dưỡng theo quy định. Phát biểu đúng là","o":[["A","(1) & (3)"],["B","(1) & (2)"],["C","(2) & (3)"],["D","(1), (2) & (3)"]],"a":"A","e":"","g":""},{"n":39,"q":"Cho các phát biểu sau về nhiệm vụ của cán bộ kiểm soát ANHK trong ca công tác: (1). Tuần tra, canh gác, phát hiện, ngăn chặn, xử lý các hành vi vi phạm an ninh trật tự công cộng (đặc biệt là biểu tình gây rối trật tự công cộng), các hành vi can thiệp bất hợp pháp vào hoạt động hàng không dân dụng, các trường hợp xâm nhập trái phép vào khu vực hạn chế, khu vực cách ly và hành vi vi phạm pháp luật khác. (2). Bảo quản, sử dụng tốt tài sản, trang thiết bị, công cụ hỗ trợ được giao; bảo vệ tài sản, các công trình, thiết bị của nhà ga, Cảng hàng không, phòng chống cháy nổ. (3). Phối hợp với cán bộ, chiến sĩ Đội Tổng hợp trong xử lý các vụ việc gây rối, mất an ninh trật tự công cộng, hành vi vi phạm về công tác an ninh hàng không. Phát biểu đúng là","o":[["A","(1) & (3)"],["B","(1) & (2)"],["C","(2) & (3)"],["D","(1), (2) & (3)"]],"a":"B","e":"","g":""},{"n":40,"q":"Cho các phát biểu sau về nhiệm vụ của cán bộ kiểm soát ANHK trong ca công tác: (1) Tất cả các cổng cửa khi không có người ra/vào hoặc không có hoạt động khai thác phải được đóng (bao gồm các cửa máy soi chiếu an ninh, cửa băng chuyền hành lý, cửa ra/vào nhà ga), khi cán bộ, chiến sĩ kiểm soát an ninh hàng không trực rời khỏi vị trí phải có cán bộ, chiến sĩ kiểm soát an ninh hàng không khác thay thế. (2) Thực hiện thái độ ứng xử chuẩn mực, tận tình, chuyên nghiệp và thân thiện khi giao tiếp với hành khách; chủ động hướng dẫn, hỗ trợ hành khách, đặc biệt đối với nhóm hành khách yếu thế tại cảng hàng không, sân bay. (3). Thực hiện nghiêm chế độ thông tin báo cáo, trong quá trình thực hiện nhiệm vụ, trường hợp phát sinh các vấn đề ngoài thẩm quyền, cán bộ chiến sĩ tại các vị trí công tác phải báo cáo Chỉ huy Đội, báo cáo lãnh đạo Công an cửa khẩu trực ca công tác xem xét, quyết định. Phát biểu đúng là","o":[["A","(1) & (3)"],["B","(1) & (2)"],["C","(2) & (3)"],["D","(1), (2) & (3)"]],"a":"C","e":"","g":""},{"n":41,"q":"Cán bộ, chiến sĩ KSANHK phát hiện một kiện hành lý không xác nhận được chủ tại khu vực công cộng. Sau khi quan sát và hỏi những người xung quanh nhưng chưa xác định được chủ, hành động nào sau đây là phù hợp nhất","o":[["A","Di chuyển kiện hành lý đến khu vực khác để tránh gây cản trở."],["B","Giám sát liên tục, không cho người xung quanh tiếp cận và phối hợp bộ phận liên quan xác định người bỏ lại."],["C","Tự ý mở kiện hành lý để kiểm tra tài sản bên trong."],["D","Để nguyên kiện hành lý và tiếp tục thực hiện nhiệm vụ khác."]],"a":"B","e":"","g":""},{"n":42,"q":"Một hành khách đến nhận lại kiện hành lý không xác nhận được chủ. Cán bộ KSANHK nên thực hiện hành động nào","o":[["A","Bàn giao ngay vì người này đã nhận là chủ."],["B","Yêu cầu hành khách tự mở hành lý để chứng minh quyền sở hữu."],["C","Thẩm vấn một số thông tin liên quan đến đồ vật để xác minh chủ sở hữu, đồng thời khuyến cáo hành khách luôn tự bảo quản hành lý."],["D","Thu giữ hành lý và không cho hành khách giải thích."]],"a":"C","e":"","g":""},{"n":43,"q":"Một kiện hành lý không xác nhận được chủ đã qua kiểm tra, soi chiếu nhưng bị bỏ lại phía sau khu vực kiểm tra. Theo quy trình, cán bộ KSANHK cần thực hiện như thế nào?","o":[["A","Chỉ kiểm tra trực quan."],["B","Chỉ sử dụng thiết bị phát hiện chất nổ."],["C","Kiểm tra qua máy soi tia X và kiểm tra trực quan."],["D","Mở ngay kiện hành lý để kiểm tra tài sản."]],"a":"C","e":"","g":""},{"n":44,"q":"Một kiện hành lý không xác nhận được chủ chưa qua kiểm tra an ninh, soi chiếu được phát hiện tại khu vực hạn chế. Một nhân viên không có trách nhiệm muốn đến gần để xem bên trong. Cán bộ KSANHK nên xử lý thế nào?","o":[["A","Cho phép nhân viên tiếp cận vì nhân viên làm việc tại sân bay."],["B","Yêu cầu nhân viên đứng cách xa nhưng cho phép chạm vào kiện hành lý."],["C","Cách ly kiện hành lý với mọi người và tuyệt đối không cho người không có trách nhiệm tiếp cận hoặc tác động vào."],["D","Cho phép nhân viên mở kiện hành lý dưới sự giám sát."]],"a":"C","e":"","g":""},{"n":45,"q":"Khi kiểm tra một kiện hành lý không xác nhận được chủ chưa qua kiểm tra an ninh, cán bộ nhận thấy bên ngoài kiện hành lý có một số dấu hiệu bất thường. Biện pháp nào phù hợp với quy trình","o":[["A","Bỏ qua vì chưa chắc chắn có nguy hiểm."],["B","Chỉ hỏi những người xung quanh."],["C","Quan sát kỹ đặc điểm bên ngoài, sử dụng các giác quan để phát hiện bất thường và kiểm tra bằng thiết bị, dụng cụ phát hiện chất nổ."],["D","Tự ý mở kiện hành lý ngay lập tức."]],"a":"C","e":"","g":""},{"n":46,"q":"Sau khi kiểm tra, xác định kiện hành lý không chứa chất nổ hoặc chất độc hại nguy hiểm. Bước tiếp theo phù hợp là gì?","o":[["A","Tiêu hủy kiện hành lý để bảo đảm an toàn."],["B","Tiến hành kiểm tra soi chiếu hoặc kiểm tra trực quan và lập biên bản sau khi kiểm tra trực quan."],["C","Bàn giao ngay cho hành khách bất kỳ đến nhận."],["D","Đưa kiện hành lý ra khỏi cảng hàng không."]],"a":"B","e":"","g":""},{"n":47,"q":"Một kiện hành lý ký gửi không xác nhận được chủ được phát hiện. Kiện có dán Tag hành lý ghi rõ thông tin chuyến bay, qua đó có cơ sở xác định được chủ. Cán bộ KSANHK nên làm gì?","o":[["A","Mở kiện hành lý và kiểm kê toàn bộ tài sản bên trong."],["B","Bàn giao cho bộ phận quản lý hành lý và lập biên bản bàn giao."],["C","Giao trực tiếp cho hành khách gần nhất."],["D","Dán tem niêm phong rồi tiêu hủy."]],"a":"B","e":"","g":""},{"n":48,"q":"Một kiện hành lý không xác nhận được chủ đã được kiểm tra và không phát hiện chất nguy hiểm. Kiện có thể mở được, nhưng vẫn chưa xác định được chủ. Cách xử lý nào phù hợp?","o":[["A","Mở và lập biên bản kiểm kê tài sản bên trong, phối hợp với bộ phận liên quan."],["B","Tự ý lấy tài sản bên trong để bảo quản riêng."],["C","Không được kiểm tra thêm dưới bất kỳ hình thức nào."],["D","Bàn giao cho bất kỳ hành khách nào đến nhận."]],"a":"A","e":"","g":""},{"n":49,"q":"Một kiện hành lý không xác nhận được chủ có khóa và không thể mở được, chưa xác định được chủ sở hữu. Theo quy trình, cán bộ nên","o":[["A","Phá khóa để kiểm kê tài sản bên trong."],["B","Chỉ kiểm tra an ninh bằng máy soi tia X, dán tem niêm phong và giao cho bộ phận có trách nhiệm cất giữ."],["C","Yêu cầu hành khách gần đó mở giúp."],["D","Đưa kiện hành lý ra khu vực công cộng để chờ người nhận"]],"a":"B","e":"","g":""},{"n":50,"q":"Trong quá trình kiểm tra, cán bộ phát hiện dấu hiệu cho thấy kiện hành lý có thể chứa bom, mìn hoặc vật liệu nổ. Hành động nào sau đây phù hợp nhất?","o":[["A","Mở kiện hành lý để xác định chính xác loại vật liệu."],["B","Tiếp tục kiểm tra trực quan để tìm chủ sở hữu."],["C","Đánh giá nguy cơ, nhanh chóng cách ly mọi người xung quanh, tổ chức sơ tán và báo cáo cấp trên để triển khai phương án khẩn nguy."],["D","Đưa kiện hành lý đến phòng làm việc để xử lý."]],"a":"C","e":"","g":""},{"n":51,"q":"Sau khi xử lý xong một kiện hành lý không xác nhận được chủ, cán bộ KSANHK cần thực hiện công việc nào để bảo đảm việc quản lý, theo dõi được đầy đủ?","o":[["A","Chỉ thông báo miệng cho ca trực tiếp theo."],["B","Bàn giao cho bộ phận liên quan, lập biên bản bàn giao, ghi sổ nhật ký và bàn giao ca trực."],["C","Chỉ lập biên bản nếu kiện hành lý có tài sản giá trị."],["D","Không cần ghi chép nếu không phát hiện vật nguy hiểm."]],"a":"B","e":"","g":""},{"n":52,"q":"Tình huống: Cán bộ KSANHK phát hiện một ba lô không xác nhận được chủ tại khu vực chưa qua kiểm tra an ninh. Không có ai đến nhận. Khi quan sát bên ngoài, cán bộ nhận thấy ba lô có dấu hiệu bất thường. Cách xử lý nào dưới đây đúng nhất theo trình tự","o":[["A","Mở ba lô ngay → kiểm kê tài sản → báo cáo cấp trên."],["B","Di chuyển ba lô đến phòng làm việc → soi chiếu → bàn giao."],["C","Cách ly ba lô với hành khách và người xung quanh → không cho người không có trách nhiệm tiếp cận/tác động → quan sát đặc điểm bên ngoài → sử dụng thiết bị, dụng cụ phát hiện chất nổ → xử lý tiếp theo tùy kết quả."],["D","Chờ người nhận trong một thời gian → nếu không có thì giao cho bộ phận hành lý."]],"a":"C","e":"","g":""},{"n":53,"q":"Đối với Bộ phát hiện vì vết chất nổ EXD-17, bước 01 trong quy trình dò tìm chất nổ nhóm A, B, C, D bằng các bình thuốc thử phải sử dụng bình thuốc nào?","o":[["A","Bình thuốc ký hiệu O."],["C","Bình thuốc ký hiệu X."],["D","Bình thuốc ký hiệu E."]],"a":"D","e":"","g":""},{"n":54,"q":"Đối với Bộ phát hiện vì vết chất nổ EXD-17, bước 02 trong quy trình dò tìm chất nổ nhóm A, B, C, D bằng các bình thuốc thử phải sử dụng bình thuốc nào?","o":[["A","Bình thuốc ký hiệu O."],["B","Bình thuốc ký hiệu P."],["C","Bình thuốc ký hiệu X."],["D","Bình thuốc ký hiệu E."]],"a":"C","e":"","g":"B Bình thuốc ký hiệu P."},{"n":55,"q":"Đối với Bộ phát hiện vị vết chất nổ EXD-17, bước 03 trong quy trình dò tìm chất nổ nhóm A, B, C, D bằng các bình thuốc thử phải sử dụng bình thuốc nào?","o":[["A","Bình thuốc ký hiệu Q."],["B","Bình thuốc ký hiệu P."],["C","Bình thuốc ký hiệu X."],["D","Bình thuốc ký hiệu E."]],"a":"B","e":"","g":"B Bình thuốc ký hiệu P."},{"n":56,"q":"Đối với Bộ phát hiện vi vết chất nổ EXD-17, bước 04 trong quy trình dò tìm chất nổ nhóm A, B, C, D bằng các bình thuốc thử phải sử dụng bình thuốc nào?","o":[["A","Bình thuốc ký hiệu O."],["B","Bình thuốc ký hiệu P."],["C","Bình thuốc ký hiệu X."],["D","Bình thuốc ký hiệu E."]],"a":"A","e":"","g":"B Bình thuốc ký hiệu P."},{"n":57,"q":"Khi phát hiện chất nổ, Bộ phát hiện vi vết chất nổ EXD-17 sẽ phát tín hiệu cảnh báo dưới hình thức nào?","o":[["A","Bằng âm thanh."],["B","Bằng đèn báo."],["C","Bằng âm thanh và đèn báo."],["D","Bằng sự thay đổi màu sắc trên tấm thu mẫu hoặc ống dung dịch."]],"a":"D","e":"","g":"B Bình thuốc ký hiệu P."},{"n":58,"q":"Khi sử dụng bộ phát hiện vì vết chất nổ EXD-17, có thể sử dụng kết hợp các bình thuốc thử nào dưới đây trên cùng một tấm thu mẫu chất nổ:","o":[["A","Có thể sử dụng kết hợp các bình thuốc E và X."],["B","Có thể sử dụng kết hợp các bình thuốc E, X và P."],["C","Có thể sử dụng kết hợp các bình thuốc E, X, P và Q."],["D","Không thể sử dụng kết hợp các bình thuốc thử."]],"a":"B","e":"","g":"B Bình thuốc ký hiệu P."},{"n":59,"q":"Hãy chọn bước 01 của quy trình kiểm tra chất nổ gốc Peroxide bằng bộ KIT?","o":[["A","Cắt đầu ống số 02 (màu trắng trong), cho mẫu cần thử dạng lỏng hoặc dạng bột vào ống, bóp ống số 02 từ 5 – 10 lần cho hỗn hợp trộn đều."],["B","Cắt đầu ống số 01 (màu trắng sữa), bóp cho dung dịch nhỏ vào ống số 02 (màu trắng trong), bóp ống số 02 từ 5 – 10 lần cho hỗn hợp trộn đều."],["C","Dùng kéo cắt tách bộ kit ra thành 03 ống riêng biệt."],["D","Cắt đầu ống số 03 (màu xanh), bóp cho dung dịch nhỏ
