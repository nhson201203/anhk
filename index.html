<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ôn tập &amp; thi trắc nghiệm</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mu:#667085;--bd:#d9dde4;--pr:#2457d6;--ok:#117a45;--okb:#e3f6ec;--no:#b42318;--nob:#fde8e6}
@media(prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b2029;--tx:#e8ebf1;--mu:#98a2b3;--bd:#323946;--pr:#6b95ff;--ok:#4cd08a;--okb:#14352a;--no:#ff8a80;--nob:#3b1d1a}}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
main{max-width:860px;margin:0 auto;padding:16px}h1{font-size:1.4rem;margin:.2em 0 .6em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:8px 14px}
button.p{background:var(--pr);border-color:var(--pr);color:#fff}button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{flex:1}.mu{color:var(--mu);font-size:.9rem}
label.b{display:flex;gap:8px;align-items:flex-start;padding:6px 0}input[type=number]{width:70px;font:inherit;padding:5px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:10px 12px}.opt b{margin-right:6px}
.opt.sel{border-color:var(--pr);box-shadow:0 0 0 1px var(--pr)}.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.no{background:var(--nob);border-color:var(--no)}
.q{font-weight:600;white-space:pre-wrap}.ex{background:var(--bg);border-left:4px solid var(--pr);padding:8px 12px;margin-top:10px;border-radius:6px}
.pal{display:flex;flex-wrap:wrap;gap:5px}.pal button{width:38px;padding:5px 0;font-size:.85rem}
.pal .a{background:var(--pr);color:#fff;border-color:var(--pr)}.pal .ok{background:var(--ok);color:#fff;border-color:var(--ok)}.pal .no{background:var(--no);color:#fff;border-color:var(--no)}.pal .c{outline:2px solid var(--tx)}
table{border-collapse:collapse;margin:8px 0;font-size:.92rem}td,th{border:1px solid var(--bd);padding:4px 8px;vertical-align:top}
textarea{width:100%;min-height:90px;font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.big{font-size:1.6rem;font-weight:700}
</style></head><body><main id="app"></main>
<script>
const BANKS=[{"id":"chung","name":"Kiến thức chung","open":false,"qs":[{"n":1,"q":"Nghị định số 215/2026/NĐ-CP do Chính phủ ban hành ngày 18/06/2026 chính thức có hiệu lực từ ngày 01/07/2026 quy định về vấn đề gì?","o":[["A","Quy định về đào tạo, bồi dưỡng nghiệp vụ, huấn luyện an ninh hàng không."],["B","Quy định chi tiết Chương trình an ninh hàng không và kiểm soát chất lượng an ninh hàng không Việt Nam."],["C","Quy định về an ninh hàng không."],["D","Quy định về xử phạt hành chính trong lĩnh vực hàng không dân dụng."]],"a":"B","e":"","g":""},{"n":2,"q":"Cơ quan nào quyết định cấm vận chuyển bằng đường hàng không theo khoản 5 Điều 21 Nghị định 215/2026/NĐ-CP?","o":[["A","Bất kỳ hãng hàng không nào cũng có quyền quyết định cấm áp dụng đối với mọi hãng."],["B","Cục Quản lý xuất nhập cảnh, căn cứ tính chất, mức độ vi phạm."],["C","Nhân viên trực quầy làm thủ tục hàng không."],["D","Kiểm soát viên xuất nhập cảnh tại bục."]],"a":"B","e":"Cần phân biệt quyền từ chối vận chuyển của người vận chuyển với quyết định cấm vận chuyển theo Nghị định. Căn cứ: Điều 20 và khoản 5 Điều 21.","g":""},{"n":3,"q":"Danh mục vật phẩm nguy hiểm cấm, hạn chế mang vào khu vực hạn chế, mang lên tàu bay được ban hành theo văn bản có giá trị pháp lý hiện hành nào sau đây?","o":[["A","Quyết định 1541/QĐ-CHK ban hành ngày 14/09/2021 của Cục Hàng không Việt Nam."],["B","Công văn số 25655/QLXNC-TTANHKQG ban hành ngày 21/09/2026 của Cục Quản lý xuất nhập cảnh."],["C","Thông tư 14/2026/TT-BCA ban hành ngày 03/02/2026 của Bộ Công an."],["D","Thông tư 115/2026/TT-BCA ban hành ngày 29/06/2026 của Bộ Công an."]],"a":"B","e":"","g":""},{"n":4,"q":"ICAO là tên viết tắt của Tổ chức/ Hiệp hội nào?","o":[["A","Tổ chức Hàng không dân dụng quốc tế."],["B","Hiệp hội Vận tải Hàng không Quốc tế."],["C","Tổ chức Hàng không dân dụng Việt Nam."],["D","Tổ chức Hàng không quốc tế."]],"a":"A","e":"Điều 3 khoản 38, Thông tư 14/2026/TT-BCA","g":""},{"n":5,"q":"Chức năng Công an cửa khẩu Cảng HKQT Tân Sơn Nhất gồm:","o":[["A","Công an cửa khẩu Cảng HKQT Tân Sơn Nhất thuộc Cục Quản lý xuất nhập cảnh, có trách nhiệm giúp Cục trưởng tổ chức thực hiện công tác nắm tình hình, đề xuất chủ trương, kế hoạch, quy trình, biện pháp công tác và tổ chức công tác kiểm soát xuất nhập cảnh; thực hiện công tác kiểm tra, giám sát trong lĩnh vực bảo đảm an ninh hàng không tại Cảng HKQT Tân Sơn Nhất theo quy định của pháp luật và Bộ trưởng Bộ Công an."],["B","Công an cửa khẩu Cảng HKQT Tân Sơn Nhất thuộc Cục Quản lý xuất nhập cảnh thực hiện quản lý nhà nước về an ninh hàng không và kiểm tra, giám sát công tác bảo đảm an ninh hàng không trong phạm vi quản lý được giao."],["C","Công an cửa khẩu Cảng HKQT Tân Sơn Nhất thực hiện chức năng kiểm soát an ninh hàng không tại Cảng HKQT Tân Sơn Nhất do Cục Quản lý xuất nhập cảnh chủ trì, bảo đảm an ninh hàng không."]],"a":"B","e":"","g":""},{"n":6,"q":"Theo đồng chí : Việc ghi âm, ghi hình tại các điểm kiểm tra an ninh hàng không phải được Lãnh đạo Công an cửa khẩu Cảng HKQT Tân Sơn Nhất cho phép bằng văn bản, trừ các trường hợp sau đây:","o":[["A","Việc ghi âm, ghi hình thông tin, tài liệu thuộc phạm vi bí mật nhà nước thực hiện theo các quy định về bảo vệ bí mật Nhà nước."],["B","Công an cửa khẩu cảng hàng không quốc tế Tân Sơn Nhất Ghi âm ghi hình phục vụ công vụ theo thẩm quyền trách nhiệm được giao"],["C","Câu A-B Sai"],["D","Câu A-B đúng"]],"a":"B","e":"","g":""},{"n":7,"q":"Đối tượng được xem xét cấp thẻ kiểm soát an ninh Cảng HK có giá trị sử dụng dài hạn bao gồm:","o":[["A","Cán bộ, nhân viên của các hãng hàng không, doanh nghiệp cảng hàng không, doanh nghiệp cung cấp dịch vụ, du lịch tại khu vực hạn chế của cảng hàng không có hợp đồng lao động xác định thời hạn hoặc không xác định thời hạn theo quy định của pháp luật về lao động."],["B","Nhân viên của doanh nghiệp giao nhận hàng hóa, bưu gửi bằng đường hàng không."],["C","Nhân viên của doanh nghiệp thực hiện khảo sát, thi công, sửa chữa, bảo dưỡng công trình, trang thiết bị tại cảng hàng không."],["D","Cán bộ, nhân viên của cơ quan nhà nước, tổ chức chính trị, tổ chức chính trị - xã hội; Người của cơ quan đại diện ngoại giao, cơ quan lãnh sự nước ngoài, cơ quan đại diện của tổ chức quốc tế tại Việt Nam."],["E","Tất cả đáp án trên đúng."]],"a":"B","e":"","g":""},{"n":8,"q":"Nguyên tắc cấp thẻ kiểm soát an ninh cảng hàng không.","o":[["A","Người làm việc tại một cảng hàng không chỉ được cấp thẻ kiểm soát an ninh cảng hàng không có giá trị sử dụng dài hạn tại cảng hàng không nơi làm việc."],["B","Người làm việc tại nhiều cảng hàng không được cấp thẻ kiểm soát an ninh cảng hàng không có giá trị sử dụng dài hạn tại các cảng hàng không nơi làm việc."],["C","Người có nhiệm vụ tại khu vực hạn chế nào chỉ được cấp thẻ kiểm soát an ninh cảng hàng không vào khu vực hạn chế đó; người có nhiệm vụ tại khu vực hạn chế trong thời gian nào chỉ được cấp thẻ kiểm soát an ninh cảng hàng không có giá trị sử dụng trong thời gian đó."],["D","Thẻ kiểm soát an ninh cảng hàng không có giá trị sử dụng ngắn hạn chỉ được phép sử dụng tại một cảng hàng không."],["E","Tất cả đáp án trên đúng."]],"a":"B","e":"","g":""},{"n":9,"q":"Theo đồng chí: Thẩm quyền cấp thẻ, giấy phép kiểm soát an ninh hàng không.","o":[["A","Cục Quản lý xuất nhập cảnh có thẩm quyền cấp thẻ kiểm soát an ninh cảng hàng không có giá trị sử dụng dài hạn tại một hoặc hai cảng hàng không trở lên."],["B","Công an cửa khẩu cảng hàng không quốc tế thuộc Cục Quản lý xuất nhập cảnh cấp thẻ, giấy phép kiểm soát an ninh cảng hàng không có giá trị sử dụng dài hạn, ngắn hạn tại cảng hàng không được phân công chủ trì triển khai công tác bảo đảm an ninh hàng không."],["C","Công an cấp tỉnh có thẩm quyền cấp thẻ, giấy phép kiểm soát an ninh cảng hàng không có giá trị sử dụng dài hạn, ngắn hạn tại các cảng hàng không do Công an cấp tỉnh chủ trì triển khai công tác bảo đảm an ninh hàng không."],["D","Cả 3 đáp án trên đúng."]],"a":"C","e":"","g":""},{"n":10,"q":"Thẻ, giấy phép kiểm soát an ninh hàng không gồm:","o":[["A","Thẻ, giấy phép kiểm soát an ninh cảng hàng không loại có giá trị sử dụng dài hạn và loại có giá trị sử dụng ngắn hạn theo các mẫu quy định tại Phụ lục I kèm theo Thông tư 115/2026/TT-BCA."],["B","Thẻ, giấy phép kiểm soát an ninh nội bộ loại có giá trị sử dụng dài hạn và loại có giá trị sử dụng ngắn hạn."],["C","Thẻ nhận dạng tổ bay của hãng hàng không."],["D","Cả 3 đáp án trên đúng."]],"a":"B","e":"","g":""},{"n":11,"q":"Thẻ nhận dạng tổ bay của hãng hàng không có các thông tin cơ bản nào sau đây:","o":[["A","Số thẻ. Thời hạn hiệu lực của thẻ. Họ và tên của người được cấp thẻ."],["B","Chức danh của người được cấp thẻ."],["C","Tên, biểu tượng hãng hàng không. Ảnh của người được cấp thẻ."],["D","Tất cả đáp án trên đúng."]],"a":"C","e":"","g":""},{"n":12,"q":"Quy trình kiểm tra, giám sát an ninh hàng không đối với hành khách là bị can, bị cáo, phạm nhân, người bị trục xuất, dẫn độ, người bị bắt theo quyết định truy nã.","o":[["A","Khi làm thủ tục hàng không, người áp giải phải xuất trình lệnh hoặc quyết định áp giải của cơ quan có thẩm quyền.Đại diện hãng hàng không phối hợp với người áp giải đánh giá rủi ro trong việc vận chuyển hành khách bị áp giải và quyết định các biện pháp bảo đảm an ninh, an toàn phù hợp; thông báo cho lực lượng kiểm soát an ninh hàng không tại cảng hàng không nơi đi."],["B","Người áp giải và người bị áp giải có thể được bố trí kiểm tra an ninh hàng không tại khu vực riêng. Người bị áp giải và hành lý, vật dụng của họ được kiểm tra trực quan.Lực lượng kiểm soát an ninh hàng không phối hợp với người áp giải quản lý, giám sát chặt chẽ trong quá trình đưa người bị áp giải lên, xuống tàu bay."],["C","Đại diện hãng hàng không phải thông báo cho người chỉ huy tàu bay vị trí ngồi của hành khách là bị can, bị cáo, phạm nhân, người bị trục xuất, dẫn độ, người bị bắt theo quyết định truy nã và người áp giải cùng với công cụ hỗ trợ họ mang theo. Người chỉ huy tàu bay thông báo cho lực lượng kiểm soát an ninh hàng không nơi tàu bay dự định hạ cánh về các yêu cầu trợ giúp cần thiết nếu có."],["D","Cả 3 đáp án trên đúng."]],"a":"D","e":"","g":""},{"n":13,"q":"Nguyên tắc xử lý vi phạm ANHK phải được xử lý:","o":[["A","Mọi vụ việc vi phạm an ninh hàng không phải được xử lý kịp thời, nhanh chóng, không để vi phạm lan rộng và hạn chế tới mức thấp nhất hậu quả xảy ra. Việc xử lý phải căn cứ vào tính chất, mức độ vi phạm do hành vi vi phạm gây ra và tuân thủ các quy định của pháp luật hiện hành."],["B","Việc lên tàu bay của lực lượng kiểm soát an ninh hàng không để trấn áp, cưỡng chế, áp giải đối tượng vi phạm được thực hiện theo yêu cầu của người chỉ huy tàu bay hoặc người đứng đầu đơn vị kiểm soát an ninh hàng không trừ trường hợp đối phó với hành vi can thiệp bất hợp pháp vào hoạt động hàng không dân dụng."],["C","Câu A-B Sai"],["D","Câu A-B đúng"]],"a":"D","e":"","g":""},{"n":14,"q":"Khi nhận được thông tin về một hành vi can thiệp bất hợp pháp vào hoạt động hàng không dân dụng, Công an cửa khẩu Cảng HKQT Tân Sơn phải:","o":[["A","Khi nhận được thông tin về một hành vi can thiệp bất hợp pháp vào hoạt động hàng không dân dụng, Công an cửa khẩu Cảng HKQT Tân Sơn Nhất chủ trì, phối hợp với Cảng HKQT Tân Sơn Nhất, hãng hàng không, doanh nghiệp cung cấp dịch vụ không lưu liên quan có trách nhiệm phân tích, đánh giá sơ bộ về tính chất của thông tin, báo cáo ngay cơ quan có thẩm quyền để xem xét triển khai phương án khẩn nguy thích hợp."],["B","Trước mắt, huy động lực lượng, phương tiện của đơn vị mình tổ chức đối phó ban đầu theo quy định; trường hợp cần thiết, Cục Quản lý xuất nhập cảnh trực tiếp chỉ đạo các lực lượng thực hiện phương án khẩn nguy ban đầu."],["C","Câu A-B Sai"],["D","Câu A-B đúng"]],"a":"D","e":"","g":""},{"n":15,"q":"Cơ quan nào có thẩm quyền cấp thẻ, giấy phép kiểm soát an ninh hàng không cảng hàng không, sân bay có giá trị sử dụng dài hạn, ngắn hạn cho người, phương tiện hoạt động tại Cảng hàng không quốc tế Tân Sơn Nhất?","o":[["A","Công An cửa khẩu Cảng HKQT Tân Sơn Nhất."],["B","Cảng vụ hàng không miền Nam."],["C","Hải quan Tân Sơn Nhất."],["D","Đồn Công An Tân Sơn Nhất."]],"a":"A","e":"","g":""},{"n":16,"q":"Thời hạn, hiệu lực sử dụng đối với thẻ, giấy phép kiểm soát an ninh có giá trị sử dụng dài hạn được Cảng hàng không quốc tế Tân Sơn Nhất cấp?","o":[["A","Tối đa không quá 01 năm kể từ thời điểm thẻ, giấy phép được cấp có hiệu lực."],["B","Không quá 02 năm, kể từ ngày cấp."],["C","Tối đa không quá 03 năm kể từ thời điểm thẻ, giấy phép được cấp có hiệu lực."],["D","Tối đa không quá 04 năm kể từ thời điểm thẻ, giấy phép được cấp có hiệu lực."]],"a":"B","e":"","g":""},{"n":17,"q":"Đơn vị nào có trách nhiệm tổ chức đánh dấu mã số cho các loại dao, kéo, vật dụng sắc, nhọn được sử dụng tại các văn phòng làm việc, phòng chờ hạng thương gia, quầy dịch vụ, cửa hàng, nhà hàng ăn uống, bếp căng tin Cảng hàng không quốc tế Tân Sơn Nhất?","o":[["A","Cảng vụ hàng không miền Nam"],["B","Cảng hàng không quốc tế Tân Sơn Nhất"],["C","Công an cửa khẩu Cảng HKQT TSN"],["D","Tổng công ty Cảng hàng không Việt Nam"]],"a":"C","e":"","g":""},{"n":18,"q":"Tàu bay đang khai thác là ?","o":[["A","Là tàu bay đang đỗ tại sân đỗ, bãi đậu tàu bay để chuẩn bị thực hiện hoạt động bay"],["B","Là tàu bay mang quốc tịch Việt Nam hoặc nước ngoài đang đỗ tại sân đỗ, bãi đậu tàu bay để chuẩn bị thực hiện hoạt động bay"],["C","Là tàu bay đang đỗ tại sân đỗ, bãi đậu tàu bay để chuẩn bị thực hiện hoạt động bay và có sự giám sát an ninh hàng không liên tục bằng biện pháp thích hợp nhằm phát hiện việc tiếp cận, xâm nhập tàu bay trái phép"],["D","Là tàu bay mang quốc tịch của Việt Nam hoặc nước ngoài đang đỗ tại sân đỗ, bãi đậu tàu bay để chuẩn bị thực hiện hoạt động bay và có sự giám sát an ninh hàng không liên tục bằng biện pháp thích hợp nhằm phát hiện việc tiếp cận, xâm nhập tàu bay trái phép."]],"a":"D","e":"","g":""},{"n":19,"q":"Hành khách, hành lý nối chuyến là ?","o":[["A","Là hành khách, hành lý tham gia trong một hành trình"],["B","Là hành khách hành lý tham gia hai chuyến bay khác nhau."],["C","Là hành khách hành lý tham gia trên hai chuyến bay của hai hành trình khác nhau."],["D","Là hành khách hành lý tham gia trực tiếp vào hai chuyến bay khác nhau trở lên trong một hành trình."]],"a":"D","e":"","g":""},{"n":20,"q":"Nhiệm vụ của cán bộ chiến sỹ làm nhiệm vụ kiểm soát an ninh hàng không khi giám sát hành khách bị từ chối nhập cảnh gồm những bước nào?","o":[["A","Quản lý, giám sát hành khách, hành lý bị từ chối nhập cảnh tại khu vực quy định."],["B","Quản lý, giám sát hành khách, hành lý bị từ chối nhập cảnh tại khu vực quy định; Phát hiện, ngăn chặn các hành vi gây rối, bỏ trốn, các hành vi bất thường khác; Phối hợp với CBCS đội Trinh sát và CBCS làm nhiệm vụ kiểm soát an ninh hàng không."],["C","Phối hợp với nhân viên an ninh camera, cán bộ chiến sỹ làm nhiệm vụ kiểm soát an ninh hàng không."],["D","Bàn giao hành khách cho Cảng vụ hàng không."]],"a":"B","e":"","g":""},{"n":21,"q":"Lực lượng an ninh trên không thuộc tổ chức, biên chế của đơn vị nào?","o":[["A","Cục Quản lý xuất nhập cảnh - Bộ Công an"],["B","Cục Tình báo - Bộ Quốc phòng"],["C","Phòng Giám sát An ninh - Cục hàng không Việt Nam"],["D","Cục An ninh chính trị nội bộ - Bộ Công an"]],"a":"A","e":"","g":""},{"n":22,"q":"Nghị định số 264/2026/NĐ-CP của Thủ tướng Chính phủ là quy định về nội dung nào sau đây?","o":[["A","Công tác quản lý vũ khí, công cụ hỗ trợ, vật liệu nổ"],["B","Quy định về an ninh hàng không."],["C","Quy định về xử phạt hành chính trong lĩnh vực hàng không dân dụng."],["D","Công tác bảo đảm chuyến bay chuyên cơ, chuyên khoang."]],"a":"D","e":"","g":""},{"n":23,"q":"Thông tư số 75/2024/TT-BCA quy định chi tiết một số điều của Luật nào sau đây?","o":[["A","Quản lý, sử dụng vũ khí, vật liệu nổ và công cụ hỗ trợ"],["B","Hàng không dân dụng"],["C","Luật tương trợ tư pháp"],["D","Luật dân sự"]],"a":"A","e":"","g":""},{"n":24,"q":"Theo đồng chí: Hãng hàng không không phải chịu trách nhiệm về việc hành khách bị từ chối, nhưng bắt buộc phải thực hiện các nghĩa vụ sau:","o":[["A","Chuyên chở hành khách rời khỏi Việt Nam trong thời gian sớm nhất. Phối hợp với Công an cửa khẩu Cảng HKQT Tân Sơn Nhất để tạm giữ giấy tờ nhân thân. Làm thủ tục xin cấp các giấy tờ cần thiết khác từ cơ quan có thẩm quyền để đưa khách rời khỏi Việt Nam (nếu họ không có giấy tờ hợp lệ)."],["B","Gửi cho Công an cửa khẩu danh sách hành khách, thời gian, địa điểm quản lý người bị từ chối và thông tin chuyến bay sẽ chở họ đi. Tiếp nhận giấy tờ nhân thân từ cơ quan thẩm quyền. Chỉ được giao lại các giấy tờ này khi hành khách đã được bàn giao cho nhà chức trách của quốc gia nơi máy bay hạ cánh."],["C","Câu A-B Sai"],["D","Câu A-B đúng"]],"a":"D","e":"","g":""},{"n":25,"q":"Đối tượng nào sau đây được phục vụ theo tiêu chuẩn chuyến bay chuyên cơ, chuyên khoang của Việt Nam?","o":[["A","Tổng Bí thư Ban Chấp hành Trung ương Đảng Cộng sản Việt Nam."],["B","Chủ tịch nước Cộng hoà xã hội chủ nghĩa Việt Nam."],["C","Thủ tướng chính phủ, Chủ tịch Quốc hội nước Cộng hoà xã hội chủ nghĩa Việt Nam."],["D","Thường trực Ban Bí thư Trung ương Đảng Cộng sản Việt Nam."],["E","Đáp án A, B, C và D đúng."]],"a":"E","e":"","g":""},{"n":26,"q":"Cơ quan, đơn vị nào ban hành quyết định cấm vận chuyển bằng đường hàng không có thời hạn hoặc vĩnh viễn đối với hành khách có các hành vi vi phạm theo quy định của pháp luật?","o":[["A","Cục Hàng không Việt Nam"],["B","Cục Quản lý Xuất nhập cảnh"],["C","Công an địa phương"],["D","Cảng vụ hàng không"]],"a":"B","e":"","g":""},{"n":27,"q":"Ai có thẩm quyền ban hành quyết định cấm vận chuyển bằng đường hàng không có thời hạn hoặc vĩnh viễn đối với hành khách có các hành vi vi phạm về an ninh, trật tự kỷ luật trên tàu bay, tại các cảng hàng không, sân bay?","o":[["A","Cục hàng không Việt Nam"],["B","Hãng hàng không"],["C","Cục Quản lý xuất nhập cảnh"],["D","Cảng vụ hàng không"]],"a":"C","e":"","g":""},{"n":28,"q":"Trên thẻ theo Phụ lục II Thông tư 115/2026/TT-BCA, ký hiệu “STS” thể hiện nội dung gì?","o":[["A","Mặc nhiên được vào mọi khu vực tại mọi cảng hàng không."],["B","Là ký hiệu khu vực hạn chế ga đi quốc tế."],["C","Là thời hạn sử dụng thẻ."],["D","Là ký hiệu đơn vị cấp thẻ: Công an cửa khẩu Cảng hàng không quốc tế Tân Sơn Nhất; không thay thế thông tin về cảng được phép hoạt động hoặc khu vực hạn chế."]],"a":"D","e":"","g":""},{"n":29,"q":"Cặp diễn giải nào đúng về ký hiệu khu vực hạn chế trên thẻ?","o":[["A","Số 2 là ga đến quốc tế; số 5 là ga đi quốc tế."],["B","Số 2 là khu vực hạn chế, cách ly ga đi quốc tế; số 5 là khu vực hạn chế ga đến quốc tế và quốc nội"],["C","Số 2 là sân đỗ tàu bay; số 5 là nhà ga hàng hóa."],["D","Số 2 là khu vực hạn chế, cách ly ga đi quốc tế; số 5 là khu vực hạn chế ga đến quốc tế"]],"a":"B","e":"","g":""},{"n":30,"q":"Thẻ có số 4 thông thường, không màu đỏ và không đóng khung. Nhận định nào đúng?","o":[["A","Ký hiệu này dành cho khu vực nhà khách chuyên cơ trong thời gian không có chuyến bay chuyên cơ; không được đánh đồng với số 4 màu đỏ hoặc đóng khung phục vụ chuyến bay chuyên cơ."],["B","Được vào nhà khách chuyên cơ trong mọi thời điểm."],["C","Được vào khu vực tàu bay chuyên cơ vì số 4 bao gồm số 1."],["D","Chỉ cần là nhân viên thường xuyên thì màu hoặc khung của ký hiệu không có ý nghĩa."]],"a":"A","e":"","g":""}]},{"id":"anks","name":"ANKS – An ninh kiểm soát (chung)","open":false,"qs":[{"n":1,"q":"Tốc độ di chuyển tối đa cho phép đối với xe đạp tuần tra và ô tô trên đường công vụ tại khu vực sân đỗ tàu bay lần lượt là bao nhiêu?","o":[["A","5 km/h và 35 km/h"],["B","5 km/h và 30 km/h"],["C","7 km/h và 35 km/h"],["D","7 km/h và 30 km/h"]],"a":"C","e":"","g":""},{"n":2,"q":"Theo Chương trình ANHK CHKQT Tân Sơn Nhất, bao nhiêu điểm đậu tàu bay được bố trí thành 01 điểm kiểm soát?","o":[["A","01 điểm"],["B","02 điểm"],["C","03 điểm"],["D","04 điểm"]],"a":"B","e":"","g":""},{"n":3,"q":"Khi có lệnh đóng cửa sân bay, việc duy trì hoạt động tại khu vực phục vụ tàu bay được thực hiện như thế nào?","o":[["A","Chỉ phương tiện dừng hoạt động, người vẫn được tiếp tục làm việc."],["B","Chỉ người dừng hoạt động, phương tiện được tiếp tục phục vụ."],["C","Tất cả người và phương tiện ngưng mọi hoạt động tại khu vực được lệnh đóng cửa."],["D","Chỉ dừng hoạt động đối với phương tiện không phục vụ chuyến bay."]],"a":"C","e":"","g":""},{"n":4,"q":"Theo phân định địa bàn sân đỗ, hướng \"bên phải điểm đậu\" của tàu bay được xác định là:","o":[["A","Hướng nhìn từ đuôi tàu bay lên phía đầu tàu bay."],["B","Hướng từ cánh trái sang cánh phải tàu bay."],["C","Hướng nhìn từ đầu (mũi) tàu bay về phía đuôi tàu bay."],["D","Hướng nhìn từ nhà ga ra đường cất hạ cánh"]],"a":"C","e":"","g":""},{"n":5,"q":"Nội dung nào sau đây phải được ghi vào “Sổ nhật ký tuần tra - giám sát an ninh tàu bay” khi kết thúc nhiệm vụ?","o":[["A","Tình hình khai thác của hãng hàng không, số lượng hành khách, hàng hóa mà chuyến bay phục vụ, vận chuyển."],["B","Chỉ ghi nhận các vụ việc, sự cố, vi phạm xảy ra."],["C","Tình hình an ninh khu vực, tình hình an ninh chuyến bay, sự cố/vụ việc vi phạm và các vấn đề cần lưu ý."],["D","Thống kê đầy đủ số lượng, thông tin và vai trò của tất cả những người thực hiện công việc, tiếp cận tàu bay."]],"a":"C","e":"","g":""},{"n":6,"q":"Sau khi tiếp nhận vị trí trực, trường hợp tại điểm đậu đã có tàu bay đang trong quá trình phục vụ mặt đất, cán bộ trực vị trí phải ghi nhận tình hình vào sổ tuần tra – giám sát như thế nào?","o":[["A","Nếu ca trực trước đã ghi nhận thông tin, chỉ thực hiện giám sát và không cần cập nhật thêm."],["B","Dù ca trực trước đã ghi nhận thông tin, vẫn ghi lại toàn bộ như một chuyến bay mới đến."],["C","Nếu ca trực trước đã ghi nhận thông tin thì tiếp tục cập nhật; nếu ca trực trước chưa ghi nhận thì thực hiện ghi bổ sung theo thời gian thực tế của chuyến bay."],["D","Nếu ca trực trước đã ghi nhận thông tin thì tiếp tục cập nhật; nếu ca trực trước chưa ghi nhận thì bỏ qua, không ghi bổ sung."]],"a":"C","e":"","g":""},{"n":7,"q":"Cách ghi sổ Nhật ký tuần tra - giám sát an ninh tàu bay đúng chuẩn quy định là:","o":[["A","A321-231-445; Điểm đậu: 103; VN190-VN1838; SGN-DLI"],["B","A321-VNA445; Điểm đậu: 103A; VN190-VN1838; SGN-HAN-SGN-DLI"],["C","A321-VNA445; Điểm đậu: 103A; 190-1838; HAN-DLI"],["D","A321-VNA445; Điểm đậu: 103B; VN190-VN1838; HAN-SGN-DLI"]],"a":"D","e":"","g":""},{"n":8,"q":"Trong một chuyến bay thông thường, CBCS trực tại vị trí phải thực hiện việc kiểm tra xác suất với tần suất quy định là:","o":[["A","Tối đa 01 lần/chuyến bay"],["B","Tối thiểu 01 lần/chuyến bay"],["C","Tối thiểu 02 lần/chuyến bay"],["D","Không bắt buộc kiểm tra xác suất"]],"a":"B","e":"","g":"Nhóm 2: Nghiệp vụ kiểm tra, giám sát chuyến bay thông thường"},{"n":9,"q":"Trường hợp chưa đến thời điểm kiểm tra xác suất nhưng CBCS phát hiện phương tiện tiếp cận tàu bay có biểu hiện bất thường, CBCS trực vị trí phải như thế nào?","o":[["A","Chờ đến thời điểm kiểm tra xác suất mới tiến hành kiểm tra."],["B","Tiến hành ngay việc kiểm tra để xác minh, làm rõ và báo cáo Kíp trưởng."],["C","Dừng ngay phương tiện, yêu cầu đưa phương tiện về khu vực chỉ huy ca trực để làm rõ"],["D","Ghi nhận biển số phương tiện và theo dõi từ xa."]],"a":"B","e":"","g":"Nhóm 2: Nghiệp vụ kiểm tra, giám sát chuyến bay thông thường"},{"n":10,"q":"Khi tàu bay đóng cửa chờ khai thác, các phương tiện phục vụ mặt đất phải làm gì?","o":[["A","Đứng tại vị trí tiếp cận để chờ lệnh khởi hành."],["B","Chỉ duy trì xe thang và xe cung cấp điện/khí tại tàu bay."],["C","Di dời hoàn toàn khỏi khu vực tàu bay."],["D","Chỉ duy trì các phương tiện của đơn vị xe chở hành lý."]],"a":"C","e":"","g":"Nhóm 2: Nghiệp vụ kiểm tra, giám sát chuyến bay thông thường"},{"n":11,"q":"Trường hợp tại một điểm kiểm soát cùng lúc 02 tàu bay đang đậu tại 02 vị trí khác nhau, CBCS trực chọn vị trí và thực hiện giám sát như thế nào?","o":[["A","Đứng chính giữa khoảng cách 2 tàu bay, giữ nguyên vị trí và liên tục đảo mắt kiểm tra, quan sát."],["B","Chủ động chọn vị trí quan sát bao quát, đảm bảo giám sát cả 02 tàu bay, ưu tiên tàu đang khai thác chính."],["C","Di chuyển liên tục từ đầu đến đuôi tàu bay này rồi chuyển sang tàu bay kia."],["D","Sử dụng xe đạp di chuyển vòng tròn quanh 02 tàu bay."]],"a":"B","e":"","g":"Nhóm 2: Nghiệp vụ kiểm tra, giám sát chuyến bay thông thường"},{"n":12,"q":"Tư thế chuẩn đối với người được kiểm tra khi CBCS thực hiện quy trình kiểm tra trực quan con người là:","o":[["A","Hai tay đưa thẳng lên cao, hai chân chụm lại."],["B","Hai tay dang rộng ngang vai, hai chân mở rộng bằng vai."],["C","Hai tay đặt chéo sau lưng, hai chân mở rộng tối đa."],["D","Hai tay dang rộng ngang vai, đứng chân trước chân sau cách nhau 50cm."]],"a":"B","e":"","g":"Nhóm 2: Nghiệp vụ kiểm tra, giám sát chuyến bay thông thường"},{"n":13,"q":"Khi kiểm tra thẻ KSAN dài hạn, KHÔNG bắt buộc kiểm tra nội dung nào sau đây?","o":[["A","Số thẻ, thời hạn hiệu lực của thẻ."],["B","Họ tên, ảnh chân dung, tên đơn vị công tác."],["C","Số hộ chiếu/Thẻ căn cước của người mang thẻ."],["D","Khu vực hạn chế được phép hoạt động."]],"a":"C","e":"","g":"Nhóm 2: Nghiệp vụ kiểm tra, giám sát chuyến bay thông thường"},{"n":14,"q":"Đối với người sử dụng Thẻ kiểm soát an ninh ngắn hạn, quy định giám sát khi vào khu vực hạn chế sân đỗ là:","o":[["A","Chỉ cần nhân viên hãng hàng không đi cùng."],["B","Phải được giám sát bởi người có Thẻ kiểm soát an ninh dài hạn phù hợp."],["C","Phải do Cán bộ Kíp trưởng hoặc Kíp phó trực tiếp đi kèm."],["D","Được tự do đi lại nếu đi đúng khu vực ghi trên thẻ."]],"a":"B","e":"","g":"Nhóm 2: Nghiệp vụ kiểm tra, giám sát chuyến bay thông thường"},{"n":15,"q":"Khi thực hiện kiểm tra hành lý, đồ vật, công cụ, dụng cụ mang lên/xuống tàu bay, phương pháp kiểm tra nào đúng quy định?","o":[["A","Kiểm tra từ dưới lên trên, từ trong ra ngoài, từ phải sang trái."],["B","Kiểm tra từ trên xuống dưới, từ ngoài vào trong, từ trái qua phải; kiểm tra hết từng ngăn trước khi chuyển sang ngăn kế bên."],["C","Kiểm tra ngẫu nhiên các vị trí đại diện trong túi/hành lý; kiểm tra hết từng ngăn trước khi chuyển sang ngăn kế bên."],["D","Kiểm tra đồng thời tất cả các ngăn cùng một lúc, lấy hết đồ đạc bên trong ra ngoài, dốc ngược túi để đảm bảo không còn đồ đạc bên trong."]],"a":"B","e":"","g":"Nhóm 2: Nghiệp vụ kiểm tra, giám sát chuyến bay thông thường"},{"n":16,"q":"Phát hiện người phục vụ tàu bay không đeo thẻ KSAN và không xuất trình được thẻ tại thời điểm kiểm tra, CBCS xử lý như thế nào?","o":[["A","Nhắc nhở và giải quyết cho người phục vụ tàu bay tiếp tục công việc nếu nhận thấy người đó đúng là nhân viên và đã từng kiểm tra trước đó."],["B","Cho phép làm việc nếu có quản lý đơn vị bảo lãnh bằng lời nói trực tiếp."],["C","Yêu cầu tạm dừng hoạt động, xuất trình thẻ; nếu không có thì lập biên bản/báo cáo Kíp trưởng xử lý."],["D","Yêu cầu viết cam kết và cho tiếp tục làm việc."]],"a":"C","e":"","g":"Nhóm 2: Nghiệp vụ kiểm tra, giám sát chuyến bay thông thường"},{"n":17,"q":"Trong quá trình giám sát, CBCS phát hiện một phương tiện không thuộc danh mục làm việc thường xuyên đang di chuyển vào khu vực sân đỗ tàu bay. CBCS thực hiện như thế nào là đúng quy định?","o":[["A","Chỉ cần kiểm tra giấy phép lưu hành của phương tiện một lần duy nhất trong ngày."],["B","Yêu cầu phương tiện phải có CBCS kiểm soát an ninh hoặc nhân viên của đơn vị chủ quản giám sát, hướng dẫn trực tiếp trong suốt quá trình ra vào và hoạt động."],["C","Chỉ cần người điều khiển phương tiện xuất trình Thẻ kiểm soát an ninh dài hạn còn hiệu lực."],["D","Cho phép phương tiện di chuyển tự do nếu đã qua cổng kiểm soát an ninh sân bay."]],"a":"B","e":"","g":"Nhóm 2: Nghiệp vụ kiểm tra, giám sát chuyến bay thông thường"},{"n":18,"q":"Đối với tàu bay chuyên cơ đến, thời điểm CBCS phục vụ chuyên cơ phải có mặt tại điểm đậu và triển khai kiểm tra, giám sát an ninh là:","o":[["A","60 phút trước giờ tàu bay hạ cánh theo lịch trình."],["B","90 phút trước giờ tàu bay hạ cánh theo lịch trình."],["C","60 phút trước khi tàu bay hạ cánh."],["D","90 phút trước khi tàu bay hạ cánh."]],"a":"C","e":"","g":"Nhóm 3: Nghiệp vụ giám sát, đảm bao an ninh chuyến bay chuyên cơ"},{"n":19,"q":"Ngoài Thẻ kiểm soát an ninh hàng không, nhân viên phục vụ chuyến bay chuyên cơ bắt buộc phải có thêm loại giấy tờ/thẻ nào?","o":[["A","Thẻ lên tàu bay (Boarding Pass)."],["B","Thẻ phục vụ VIP/Chuyên cơ."],["C","Giấy giới thiệu của Cục Hàng không."],["D","Giấy chứng nhận nhân viên đạt chuẩn phục vụ tàu bay chuyên cơ."]],"a":"B","e":"","g":"Nhóm 3: Nghiệp vụ giám sát, đảm bao an ninh chuyến bay chuyên cơ"},{"n":20,"q":"Đối với tàu bay chuyên cơ đi, thời gian triển khai công tác kiểm tra, giám sát an ninh tối thiểu là:","o":[["A","02 giờ trước giờ cất cánh dự kiến."],["B","03 giờ trước giờ cất cánh dự kiến."],["C","02 giờ trước giờ đóng cửa khởi hành."],["D","03 giờ trước giờ đóng cửa khởi hành."]],"a":"C","e":"","g":"Nhóm 3: Nghiệp vụ giám sát, đảm bao an ninh chuyến bay chuyên cơ"},{"n":21,"q":"Nguyên tắc kiểm tra an ninh đối với các phương tiện tiếp cận điểm đậu tàu bay chuyên cơ được quy định:","o":[["A","Kiểm tra xác suất tối thiểu 50% số phương tiện, trừ phương tiện trong đoàn xe phục vụ chuyên cơ theo kế hoạch."],["B","Kiểm tra tất cả các phương tiện, trừ phương tiện trong đoàn xe phục vụ chuyên cơ theo kế hoạch."],["C","Chỉ kiểm tra các xe chở hành lý, hàng hóa, không kiểm tra phương tiện chở hành khách hoặc nhân viên phục vụ, nhân viên thợ máy nhằm tránh ảnh hưởng đến việc phục vụ chuyến bay."],["D","Kiểm tra 100% tất cả các phương tiện, không ngoại lệ."]],"a":"B","e":"","g":"Nhóm 3: Nghiệp vụ giám sát, đảm bao an ninh chuyến bay chuyên cơ"},{"n":22,"q":"Khi kiểm tra cầu thang phục vụ chuyên cơ, tại các vị trí góc khuất, khó quan sát, CBCS thực hiện như thế nào?","o":[["A","Chỉ quan sát bằng mắt thường từ phía ngoài, trường hợp phát hiện nghi vấn thì trực tiếp tiến hành kiểm tra."],["B","Yêu cầu nhân viên kỹ thuật hoặc người điều khiển hỗ trợ mở/tháo lắp để kiểm tra."],["C","Không tiến hành kiểm tra trực quan, trực tiếp nếu nhận thấy các niêm phong bên ngoài còn nguyên vẹn."],["D","Yêu cầu toàn bộ nhân viên vận hành, điều khiển trang thiết bị đứng cách xa cầu thang, tiến hành kiểm tra trực tiếp."]],"a":"B","e":"","g":"Nhóm 3: Nghiệp vụ giám sát, đảm bao an ninh chuyến bay chuyên cơ"},{"n":23,"q":"CBCS giám sát hầm hàng tàu bay chuyên cơ thực hiện việc giao nhận hành lý, hàng hóa, bưu gửi với lực lượng soi chiếu áp tải bằng hình thức nào?","o":[["A","Bàn giao bằng lời nói trực tiếp."],["B","Bàn giao và ký xác nhận thông qua sổ sách/biên bản chuyên dụng."],["C","Đơn vị phục vụ tự chịu trách nhiệm, CBCS chỉ đứng giám sát từ xa."],["D","Chỉ ký xác nhận sau khi tàu bay đã cất cánh."]],"a":"B","e":"","g":"Nhóm 3: Nghiệp vụ giám sát, đảm bao an ninh chuyến bay chuyên cơ"},{"n":24,"q":"Yêu cầu kiểm tra an ninh đối với xe cung cấp suất ăn và xe cung cấp vật tư phục vụ chuyến bay chuyên cơ là:","o":[["A","Chỉ kiểm tra giấy phép phương tiện và người điều khiển."],["B","Kiểm tra trực quan xe; hàng hóa/vật tư phải được dán tem an ninh và có CBCS an ninh áp tải."],["C","Chỉ kiểm tra trực quan bên ngoài thùng xe, ghi nhận số biển kiểm soát phương tiện."],["D","Miễn kiểm tra nếu xe thuộc các đơn vị dịch vụ mặt đất nội bộ sân bay."]],"a":"B","e":"","g":"Nhóm 3: Nghiệp vụ giám sát, đảm bao an ninh chuyến bay chuyên cơ"},{"n":25,"q":"Khi phát hiện hành vi xâm nhập trái phép có nguy cơ nghiêm trọng đối với an ninh, an toàn hàng không, yêu cầu ưu tiên là:","o":[["A","Lập biên bản vi phạm."],["B","Xác minh danh tính người vi phạm trước khi xử lý."],["C","Bảo đảm an toàn hoạt động bay và triển khai phương án khẩn nguy khi cần thiết."],["D","Chờ đơn vị quản lý khu vực quyết định."]],"a":"C","e":"","g":"Nhóm 4: Quy trình xử lý sự cố, vi phạm và tình huống khẩn nguy"},{"n":26,"q":"Đối với hành khách gây rối trên tàu bay đang đậu tại mặt đất, lực lượng an ninh hàng không cần:","o":[["A","Tăng cường giám sát; lên tàu bay ngay lập tức, phối hợp tổ bay và áp dụng biện pháp cần thiết để đưa hành khách xuống."],["B","Tăng cường giám sát; lên tàu bay khi có yêu cầu của cơ trưởng, tiếp viên trưởng hoặc Cảng vụ hàng không, phối hợp và áp dụng biện pháp cần thiết để đưa hành khách xuống."],["C","Tăng cường giám sát; chờ tàu bay khởi hành rồi xử lý."],["D","Yêu cầu hành khách khác khống chế người gây rối và dẫn người vi phạm xuống tàu bay."]],"a":"B","e":"","g":"Nhóm 4: Quy trình xử lý sự cố, vi phạm và tình huống khẩn nguy"},{"n":27,"q":"Phát hiện tem niêm phong trên mâm hàng hóa (cargo) hoặc kiện hàng chuẩn bị đưa lên tàu bay bị rách/vỡ, CBCS xử lý thế nào trước tiên?","o":[["A","Yêu cầu dán lại tem mới và cho đưa lên tàu bay."],["B","Cho phép đưa lên tàu bay nếu kiểm tra bên ngoài hàng hóa không hỏng hóc."],["C","Cách ly kiện/mâm hàng, tiến hành kiểm tra, xác minh làm rõ và báo cáo ngay Cán bộ trực Đội/Kíp trưởng."],["D","Mở toàn bộ hàng hoá ra để kiểm tra, ghi nhận tình trạng và yêu cầu chở về lại khu vực kho hàng để dán tem niêm phong mới."]],"a":"C","e":"","g":"Nhóm 4: Quy trình xử lý sự cố, vi phạm và tình huống khẩn nguy"},{"n":28,"q":"Trình tự các bước xử lý ban đầu đối với vụ việc vi phạm an ninh hàng không tại sân đỗ là:","o":[["A","Lập biên bản -> Báo cáo -> Ngăn chặn -> Đưa người vi phạm về nơi xử lý."],["B","Ngăn chặn/Tạm giữ -> Kiểm tra, thu giữ tang vật -> Báo cáo Chỉ huy đội -> Đưa về nơi quy định -> Thông báo đơn vị có thẩm quyền."],["C","Báo cáo cấp trên -> Chờ chỉ đạo -> Mới tiến hành ngăn chặn."],["D","Thu giữ tang vật -> Cho người vi phạm rời đi -> Lập báo cáo."]],"a":"B","e":"","g":"Nhóm 4: Quy trình xử lý sự cố, vi phạm và tình huống khẩn nguy"},{"n":29,"q":"Khi tiếp nhận thông tin đe dọa có bom qua điện thoại, những nội dung quan trọng hàng đầu CBCS cần tập trung ghi nhận là:","o":[["A","Chỉ cần ghi lại số điện thoại người gọi đến."],["B","Địa điểm bom, thời gian dự kiến nổ, đặc điểm bom, yêu cầu của đối tượng, phương thức liên lạc, đặc điểm giọng nói và âm thanh nền."],["C","Tên và chức vụ của người nghe điện thoại."],["D","Thời gian cuộc gọi kết thúc và tên hãng hàng không bị đe dọa."]],"a":"B","e":"","g":"Nhóm 4: Quy trình xử lý sự cố, vi phạm và tình huống khẩn nguy"},{"n":30,"q":"Phát hiện hành lý không xác định được chủ sở hữu chưa qua kiểm tra an ninh tại khu vực sân đỗ, quy trình xử lý đúng là:","o":[["A","Mở ngay hành lý ra kiểm tra để tìm thông tin liên lạc của chủ sở hữu."],["B","Cách ly hành lý hoàn toàn; tuyệt đối không cho người không có nhiệm vụ tiếp cận, sờ chạm; quan sát bên ngoài và dùng thiết bị chuyên dụng kiểm tra chất nổ."],["C","Chuyển ngay hành lý về kho thất lạc của sân bay."],["D","Xác định hành lý đó là FOD, bàn giao cho nhân viên mặt đất và tiến hành xử lý theo quy định đôí với FOD."]],"a":"B","e":"","g":"Nhóm 4: Quy trình xử lý sự cố, vi phạm và tình huống khẩn nguy"},{"n":31,"q":"Thẻ, giấy phép kiểm soát an ninh hàng không gồm:","o":[["A","Thẻ, giấy phép kiểm soát an ninh cảng hàng không loại có giá trị sử dụng dài hạn và loại có giá trị sử dụng ngắn hạn."],["B","Thẻ, giấy phép kiểm soát an ninh nội bộ loại có giá trị sử dụng dài hạn và loại có giá trị sử dụng ngắn hạn."],["C","Thẻ nhận dạng tổ bay của hãng hàng không."],["D","Tất cả đều đúng."]],"a":"C","e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":32,"q":"Thẻ, giấy phép kiểm soát an ninh hàng không phải được:","o":[["A","Bảo mật."],["B","Chống làm giả."],["C","Công khai cho mọi người biết."],["D","Đáp án A, B đúng."]],"a":"B","e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":33,"q":"Các thông tin cơ bản trên thẻ kiểm soát an ninh cảng hàng không cảng hàng không gồm các nội dung nào?","o":[["A","Tên cơ quan, đơn vị cấp thẻ, Ký hiệu đơn vị cấp thẻ, Số thẻ, giấy phép; Ký hiệu khu vực hạn chế, Thời hạn hiệu lực của thẻ, giấy phép."],["B","Ký hiệu cảng hàng không được phép vào hoạt động: Ghi theo quy ước của IATA tên cảng hàng không."],["C","Họ và tên, chức vụ, tên cơ quan, đơn vị, ảnh chân dung của người được cấp thẻ đối với thẻ kiểm soát an ninh cảng hàng không có giá trị sử dụng dài hạn."],["D","Họ và tên, đơn vị, số giấy tờ tùy thân của người được cấp thẻ đối với thẻ kiểm soát an ninh cảng hàng không có giá trị sử dụng ngắn hạn."],["E","Đáp án A, B, C và D đúng."]],"a":"C","e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":34,"q":"Trong thông tư số 115/2026/TT-BCA ngày 29/06/2026 Quy định về thẻ, giấy phép, chứng nhận an ninh hàng không. Khu vực sân đỗ tàu bay, đường hạ cất cánh, đường lăn và các khu vực khác trong sân bay được ký hiệu số mấy.","o":[["A","Số 1."],["B","Số 2."],["C","Số 3."],["D","Số 4."]],"a":"C","e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":35,"q":"Trong thông tư số 115/2026/TT-BCA ngày 29/06/2026 Quy định về thẻ, giấy phép, chứng nhận an ninh hàng không. Khu vực hạn chế ga đi quốc tế bao gồm khu vực cách ly, các khu vực hạn chế khác của ga đi quốc tế được ký hiệu số mấy?","o":[["A","Số 1"],["B","Số 2"],["C","Số 3"],["D","Số 4"]],"a":"C","e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":36,"q":"Trong thông tư số 115/2026/TT-BCA ngày 29/06/2026 Quy định về thẻ, giấy phép, chứng nhận an ninh hàng không. Khu vực hạn chế ga đi nội địa bao gồm khu vực cách ly, các khu vực hạn chế khác của ga đi nội địa được ký hiệu số mấy?","o":[["A","Số 1."],["B","Số 3."],["C","Số 4."],["D","Số 6."]],"a":"C","e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":37,"q":"Thẻ kiểm soát an ninh nội bộ có giá trị sử dụng dài hạn phải có các thông tin cơ bản nào sau đây:","o":[["A","Số thẻ; ký hiệu của doanh nghiệp; Thời hạn hiệu lực của thẻ; Họ và tên của người được cấp thẻ."],["B","Tên cơ quan, đơn vị của người được cấp thẻ; Ảnh của người được cấp thẻ; Chức danh của người được cấp thẻ."],["C","Tên cơ quan, đơn vị của người được cấp thẻ;"],["D","Khu vực hạn chế được phép vào và hoạt động (nếu có); Quy định về sử dụng thẻ."],["E","Đáp án A, B, C và D đúng.."]],"a":"D","e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":38,"q":"Giấy phép kiểm soát an ninh nội bộ có giá trị sử dụng dài hạn phải có các thông tin cơ bản nào sau đây?","o":[["A","Số giấy phép; Thời hạn hiệu lực của giấy phép."],["B","Loại phương tiện; Biển kiểm soát phương tiện;"],["C","Khu vực hạn chế được phép vào và hoạt động (nếu có);Cổng ra, cổng vào."],["D","Tên cơ quan, đơn vị chủ quản phương tiện."],["E","Đáp án A, B, C và D đúng."]],"a":"B","e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":39,"q":"Thẻ, giấy phép kiểm soát an ninh cảng hàng không có giá trị sử dụng dài hạn có thời hạn bao lâu?","o":[["A","Không có thời hạn."],["B","Không quá 30 ngày, kể từ ngày cấp."],["C","Không quá 02 năm, kể từ ngày cấp."],["D","Đáp án A, B, C đúng."]],"a":"B","e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":40,"q":"Thẻ, giấy phép kiểm soát an ninh cảng hàng không có giá trị sử dụng ngắn hạn có thời hạn bao lâu?","o":[["A","Không quá 24h kể từ thời điểm sử dụng."],["B","Không quá 02 năm, kể từ ngày cấp."],["C","Có thời hạn không quá 30 ngày, kể từ thời điểm có hiệu lực."],["D","Đáp án A, B, C và D đúng."]],"a":"C","e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":41,"q":"Giám sát an ninh thường xuyên là gì?","o":[["A","Là việc sử dụngkết hợp con người, động vật, trang bị, thiết bị kỹ thuật để quản lý, ngăn chặn các hành vi vi phạm hoặc có dấu hiệu vi phạm về an ninh hàng không."],["B","Là việc sử dụng riêng lẻ hoặc kết hợp con người, trang bị, thiết bị kỹ thuật để ngăn chặn các hành vi vi phạm hoặc có dấu hiệu vi phạm về an ninh hàng không."],["C","Là việc sử dụng con người, động vật, trang bị, thiết bị kỹ thuật để quản lý, theo dõi nhằm phát hiện, ngăn chặn các hành vi vi phạm hoặc có dấu hiệu vi phạm về an ninh hàng không."],["D","Là việc sử dụng riêng lẻ hoặc kết hợp con người, động vật, trang bị, thiết bị kỹ thuật để quản lý, theo dõi nhằm phát hiện, ngăn chặn các hành vi vi phạm hoặc có dấu hiệu vi phạm về an ninh hàng không."]],"a":"B","e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":42,"q":"Giấy phép kiểm soát an ninh cảng hàng không là gì?","o":[["A","Là tài liệu xác nhận người được phép vào và hoạt động trong khu vực hạn chế liên quan của cảng hàng không."],["B","Là tài liệu xác nhận phương tiện được phép vào trong khu vực hạn chế liên quan của cảng hàng không."],["C","Là tài liệu xác nhận người và phương tiện được phép vào và hoạt động trong khu vực hạn chế liên quan của cảng hàng không."],["D","Là tài liệu xác nhận phương tiện được phép vào và hoạt động trong khu vực hạn chế liên quan của cảng hàng không."]],"a":"B","e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":43,"q":"Hành lý không xác định được chủ sở hữu là gì?","o":[["A","Là hành lý có hoặc không có thẻ hành lý, không được bất cứ hành khách hoặc thành viên tổ bay nào nhận hoặc thông tin về chủ sở hữu."],["B","Là hành lý không có thông tin chủ sở hữu; nằm tại sân bay."],["C","Là hành lý không được bất cứ hành khách hoặc thành viên tổ bay nào nhận hoặc thông tin về chủ sở hữu."],["D","Là hành lý không có thông tin chủ sở hữu; nằm tại sân bay, có hoặc không có thẻ hành lý, không được bất cứ hành khách hoặc thành viên tổ bay nào nhận hoặc thông tin về chủ sở hữu."]],"a":"C","e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":44,"q":"Hành khách gây rối là gì?","o":[["A","Là hành khách không chấp hành các quy định về ứng xử tại cảng hàng không , không tuân thủ hướng dẫn của lực lượng kiểm soát an ninh hàng, từ đó làm ảnh hưởng đến an ninh, trật tự và kỷ luật tại cảng hàng."],["B","Là hành khách không chấp hành các quy định về ứng xử trên tàu bay, không tuân thủ hướng dẫn củanhân viên hàng không hoặc tổ bay, từ đó làm ảnh hưởng đến an ninh, trật tự và kỷ luật trên tàu bay."],["C","Là hành khách không chấp hành không tuân thủ hướng dẫn của lực lượng kiểm soát an ninh hàng không hoặc nhân viên hàng không hoặc tổ bay, từ đó làm ảnh hưởng đến an ninhtại cảng hàng không hoặc trên tàu bay."],["D","Là hành khách không chấp hành các quy định về ứng xử tại cảng hàng không hoặc trên tàu bay, không tuân thủ hướng dẫn của lực lượng kiểm soát an ninh hàng không hoặc nhân viên hàng không hoặc tổ bay, từ đó làm ảnh hưởng đến an ninh, trật tự và kỷ luật tại cảng hàng không hoặc trên tàu bay."]],"a":"B","e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":45,"q":"Hộ tống an ninh hàng không là gì?","o":[["A","Là việc cử người của tổ chức, đơn vị để quản lý, hướng dẫn một người hoặc nhiều người vào, hoạt động trong khu vực hạn chế cảng hàng không nhằm ngăn chặn các hành vi, dấu hiệu vi phạm an ninh hàng không."],["B","Là việc cử người đáp ứng các điều kiện nhất định để quản lý, hướng dẫn người vào, hoạt động trong khu vực hạn chế cảng hàng không nhằm ngăn chặn các hành vi, dấu hiệu vi phạm an ninh hàng không."],["C","Là việc cử người của tổ chức, đơn vị đáp ứng các điều kiện nhất định để quản lý, hướng dẫn một người hoặc nhiều người vào, hoạt động trong khu vực hạn chế cảng hàng không."],["D","Là việc cử người của tổ chức, đơn vị đáp ứng các điều kiện nhất định để quản lý, hướng dẫn một người hoặc nhiều người vào, hoạt động trong khu vực hạn chế cảng hàng không nhằm ngăn chặn các hành vi, dấu hiệu vi phạm an ninh hàng không."]],"a":"B","e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":46,"q":"Kiểm tra an ninh hàng không là gì?","o":[["A","Là sử dụng riêng lẻ hoặc kết hợp các biện pháp bảo đảm an ninh hàng không."],["B","Là sử dụng kết hợp các biện pháp bảo đảm an ninh hàng không nhằm phát hiện, ngăn chặn các hành vi vi phạmvề an ninh hàng không."],["C","Là sử dụng riêng lẻ các biện pháp bảo đảm an ninh hàng không nhằm ngăn chặn các hành vi vi phạm hoặc có dấu hiệu vi phạm về an ninh hàng không."],["D","Là sử dụng riêng lẻ hoặc kết hợp các biện pháp bảo đảm an ninh hàng không nhằm phát hiện, ngăn chặn các hành vi vi phạm hoặc có dấu hiệu vi phạm về an ninh hàng không."]],"a":"C","e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":47,"q":"Nhà chức trách an ninh hàng không Việt Nam là đơn vị nào?","o":[["A","Cục hàng không."],["B","Cục Quản lý xuất nhập cảnh, Bộ Công an."],["C","Cảng vụ hàng không."],["D","Đáp án A, B và C đúng."]],"a":"B","e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":48,"q":"Soi chiếu an ninh hàng không là gì?","o":[["A","Là việc sử dụng trang bị, thiết bị kỹ thuật để phát hiện vũ khí, chất nổ hoặc vật phẩm nguy hiểm khác có thể được sử dụng để thực hiện hành vi can thiệp bất hợp pháp vào hoạt động hàng không dân dụng."],["B","Là việc sử dụng trang bị, để phát hiện vũ khí, chất nổ hoặc vật phẩm nguy hiểm khác để thực hiện hành vi can thiệp bất hợp pháp vào hoạt động hàng không dân dụng."],["C","Là việc sử dụng biện pháp nghiệp vụ để phát hiện vũ khí, chất nổ hoặc vật phẩm nguy hiểm khác có thể được sử dụng để thực hiện hành vi can thiệp bất hợp pháp vào hoạt động hàng không dân dụng."],["D","Là việc sử dụng trang bị, thiết bị kỹ thuật hoặc biện pháp khác để phát hiện vũ khí, chất nổ hoặc vật phẩm nguy hiểm khác có thể được sử dụng để thực hiện hành vi can thiệp bất hợp pháp vào hoạt động hàng không dân dụng."]],"a":"C","e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":49,"q":"Người, phương tiện vào, ra và hoạt động tại khu vực hạn chế phải có các loại giấy tờ nào?","o":[["A","Phải có thẻ kiểm soát an ninh hàng không do cơ quan có thẩm quyền cấp."],["B","Phải có giấy phép kiểm soát an ninh hàng không do cơ quan có thẩm quyền cấp."],["C","Trường hợp là hành khách đi tàu bay hoặc trong trường hợp khẩn nguy an ninh, an toàn tại cảng hàng không."],["D","Phải có thẻ, giấy phép kiểm soát an ninh hàng không do cơ quan có thẩm quyền cấp, trừ trường hợp là hành khách đi tàu bay hoặc trong trường hợp khẩn nguy an ninh, an toàn tại cảng hàng không."]],"a":"B","e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":50,"q":"Lực lượng kiểm soát an ninh hàng không tại cảng hàng không có trách nhiệm chủ trì, phối hợp đơn vị nào để duy trì, bảo đảm an ninh, trật tự xã hội tại khu vực công cộng thuộc cảng hàng không.","o":[["A","Công an cấp xã, phường lân cận."],["B","Người khai thác cảng hàng không."],["C","Cảng vụ hàng không."],["D","Đáp án A và B đúng."],["D","Cả 3 đáp án trên đúng."]],"a":"C","e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":59,"q":"Theo đồng chí : Cổng, cửa, hàng rào di động tại điểm kiểm tra an ninh hàng không phải luôn trong trạng thái đóng (khóa) và chỉ được mở khi người, phương tiện đã được kiểm tra, đủ điều kiện ra, vào.","o":[["A","Sai"],["B","Đúng"]],"a":"B","e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":60,"q":"Tại mỗi điểm kiểm tra an ninh hàng không (trừ điểm kiểm tra an ninh hàng không từ khu vực công cộng vào khu vực hạn chế được tạm thời thiết lập) phải có các tài liệu hoặc dữ liệu điện tử sau đây:","o":[["A","Quy trình kiểm tra người, đồ vật, phương tiện khi ra, vào khu vực hạn chế. Mẫu thẻ, giấy phép kiểm soát an ninh hàng không được phép vào khu vực; mẫu thẻ giám sát viên an ninh hàng không."],["B","Danh sách những người, phương tiện bị mất thẻ, giấy phép; bị thu hồi nhưng không nộp thẻ, giấy phép kiểm soát an ninh hàng không."],["C","Danh bạ các số điện thoại liên quan và các biểu mẫu, biên bản, phiếu đăng ký vật phẩm nguy hiểm, phương tiện, đồ vật mang vào khu vực hạn chế; danh mục đồ vật phải đăng ký hoặc khai báo tại điểm kiểm tra an ninh hàng không khi mang theo người vào trong khu vực hạn chế; đồ vật không được mang theo người vào làm việc tại các khu vực hạn chế."],["D","Sổ giao ca hoặc văn bản điện tử ghi chép tình hình và kết quả kiểm tra, giám sát an ninh"],["E","Tất cả đáp án trên đúng."]],"a":"B","e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":64,"q":"Theo đồng chí việc thử nghiệm an ninh hàng không: Thử nghiệm bí mật phải bảo đảm bí mật nội dung, thời gian, địa điểm, kế hoạch, phương án và toàn bộ quá trình thử nghiệm, chỉ thành viên trong đoàn mới được phổ biến. Thử nghiệm công khai phải thông báo trước nội dung, thời gian, địa điểm thử nghiệm cho đơn vị là đối tượng chịu sự thử nghiệm. Căn cứ kế hoạch thử nghiệm được phê duyệt, trưởng đoàn thử nghiệm xây dựng phương án thực hiện cho từng thử nghiệm cụ thể.","o":[["A","Sai"],["B","Đúng"]],"a":null,"e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":65,"q":"Người sử dụng thẻ kiểm soát an ninh hàng không không có giá trị sử dụng ngắn hạn phải được hộ tống khi vào, hoạt động trong khu vực hạn chế. Người hộ tống phải có thẻ kiểm soát an ninh cảng hàng không, sân bay có giá trị sử dụng dài hạn phù hợp và thuộc một trong các đối tượng dưới đây:","o":[["A","Người thường xuyên làm việc tại khu vực hạn chế của cơ quan đề nghị cấp thẻ ngắn hạn; Người của cơ quan chủ quản khu vực hạn chế; cơ quan quản lý khu vực hạn chế; đơn vị hoạt động thường xuyên tại khu vực hạn chế; Người của đơn vị kiểm soát an ninh hàng không, cảng vụ hàng không"],["B","Người thường xuyên làm việc tại khu vực hạn chế của cơ quan đề nghị cấp thẻ ngắn hạn; Người của cơ quan chủ quản khu vực"],["C","Cơ quan quản lý khu vực hạn chế; đơn vị hoạt động thường xuyên tại khu vực hạn chế; Người của đơn vị kiểm soát an ninh hàng không, cảng vụ hàng không"]],"a":null,"e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":66,"q":"Các trường hợp phương tiện vào và hoạt động trong khu vực hạn chế của sân bay cần có sự giám sát của lực lượng kiểm soát an ninh hàng không, nhân viên có giấy phép khai thác phương tiện mặt đất, hoặc xe dẫn đường bao gồm:","o":[["A","Người điều khiển chỉ có thẻ kiểm soát an ninh ngắn hạn;"],["B","Người điều khiển chưa có chứng chỉ đào tạo vận hành phương tiện trong sân đỗ do cơ quan có thẩm quyền cấp theo quy định;"],["C","Phương tiện hoạt động không thường xuyên trong khu bay."],["D","Cả 3 đáp án trên đúng"]],"a":null,"e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":67,"q":"Theo đồng chí: Phương tiện hoạt động trong khu vực hạn chế phải chạy đúng luồng, tuyến, đúng tốc độ, dừng, đỗ đúng vị trí quy định; chịu sự kiểm tra, giám sát và tuân theo sự hướng dẫn của lực lượng kiểm soát an ninh hàng không đang làm nhiệm vụ.","o":[["A","Đúng"],["B","Sai"]],"a":null,"e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":68,"q":"Theo đồng chí: Trong trường hợp thực hiện nhiệm vụ khẩn nguy, cứu nạn, thủ trưởng cơ quan, đơn vị chủ quản của người và phương tiện tham gia thực hiện nhiệm vụ khẩn nguy, cứu nạn có trách nhiệm phối hợp với lực lượng kiểm soát an ninh hàng không của đơn vị chủ quản khu vực hạn chế để kiểm soát hoạt động của người và phương tiện mà không cần thẻ, giấy phép kiểm soát an ninh hàng không.","o":[["A","Sai"],["B","Đúng"]],"a":null,"e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":69,"q":"Theo đồng chí: Trong khu vực hạn chế, hành lý ký gửi, hàng hóa, bill gửi phải được bảo đảm nguyên vẹn: Thủ trưởng các cơ quan, đơn vị hoạt động tại cảng hàng không, sân bay chịu trách nhiệm tổ chức thực hiện các biện pháp phòng, chống trộm cắp tài sản trong hành lý ký gửi và hàng hóa, bill gửi thuộc phạm vi trách nhiệm của mình, đơn vị kiểm sát an ninh hàng không giám sát việc thực hiện quy định này của các đơn vị.","o":[["A","Đúng"],["B","Sai"]],"a":null,"e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":70,"q":"Theo đồng chí: Đơn vị kiểm sát an ninh hàng không, các doanh nghiệp phục vụ hàng hóa, phục vụ mặt đất chịu trách nhiệm tổ chức kiểm tra giám sát việc thực hiện quy trình, thủ tục, tiêu chuẩn trong dây chuyền phục vụ hành lý, hàng hóa.","o":[["A","Sai"],["B","Đúng"]],"a":null,"e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":71,"q":"Theo đồng chí: Người khai thác cảng hàng không, sân bay chủ trì, phối hợp với đơn vị kiểm soát an ninh không tại cảng không, sân bay ban hành quy định cụ thể về danh mục người, phương tiện được phép ra, vào cho từng cộng, cửa, lối đi cụ thể; đơn vị kiểm soát an ninh hàng không quy định danh mục đồ vật phải đăng ký hoặc khai báo tại điểm kiểm tra an ninh hàng không khi mang theo người vào trong khu vực hạn chế; đồ vật không được mang theo người vào làm việc tại các khu vực hạn chế;","o":[["A","Đúng"],["B","Sai"]],"a":null,"e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":72,"q":"Theo đồng chí: Các hãng hàng không thông tin, tuyên truyền cho hành khách biết các quy định về vận chuyển đồ vật có giá trị cao trong hành lý ký gửi; các thủ tục khiếu nại, khiếu kiện và đền bù trong trường hợp bị mất mát, thất lạc hành lý trong quá trình vận chuyển. Các biện pháp cụ thể về công tác phòng chống trộm cắp tài sản được quy định cụ thể trong chương trình an ninh hàng không của các doanh nghiệp.","o":[["A","Sai"],["B","Đúng"]],"a":null,"e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":73,"q":"Theo đồng chí: Quy định việc mang vật phẩm nguy hiểm vào khu vực hạn chế. Việc mang, quản lý, sử dụng vật phẩm nguy hiểm trong khu vực hạn chế phải được quy định cụ thể trong chương trình an ninh hàng không của đơn vị kiểm soát an ninh hàng không trên cơ sở danh mục các vật phẩm nguy hiểm cấm hoặc hạn chế mang theo người và hành lý vào khu vực hạn chế, lên tàu bay do cục quản lý xuất nhập cảnh ban hành.","o":[["A","Sai"],["B","Đúng"]],"a":null,"e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":74,"q":"Theo đồng chí: Đơn vị sử dụng vật phẩm nguy hiểm phục vụ cho công việc của các cơ quan, đơn vị trong khu vực hạn chế thuộc nhà ga, sân bay phải đăng ký với đơn vị kiểm soát an ninh hàng không. Lực lượng kiểm soát an ninh hàng không kiểm tra, giám sát việc mang vật phẩm nguy hiểm ra vào khu vực hạn chế.","o":[["A","Đúng"],["B","Sai"]],"a":null,"e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":75,"q":"Theo đồng chí: đơn vị sử dụng vật phẩm nguy hiểm phục vụ cho công việc của các cơ quan, đơn vị trong khu vực hạn chế phải tổ chức quản lý và chịu trách nhiệm về việc quản lý, sử dụng, đảm bảo an ninh, an toàn đối với vật phẩm nguy hiểm.","o":[["A","Đúng"],["B","Sai"]],"a":null,"e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":76,"q":"Điểm kiểm tra an ninh hàng không tại cổng, cửa, lối đi: Phải thiết lập điểm kiểm tra an ninh hàng không tại các vị trí sau:","o":[["A","tại các cổng, cửa, lối đi giữa khu vực hạn chế và khu vực khác;"],["B","tại các cổng, cửa, lối đi từ khu vực hạn chế sử dụng riêng có lối đi vào từ khu vực công cộng sang các khu vực hạn chế khác."],["C","Câu A-B đúng"],["D","Câu A-B Sai"]],"a":null,"e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":77,"q":"Theo đồng chí: Tại điểm kiểm tra an ninh hàng không phải có biển báo chỉ dẫn thích hợp bố trí cán bộ, chiến sĩ, nhân viên, thiết bị an ninh phù hợp để bảo đảm việc kiểm tra an ninh hàng không được duy trì liên tục. Cổng, cửa, hàng rào di động tại điểm kiểm tra an ninh hàng không phải luôn trong trạng thái đóng khóa và chỉ được mở khi người, phương tiện đã được kiểm tra, đủ điều kiện ra, vào.","o":[["A","Đúng"],["B","Sai"]],"a":null,"e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":78,"q":"Theo đồng chí: Giám sát an ninh, tuần tra, canh gác tại khu vực hạn chế.","o":[["A","Đơn vị kiểm soát an ninh hàng không phải tổ chức giám sát liên tục đối với hành khách, người, phương tiện hoạt động trong khu vực hạn chế bằng các biện pháp thích hợp nhằm phát hiện những biểu hiện nghi ngờ, ngăn chặn kịp thời những hành vi vi phạm; Kiểm tra, xử lý hành lý, đồ vật không xác nhận được chủ và thực hiện các biện pháp an ninh hàng không khác."],["B","Đơn vị kiểm soát an ninh phải tổ chức giám sát liên tục đối với hành khách, người, phương tiện hoạt động trong khu vực hạn chế bằng các biện pháp thích hợp."]],"a":null,"e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":79,"q":"Theo đồng chí: Đơn vị kiểm soát an ninh hàng không phải tổ chức tuần tra, canh gác để kịp thời ngăn chặn người, phương tiện, gia súc xâm nhập vào khu vực hạn chế hoặc vi phạm các quy định bảo đảm an ninh, an toàn hàng không; được sử dụng hạ sĩ quan chiến sĩ nghĩa vụ thực hiện nhiệm vụ tuần tra, bảo vệ mục tiêu, cổng, vọng gác tại cảng hàng không, sân bay.","o":[["A","Đúng"],["B","Sai"]],"a":null,"e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":80,"q":"Theo đồng chí: Tại cảng hàng không, sân bay dùng chung giữa dân dụng và quân sự, đơn vị kiểm soát an ninh hàng không thỏa thuận bằng văn bản với đơn vị quân đội đóng quân tại cảng không, sân bay thực hiện tuần tra, canh gác, bảo vệ khu khu vực giáp ranh giữa các khu vực sử dụng cho các hoạt động hàng không dân dụng và khu vực sử dụng cho hoạt động quân sự.","o":[["A","Sai"],["B","Đúng"]],"a":null,"e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":81,"q":"Thẻ kiểm soát an ninh Cảng hàng không là gì?","o":[["A","Tài liệu xác nhận cho phương tiện được phép ra vào và hoạt động trong khu vực hạn chế của Cảng hàng không, sân bay."],["B","Tài liệu xác nhận người được phép vào và hoạt động trong khu vực hạn chế liên quan của Cảng hàng không, sân bay."],["C","Giấy tờ do Cục Quản lý xuất nhập cảnh cấp cho cá nhân đủ điều kiện theo quy định của pháp luật để có thể hành nghề nhân viên kiểm soát an ninh hàng không."],["D","Tài liệu xác nhận người được phép vào và hoạt động trong khu vực hạn chế riêng của đơn vị, doanh nghiệp tại Cảng hàng không, sân bay và nơi có công trình, trang bị, thiết bị hàng không."]],"a":"B","e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":82,"q":"Người đứng đầu đơn vị kiểm soát an ninh tại Cảng hàng không quốc tế Tân Sơn Nhất là?","o":[["A","Giám đốc Trung tâm ANHK Quốc gia."],["B","Trưởng Công an cửa khẩu Cảng HKQT TSN."],["C","Phó Trưởng Công an cửa khẩu Cảng HKQT TSN."],["D","Đội trưởng các đội chức năng."]],"a":"B","e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":83,"q":"Đơn vị nào chịu trách nhiệm thực hiện các biện pháp kiểm soát an ninh, tham gia xử lý các vụ việc vi phạm về an ninh hàng không và đối phó với hành vi can thiệp bất hợp pháp vào hoạt động hàng không dân dụng tại cảng hàng không, sân bay?","o":[["A","Đơn vị kiểm soát ANHK."],["B","Trung tâm ANHK Tân Sơn Nhất."],["C","Trung tâm Điều hành sân bay Tân Sơn Nhất."],["D","Trung tâm Khai thác khu bay Tân Sơn Nhất."]],"a":"A","e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":84,"q":"Cảng hàng không quốc tế Tân Sơn Nhất có bao nhiêu hầm xử lý bom, mìn, vật phẩm nguy hiểm?","o":[["A","02 hầm"],["B","03 hầm"],["C","04 hầm"],["D","05 hầm"]],"a":"A","e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":85,"q":"Sân đỗ tàu bay là gì?","o":[["A","Khu vực được xác định trong khu bay dành cho tàu bay đỗ để đón, trả hành khách."],["B","Khu vực được xác định trong khu bay dành cho tàu bay đỗ để tiếp nhiên liệu."],["C","Khu vực được xác định trong khu bay dành cho tàu bay đỗ để trả hành lý, bưu gửi, hàng hóa."],["D","Khu vực được xác định trong khu bay dành cho tàu bay đỗ để đón, trả hành khách, hành lý, bưu gửi, hàng hóa, tiếp nhiên liệu hoặc bảo dưỡng."]],"a":"D","e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":86,"q":"Đồ vật phục vụ trên tàu bay là gì?","o":[["A","Vật phẩm để hành khách, tổ bay sử dụng, bán trên tàu bay, trừ suất ăn; các vật phẩm phục vụ cho khai thác, bảo dưỡng, sửa chữa tàu bay."],["B","Vật phẩm để tổ bay sử dụng, bán trên tàu bay, kể cả suất ăn."],["C","Vật phẩm sử dụng cho khai thác, bảo dưỡng, sửa chữa tàu bay."],["D","Vật phẩm để hành khách sử dụng, bán trên tàu bay, trừ suất ăn."]],"a":"A","e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":87,"q":"Kiểm tra chất lượng an ninh hàng không là gì?","o":[["A","Kiểm tra sự tuân thủ các quy định trong Chương trình an ninh, Quy chế an ninh hàng không của người khai thác cảng hàng không, sân bay, hãng hàng không, doanh nghiệp cung cấp dịch vụ hàng không đã được Cục Quản lý xuất nhập cảnh  phê duyệt, chấp thuận."],["B","Kiểm tra sự tuân thủ toàn bộ các quy định trong chương trình an ninh hàng không, quy chế an ninh hàng không."],["C","Kiểm tra sự tuân thủ các quy định về xử phạt vi phạm hành chính trong lĩnh vực hàng không dân dụng."]],"a":"A","e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":89,"q":"Quy định về tạm thời thiết lập khu vực hạn chế mới trong trường hợp phải tăng cường đảm bảo an ninh hàng không tại Cảng HKQT Tân Sơn Nhất phải đảm bảo các yêu cầu nào sau đây?","o":[["A","Có biện pháp bảo đảm an ninh hàng không."],["B","Có hàng rào cứng làm ranh giới; có biển, tín hiệu cảnh báo phù hợp."],["C","Có thời hạn; Có biện pháp bảo đảm ANHK phù hợp; Có hàng rào cứng hoặc mềm làm ranh giới; Có biển, tín hiệu cảnh báo phù hợp; Có điểm kiểm tra ANHK và bố trí CBCS, nhân viên kiểm soát ANHK để kiểm tra, giám sát."],["D","Không thời hạn; Có biện pháp bảo đảm an ninh hàng không; Có điểm kiểm tra an ninh hàng không và bố trí nhân viên kiểm soát an ninh hàng không để kiểm tra, giám sát."]],"a":"C","e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":90,"q":"Hành khách gây rối là gì?","o":[["A","Là hành khách cố ý không chấp hành quy định về an toàn hàng không, an ninh hàng không, trật tự công cộng tại cảng hàng không, sân bay."],["B","Là hành khách cố ý không chấp hành quy định về an toàn hàng không, an ninh hàng không trên tàu bay."],["C","là hành khách có hành vi tung tin, cung cấp thông tin sai uy hiếp an toàn hàng không tại cảng hàng không, sân bay, trên tàu."],["D","Là hành khách không chấp hành các quy định về ứng xử tại cảng hàng không hoặc trên tàu bay, không tuân thủ hướng dẫn của lực lượng kiểm soát an ninh hàng không hoặc nhân viên hàng không hoặc tổ bay, từ đó làm ảnh hưởng đến an ninh, trật tự và kỷ luật tại cảng hàng không hoặc trên tàu bay."]],"a":"D","e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":91,"q":"Những hành vi nào sau đây là hành vi can thiệp bất hợp pháp vào hoạt động hàng không dân dụng?","o":[["A","Trộm cắp tài sản của hành khách đi tàu bay."],["B","Bắt giữ con tin trong tàu bay hoặc tại cảng hàng không, sân bay; Đưa vật phẩm nguy hiểm vào tàu bay, cảng hàng không, sân bay và khu vực hạn chế khác trái pháp luật."],["C","Thả diều tại khu vực lân cận Cảng hàng không, sân bay."],["D","Sử dụng giấy tờ không hợp lệ để đi tàu bay."]],"a":"B","e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":92,"q":"Hành lý, đồ vật không xác định được chủ là gì?","o":[["A","Là đồ vật, hành lý không xác nhận được chủ là đồ vật bị bỏ tại cảng hàng không, sân bay mà không có căn cứ xác định được chủ của đồ vật, hành lý đó."],["B","Là hành lý, đồ vật tại sân bay, trên tàu bay nhưng không có căn cứ xác nhận được chủ của hành lý, đồ vật đó."],["C","Là đồ vật, hành lý không xác nhận được chủ là đồ vật bị bỏ tại sân bay."],["D","Là hành lý, đồ vật tại Cảng hàng không, sân bay, công trình hàng không ngoài cảng hàng không, sân bay."]],"a":"A","e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":99,"q":"Người có thẩm quyền lục soát an ninh hàng không gồm những ai?","o":[["A","Người đứng đầu lực lượng kiểm soát an ninh hàng không tại Cảng HKQT Tân Sơn Nhất."],["B","Người đứng đầu lực lượng kiểm soát an ninh hàng không, Người đứng đầu bộ phận kiểm tra, soi chiếu an ninh hàng không tại Cảng HKQT Tân Sơn Nhất theo quy định."],["C","Giám đốc Cảng vụ hàng không."],["D","Người đứng đầu bộ phận kiểm tra, soi chiếu an ninh hàng không tại Cảng HKQT Tân Sơn Nhất theo quy định."]],"a":"B","e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":100,"q":"Phương tiện hoạt động trong khu vực hạn chế phải chấp hành những quy định nào sau đây?","o":[["A","Phải có bạt che phủ, camera hành trình"],["B","Chịu sự kiểm tra, giám sát và tuân theo sự hướng dẫn của cán bộ chiến sỹ làm nhiệm vụ kiểm soát an ninh hàng không"],["C","Phương tiện hoạt động trong khu vực hạn chế phải chạy đúng luồng, tuyến, đúng tốc độ, dừng, đỗ đúng vị trí quy định;"],["D","Chạy đúng luồng, tuyến, đúng tốc độ, dừng, đỗ đúng vị trí quy định; chịu sự kiểm tra, giám sát và tuân theo sự hướng dẫn của CBCS làm nhiệm vụ kiểm soát ANH"]],"a":"D","e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":101,"q":"Tại chốt điểm kiểm tra an ninh vào khu vực hạn chế, Cán bộ CACK phát hiện 01 nhân viên sử dụng thẻ kiểm soát an ninh dài hạn, nhưng ảnh trên thẻ kiểm soát an ninh có nhiều điểm không giống người đang sử dụng thẻ. Là cán bộ trực tại vị trí giải quyết như thế nào?","o":[["A","Cho người đó qua chốt vì thẻ kiểm soát an ninh còn hạn."],["B","Thu hồi thẻ kiểm soát an ninh và lập biên bản ngay mà không cần xác minh."],["C","Dừng việc cho người đó qua chốt kiểm tra, báo cáo Chỉ huy đội và tiến hành kiểm tra, đối chiếu, xác minh."],["D","Yêu cầu người đó rời khỏi khu vực cảng ngay lập tức."]],"a":"C","e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":102,"q":"Tại chốt kiểm tra an ninh vào khu vực hạn chế, Cán bộ CACK phát hiện nhân viên dùng thẻ kiểm soát an ninh ngắn hạn nhưng đến điểm kiểm soát an ninh chỉ có một mình, không có người hộ tống. Là cán bộ trực tại vị trí giải quyết như thế nào?","o":[["A","Cho người sử dụng thẻ ngắn hạn vào khu vực vì thẻ còn hạn sử dụng."],["B","Cho người sử dụng thẻ ngắn hạn vào khu vực sau khi đã kiểm tra giấy tờ tùy thân và thẻ kiểm soát an ninh."],["C","Không cho người sử dụng thẻ ngắn hạn vào khu vực hạn chế, yêu cầu liên hệ người có trách nhiệm hộ tống đáp ứng điều kiện theo quy định mới thực hiện thủ tục kiểm tra, cho vào. Báo cáo chỉ huy đội nếu có tình huống phát sinh."],["D","Thu hồi ngay thẻ kiểm soát và xử phạt người sử dụng tại chốt."]],"a":"C","e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":103,"q":"Khi đang thực hiện nhiệm vụ tuần tra trong khu vực hạn chế, cán bộ CACK phát hiện 01 nhân viên không đeo thẻ KSAN đang đi trong khu vực hạn chế. Là cán bộ trực tại vị trí giải quyết như thế nào?","o":[["A","Nhắc nhở nhân viên đeo thẻ và cho tiếp tục thực hiện nhiệm vụ, không cần kiểm tra thêm vì nhân viên đang mặc đồng phục của đơn vị."],["B","Yêu cầu nhân viên dừng lại, xuất trình kiểm tra thẻ/ giấy phép KSAN và xác minh danh tính, đơn vị, lý do có mặt và quyền được hoạt động tại khu vực hạn chế. Báo cáo chỉ huy, nếu xác định xâm nhập trái phép thì xử lý theo quy định."],["C","Cho nhân viên tiếp tục di chuyển, sau đó báo cáo chỉ huy đổi để xử lý."],["D","Lập biên bản ngay về hành vi vi phạm và thu giữ thẻ KSAN của nhân viên mà không cần xác minh."]],"a":"B","e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":104,"q":"Khi đang thực hiện nhiệm vụ tuần tra khu vực đảo thủ tục hàng không, Cán bộ CACK phát hiện 01 balo không xác định được chủ. Là cán bộ trực tại vị trí, đồng chí xử lý như thế nào ?","o":[["A","Tự ý mở ba lo để kiểm tra, nếu không phát hiện vật phẩm nguy hiểm thì tiếp tục thực hiện nhiệm vụ."],["B","Không di chuyển hoặc tự ý mở ba lô. Nhanh chóng bảo vệ, kiểm soát khu vực xung quanh nhằm tìm kiếm chủ sở hữu. Báo cáo chỉ huy và phối hợp lực lượng chức năng xử lý theo tính chất vụ việc."],["C","Đưa ba lô về phòng trực để bảo quản, sau đó thông báo cho chỉ huy đội."],["D","Để nguyên ba lô tại vị trí và tiếp tục tuần tra, chờ người sở hữu quay lại nhận."]],"a":"B","e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"},{"n":105,"q":"Tại điểm kiểm tra, kiểm soát nội bộ, cán bộ CACK trực tại vị trí phát hiện đơn vị thi công sau khi kết thúc nhiệm vụ số lượng dụng cụ mang ra ít hơn số lượng dụng cụ đã đăng ký mang vào. Là cán bộ trực, đồng chí xử lý như thế nào?","o":[["A","Cho đơn vị thi công mang số dụng cụ hiện có ra khỏi khu vực và yêu cầu bổ sung báo cáo sau vì công việc đã hoàn thành."],["B","Yêu cầu đơn vị thi công dừng việc đưa người, dụng cụ ra khỏi khu vực; kiểm tra, đối chiếu số lượng dụng cụ mang vào và mang ra. Xác định nguyên nhân thiếu, báo cáo chỉ huy và xử lý theo quy định trước khi cho phép đưa người, dụng cụ ra khỏi khu vực."],["C","Cho phép mang dụng cụ ra khỏi khu vực nếu người phụ trách đơn vị thi công cam kết sẽ tìm và bổ sung số dụng cụ còn thiếu."],["D","Tự ý giữ toàn bộ dụng cụ của đơn vị thi công và cho người của đơn vị rời khỏi khu vực, không cần báo cáo chỉ huy."]],"a":"B","e":"","g":"Phần tiếp theo: Câu hỏi bổ sung Thông tư & Quy định ANHK"}]},{"id":"ansc","name":"ANSC – An ninh soi chiếu","open":false,"qs":[{"n":1,"q":"Tên tiếng Anh của thiết bị phát hiện kim loại cầm tay là gì?","o":[["A","Handheld Metal Detector."],["B","Walkthrough Metal Detector."],["C","Body scanner."],["D","Cả a, b và c đều đúng."]],"a":"A","e":"","g":""},{"n":2,"q":"Tên tiếng Anh của cổng từ là gì?","o":[["A","Handheld Metal Detector."],["B","Walkthrough Metal Detector."],["C","Body scanner."],["D","Cả a, b và c đều sai."]],"a":"B","e":"","g":""},{"n":3,"q":"Mục đích chính của hàng rào chống biểu tình là gì?","o":[["A","Dùng để cản trở, làm chậm đám đông trong tình huống biểu tình, bạo loạn."],["B","Ngăn cản gia súc xâm nhập vào mục tiêu cần bảo vệ."]],"a":"A","e":"","g":""},{"n":4,"q":"Mục đích chính của hệ thống chống đâm va là gì?","o":[["A","Dùng để cản trở, làm chậm đám đông trong tình huống biểu tình, bạo loạn."],["B","Ngăn cản phương tiện lao vào mục tiêu cần bảo vệ."]],"a":"B","e":"","g":""},{"n":5,"q":"Công dụng của thiết bị phá sóng trong công tác bảo đảm an ninh hàng không?","o":[["A","Dùng để gây nhiễu các loại sóng vô tuyến trong một phạm vi xác định, giúp lực lượng kiểm soát ANHK vô hiệu hóa phương thức kích nổ từ xa bằng sóng vô tuyến."],["B","Dùng để thu các loại sóng vô tuyến trong một phạm vi xác định, giúp lực lượng kiểm soát ANHK vô hiệu hóa phương thức kích nổ từ xa bằng sóng vô tuyến."],["C","Dùng để phát các loại sóng vô tuyến trong một phạm vi xác định, giúp lực lượng kiểm soát ANHK vô hiệu hóa phương thức kích nổ từ xa bằng sóng vô tuyến."],["D","Tất cả đều đúng."]],"a":"A","e":"","g":""},{"n":6,"q":"Công dụng của gương soi gầm phương tiện?","o":[["A","Chỉ dùng để quan sát gầm phương tiện."],["B","Chỉ dùng để quan sát nóc phương tiện."],["C","Chỉ dùng để quan sát trần phương tiện."],["D","Dùng để quan sát các khu vực không thể quan sát trực tiếp được của phương tiện."]],"a":"D","e":"","g":""},{"n":7,"q":"Hệ thống bộ đàm chung kênh (Trunking) có ưu điểm nào sau đây:","o":[["A","Cung cấp 2 kênh liên lạc hoạt động cùng lúc chia cho 5 nhóm sử dụng; Có thể thực hiện 2 cuộc gọi cùng lúc."],["B","Có thể gọi được tất cả các máy con trong hệ thống; Có thể gọi được các máy trong 1 nhóm liên lạc; Có thể gọi được với từng máy con."],["C","Trung tâm điều hành có thể khóa tạm thời, khóa hoàn toàn các máy bộ đàm con trong hệ thống hoặc mở khóa lại khi có nhu cầu."],["D","Tất cả đều đúng."]],"a":"D","e":"","g":""},{"n":8,"q":"Công dụng của khiên/lá chắn?","o":[["A","Dùng để che mưa, che nắng."],["B","Dùng để bảo vệ cho người sử dụng chống lại sự tấn công bằng gạch đá, hóa chất, chất lỏng, lưỡi lê, dao găm..."]],"a":"B","e":"","g":""},{"n":9,"q":"Trong các loại súng dưới đây, loại nào thuộc nhóm công cụ hỗ trợ:","o":[["A","Súng ngắn K54; Súng ngắn K59; Súng ngắn CZ83."],["B","Súng bắn đạn hơi cay, cao su DKR - 113; Súng bắn đạn hơi cay, cao su RG9."]],"a":"B","e":"","g":""},{"n":10,"q":"Loại máy soi nào dưới đây có chức năng truyền tín hiệu không dây (wifi):","o":[["A","Máy soi HLXT 02 đầu phát Hi-scan 6040-2is."],["B","Máy soi Container Rapiscan A25."],["C","Máy soi di động Rapiscan Mini Z."],["D","Máy soi CT cắt lớp Hi-scan 6040 CTIX."]],"a":"C","e":"","g":""},{"n":11,"q":"Loại camera nào thường được sử dụng trong trường hợp người sử dụng không muốn người khác biết đang bị giám sát?","o":[["A","Camera Dome."],["B","Camera Thân."],["C","Camera ngụy trang."],["D","Camera Zoom."]],"a":"C","e":"","g":""},{"n":12,"q":"Nên lắp đặt loại camera nào để giám sát nơi ánh sáng yếu hoặc không có ánh sáng?","o":[["A","Camera thường."],["B","Camera hồng ngoại."]],"a":"B","e":"","g":""},{"n":13,"q":"Hệ thống camera giám sát an ninh có tác dụng nào sau đây:","o":[["A","Hỗ ACE."],["C","ITERMISER 5X; IONSCAN 500DT; IONSCAN 600."],["D","Cả a và b đúng."],["E","Cả a, b và c đều đúng."]],"a":"C","e":"","g":""},{"n":20,"q":"Thiết bị phát hiện kim loại cầm tay có khả năng gì?","o":[["A","Phát hiện các vật bằng kim loại cất giấu trong người."],["B","Phát hiện các vật phi kim loại cất giấu trong người."],["C","Phát hiện các vật kim loại hoặc phi kim loại cất giấu trong người."],["D","Tất cả đều đúng."]],"a":"A","e":"","g":""},{"n":21,"q":"Trường hợp phát hiện vật kim loại, cổng từ phát tín hiệu cảnh báo dưới hình thức nào?","o":[["A","Âm thanh."],["B","Đèn báo."],["C","Rung."],["D","Cả a và b đều đúng."],["E","Cả a, b và c đều đúng."]],"a":"D","e":"","g":""},{"n":22,"q":"Trường hợp phát hiện vật kim loại, thiết bị phát hiện kim loại cầm tay phát tín hiệu cảnh báo dưới hình thức nào?","o":[["A","Âm thanh."],["B","Đèn báo."],["C","Rung."],["D","Cả a và b đều đúng."],["E","Cả a, b và c đều đúng."]],"a":"E","e":"","g":""},{"n":23,"q":"Cổng từ là một thiết bị ANHK có độ tin cậy cao và có khả năng phát hiện được tất cả các loại vật phẩm nguy hiểm.","o":[["A","Đúng."],["B","Sai."]],"a":"B","e":"","g":""},{"n":24,"q":"Dựa trên công nghệ, thiết bị soi chiếu cơ thể được chia thành bao nhiêu loại?","o":[["A","02 loại."],["B","03 loại."],["C","04 loại."],["D","Tất cả đều sai."]],"a":"A","e":"","g":""},{"n":25,"q":"Thiết bị soi chiếu cơ thể hoạt động dựa trên công nghệ nào dưới đây:","o":[["A","Công nghệ sử dụng tia X."],["B","Công nghệ sử dụng sóng cao tần RF."],["C","Cả a và b đều đúng."],["D","Cả a và b đều sai."],["E","Cả a, b và c đều sai."]],"a":"C","e":"","g":""},{"n":26,"q":"Thiết bị nào dưới đây có khả năng phát hiện cả vật nguy hiểm bằng kim loại và phi kim:","o":[["A","Cổng từ."],["B","Thiết bị phát hiện kim loại cầm tay."],["C","Thiết bị soi chiếu cơ thể."],["D","Tất cả đều đúng."]],"a":"C","e":"","g":""},{"n":27,"q":"Máy soi Container Rapiscan A25 thuộc nhóm máy soi tia X nào?","o":[["A","Máy soi tia X cố định."],["B","Máy soi tia X di động."
