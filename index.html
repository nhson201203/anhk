chế khác của ga đi quốc tế."],["C","Khu vực sân đỗ tàu bay, đường hạ cất cánh, đường lăn và các khu vực khác trong sân bay."],["D","Khu vực hạn chế ga đến nội địa, quốc tế."]],"a":"D","e":"","g":"B Bình thuốc ký hiệu P."},{"n":67,"q":"Thời hạn hiệu lực của thẻ, giấy phép kiểm soát an ninh cảng hàng không, sân bay loại có giá trị sử dụng dài hạn?","o":[["A","Tối đa không quá 02 năm kể từ ngày cấp."],["B","Tối đa không quá 03 năm kể từ ngày cấp."],["C","Tối đa không quá 04 năm kể từ ngày cấp."],["D","Không thời hạn."]],"a":"A","e":"","g":"B Bình thuốc ký hiệu P."},{"n":68,"q":"Thời hạn hiệu lực của thẻ, giấy phép kiểm soát an ninh cảng hàng không, sân bay loại có giá trị sử dụng ngắn hạn?","o":[["A","Tối đa không quá 10 ngày kể từ thời điểm có hiệu lực."],["B","Tối đa không quá 30 ngày kể từ thời điểm có hiệu lực."],["C","Tối đa không quá 45 ngày kể từ thời điểm có hiệu lực."],["D","Tối đa không quá 60 ngày kể từ thời điểm có hiệu lực."]],"a":"B","e":"","g":"B Bình thuốc ký hiệu P."}]},{"id":"sandau","name":"Sân đậu tàu bay","open":false,"qs":[{"n":1,"q":"Theo nội dung đã cung cấp, sân đỗ tàu bay là:","o":[["A","Khu vực dành riêng cho hành khách chờ lên tàu bay."],["B","Khu vực trong khu bay dành cho tàu bay đỗ để đón, trả hành khách, hành lý, bưu gửi, hàng hóa, tiếp nhiên liệu, cung cấp suất ăn hoặc bảo dưỡng."],["C","Khu vực chỉ dành cho phương tiện phục vụ mặt đất."],["D","Khu vực dành riêng cho tàu bay thực hiện cất, hạ cánh."]],"a":"B","e":"","g":""},{"n":2,"q":"Phương tiện hoạt động trong khu vực hạn chế phải chấp hành yêu cầu nào?","o":[["A","Có thể chạy tùy ý nếu không có tàu bay hoạt động."],["B","Chỉ cần chạy đúng tốc độ."],["C","Chạy đúng luồng, tuyến, tốc độ; dừng, đỗ đúng vị trí và tuân theo sự kiểm tra, giám sát, hướng dẫn của cán bộ, chiến sĩ đang làm nhiệm vụ."],["D","Chỉ cần có người điều khiển có thẻ kiểm soát an ninh."]],"a":"C","e":"","g":""},{"n":3,"q":"Theo nội dung đào tạo, niêm phong an ninh là:","o":[["A","Việc đánh dấu phương tiện bằng sơn nhận diện."],["B","Việc xác nhận hàng hóa, đồ vật, phương tiện đã qua kiểm tra an ninh hoặc xác nhận tình trạng nguyên vẹn bằng tem niêm phong, dây niêm phong."],["C","Việc khóa cửa tàu bay sau khi phục vụ."],["D","Việc lập biên bản bàn giao phương tiện."]],"a":"B","e":"","g":""},{"n":4,"q":"Một trong những thông tin cơ bản trên thẻ kiểm soát an ninh cảng hàng không, sân bay có giá trị sử dụng dài hạn là:","o":[["A","Số điện thoại cá nhân của người được cấp thẻ."],["B","Mức lương của người được cấp thẻ."],["C","Khu vực hạn chế được phép vào và hoạt động."],["D","Số tài khoản ngân hàng của người được cấp thẻ."]],"a":"C","e":"","g":""},{"n":5,"q":"Trường hợp nào sau đây làm thẻ, giấy phép kiểm soát an ninh hàng không mất giá trị sử dụng?","o":[["A","Người được cấp thẻ thay đổi vị trí làm việc nhưng vẫn đáp ứng điều kiện cấp thẻ."],["B","Thẻ bị hỏng hoặc nội dung trên thẻ bị mờ."],["C","Người được cấp thẻ được phân công làm việc tại vị trí khác trong cùng khu vực."],["D","Thẻ còn nguyên vẹn và còn dấu hiệu bảo mật."]],"a":"B","e":"","g":""},{"n":6,"q":"Cán bộ, chiến sĩ bộ phận sân đỗ phải có mặt tại đơn vị 15 phút trước giờ giao ca nhằm mục đích nào sau đây?","o":[["A","Chỉ để điểm danh quân số."],["B","Chỉ để nhận phương tiện."],["C","Kiểm tra đồng phục, tác phong; phổ biến nhiệm vụ; giao nhận bộ đàm và kiểm tra trang thiết bị trước khi thực hiện nhiệm vụ."],["D","Để nghỉ ngơi trước khi nhận ca."]],"a":"C","e":"","g":""},{"n":7,"q":"Theo quy trình xử lý ban đầu khi phát hiện vụ việc bất thường trong sân đỗ tàu bay, thứ tự đúng là:","o":[["A","Khống chế đối tượng → báo cáo → đánh giá tình hình."],["B","Báo cáo → rời khỏi hiện trường → đánh giá tình hình."],["C","Đánh giá sơ bộ tình hình → báo cáo trực điều hành hoặc Chỉ huy Đội → áp dụng một số biện pháp tại chỗ."],["D","Lập biên bản → báo cáo → đánh giá tình hình."]],"a":"C","e":"","g":""},{"n":8,"q":"Tàu bay đang khai thác là tàu bay đang đỗ tại sân đỗ để chuẩn bị thực hiện hoạt động bay và:","o":[["A","Không cần giám sát nếu đã đóng cửa tàu bay."],["B","Có sự giám sát an ninh hàng không liên tục bằng biện pháp thích hợp nhằm phát hiện việc tiếp cận, xâm nhập trái phép."],["C","Chỉ được giám sát khi có hành khách trên tàu bay."],["D","Chỉ được giám sát trong thời gian ban ngày."]],"a":"B","e":"","g":""},{"n":9,"q":"Khi thực hiện nhiệm vụ bảo vệ tàu bay không khai thác, đỗ qua đêm, yêu cầu nào sau đây là đúng?","o":[["A","Có thể để nguyên xe thang, xe băng chuyền cạnh tàu bay qua đêm."],["B","Không cần chiếu sáng tàu bay."],["C","Tàu bay phải được chiếu sáng và giám sát liên tục; các phương tiện phục vụ mặt đất phải được di dời khỏi tàu bay."],["D","Chỉ cần kiểm tra tàu bay một lần trước khi kết thúc ca."]],"a":"C","e":"","g":""},{"n":10,"q":"Đối với tàu bay chuyên cơ, chuyên khoang ĐẾN, cán bộ, chiến sĩ phục vụ phải có mặt tại điểm đậu trước khi tàu bay đến:","o":[["A","15 phút."],["B","30 phút."],["C","60 phút."],["D","120 phút."]],"a":"C","e":"","g":""},{"n":11,"q":"Đối với tàu bay chuyên cơ, chuyên khoang ĐI, cán bộ, chiến sĩ phục vụ phải có mặt tại điểm đậu trước khi tàu bay đi:","o":[["A","30 phút."],["B","60 phút."],["C","90 phút."],["D","120 phút."]],"a":"D","e":"","g":""},{"n":12,"q":"Khoảng cách an toàn phía trước và phía sau tàu bay đang lăn theo nội dung đào tạo là:","o":[["A","Phía trước 100 m, phía sau 50 m."],["B","Phía trước 150 m, phía sau 100 m."],["C","Phía trước 200 m, phía sau 125 m."],["D","Phía trước 250 m, phía sau 150 m."]],"a":"C","e":"","g":""},{"n":13,"q":"Phương tiện, thiết bị hàng không bị cấm chạy cắt ngang qua khoảng cách giữa:","o":[["A","Tàu bay lăn và nhân viên đánh tín hiệu mặt đất."],["B","Tàu bay lăn và hệ thống VDGS."],["C","Tàu bay lăn và xe dẫn tàu bay."],["D","Cả A, B và C đều đúng."]],"a":"D","e":"","g":""},{"n":14,"q":"Khi phát hiện FOD (Foreign Object Debris/Damage) trên sân đỗ và có khả năng thu gom, xử lý phù hợp là:","o":[["A","Để nguyên tại vị trí phát hiện để đơn vị khác xử lý."],["B","Thu gom và để đúng nơi quy định, như thùng FOD."],["C","Đẩy FOD ra khu vực mép sân đỗ."],["D","Đưa FOD lên tàu bay để tránh gây cản trở."]],"a":"B","e":"","g":""},{"n":15,"q":"Trong tình huống phát hiện một đối tượng xâm nhập trái phép vào khu vực tàu bay đỗ, hành động nào phù hợp với quy trình đã cung cấp?","o":[["A","Bỏ vị trí để tự mình đuổi theo đối tượng."],["B","Chỉ ghi nhớ đặc điểm đối tượng, không cần báo cáo."],["C","Ghi nhớ đặc điểm, hành vi; báo cáo cán bộ trực điều hành; thông báo lực lượng gần đó hỗ trợ và áp dụng biện pháp ngăn chặn phù hợp."],["D","Chờ đến cuối ca mới ghi vào sổ nhật ký."]],"a":"C","e":"","g":""},{"n":16,"q":"Mục đích của việc tuần tra, giám sát vị trí được phân công tại sân đỗ là gì?","o":[["A","Chỉ để kiểm tra tình trạng phương tiện phục vụ mặt đất."],["B","Phát hiện bất thường, ngăn chặn người, phương tiện vi phạm và kiểm soát người, phương tiện ra vào, hoạt động tại khu vực sân đỗ."],["C","Chỉ để hướng dẫn hành khách lên tàu bay."],["D","Chỉ để kiểm tra FOD."]],"a":"B","e":"","g":"PHẦN II. TÌNH HUỐNG THỰC TẾ (Câu 16 – Câu 30)"},{"n":17,"q":"Khi thực hiện kiểm tra ngẫu nhiên, trường hợp nào có thể tiến hành kiểm tra người, phương tiện, đồ vật?","o":[["A","Chỉ khi người được kiểm tra tự nguyện yêu cầu."],["B","Khi có biểu hiện nghi ngờ hoặc trong trường hợp cần thiết khác theo quy định, chỉ đạo."],["C","Chỉ khi tàu bay đã cất cánh."],["D","Chỉ đối với nhân viên hàng không."]],"a":"B","e":"","g":"PHẦN II. TÌNH HUỐNG THỰC TẾ (Câu 16 – Câu 30)"},{"n":18,"q":"Một người được cấp thẻ kiểm soát an ninh hàng không ngắn hạn vào khu vực hạn chế thì:","o":[["A","Được tự do hoạt động một mình."],["B","Phải được hộ tống."],["C","Không cần mang thẻ."],["D","Chỉ cần xuất trình giấy tờ tùy thân."]],"a":"B","e":"","g":"PHẦN II. TÌNH HUỐNG THỰC TẾ (Câu 16 – Câu 30)"},{"n":19,"q":"Người hộ tống người được cấp thẻ ngắn hạn vào khu vực hạn chế phải:","o":[["A","Chỉ đưa người đó qua cổng rồi quay về."],["B","Đăng ký với ca trực kiểm soát an ninh, đi cùng và thường xuyên quan sát người được hộ tống."],["C","Chỉ chịu trách nhiệm khi người được hộ tống vi phạm."],["D","Không cần thông báo cho ca trực."]],"a":"B","e":"","g":"PHẦN II. TÌNH HUỐNG THỰC TẾ (Câu 16 – Câu 30)"},{"n":20,"q":"Khi phát hiện FOD ngoài khả năng thu gom, cần:","o":[["A","Tự ý di chuyển FOD ra khỏi sân đỗ."],["B","Bỏ qua nếu FOD không nằm trên đường lăn."],["C","Báo Trực ban trưởng sân bay."],["D","Đưa FOD vào trong tàu bay."]],"a":"C","e":"","g":"PHẦN II. TÌNH HUỐNG THỰC TẾ (Câu 16 – Câu 30)"},{"n":21,"q":"Trong khu vực giới hạn an toàn vị trí đỗ, phương tiện, trang thiết bị:","o":[["A","Được phép chạy chui dưới thân tàu bay nếu người điều khiển có thẻ."],["B","Không được chạy chui qua thân, cánh, động cơ tàu bay, trừ một số phương tiện có chức năng phục vụ phải di chuyển một phần phía dưới tàu bay theo quy định."],["C","Được phép dừng dưới cánh tàu bay bất cứ lúc nào."],["D","Chỉ cần bật đèn cảnh báo là được phép di chuyển."]],"a":"B","e":"","g":"PHẦN II. TÌNH HUỐNG THỰC TẾ (Câu 16 – Câu 30)"},{"n":22,"q":"Khi tàu bay đang lăn vào vị trí đỗ, người, phương tiện, thiết bị:","o":[["A","Được phép di chuyển trong khu vực an toàn nếu đi chậm."],["B","Được phép dừng dưới cánh tàu bay."],["C","Không được di chuyển, dừng, đỗ bên trong khu vực an toàn cho tàu bay."],["D","Được phép chạy cắt ngang trước tàu bay."]],"a":"C","e":"","g":"PHẦN II. TÌNH HUỐNG THỰC TẾ (Câu 16 – Câu 30)"},{"n":23,"q":"Theo nội dung đã cung cấp, khi tàu bay đang lăn, không được chạy cắt ngang giữa tàu bay và:","o":[["A","Nhân viên đánh tín hiệu mặt đất."],["B","Hệ thống dẫn đỗ tự động VDGS."],["C","Xe dẫn tàu bay."],["D","Tất cả các đáp án trên."]],"a":"D","e":"","g":"PHẦN II. TÌNH HUỐNG THỰC TẾ (Câu 16 – Câu 30)"},{"n":24,"q":"Khi thực hiện nhiệm vụ bảo vệ tàu bay chuyên cơ, chuyên khoang ĐẾN, việc kiểm tra an ninh thành phần phục vụ được thực hiện:","o":[["A","Kiểm tra ngẫu nhiên 10%."],["B","Kiểm tra 50%."],["C","Kiểm tra 100%."],["D","Không cần kiểm tra nếu đã có thẻ kiểm soát an ninh."]],"a":"C","e":"","g":"PHẦN II. TÌNH HUỐNG THỰC TẾ (Câu 16 – Câu 30)"},{"n":25,"q":"Ngoài thẻ kiểm soát an ninh, thành phần phục vụ tàu bay chuyên cơ, chuyên khoang phải có:","o":[["A","Thẻ nhân viên hàng không thông thường."],["B","Thẻ phục vụ chuyên cơ, chuyên khoang."],["C","Vé máy bay."],["D","Giấy phép lái xe."]],"a":"B","e":"","g":"PHẦN II. TÌNH HUỐNG THỰC TẾ (Câu 16 – Câu 30)"},{"n":26,"q":"Đối với tàu bay chuyên cơ, chuyên khoang ĐI, cán bộ, chiến sĩ canh gác cầu thang phải đặc biệt kiểm tra:","o":[["A","Chỉ hành khách."],["B","Người, vật tư, dụng cụ, khí tài lên xuống tàu bay."],["C","Chỉ tổ lái."],["D","Chỉ xe cung ứng suất ăn."]],"a":"B","e":"","g":"PHẦN II. TÌNH HUỐNG THỰC TẾ (Câu 16 – Câu 30)"},{"n":27,"q":"Sau khi hành khách lên tàu bay chuyên cơ, chuyên khoang ĐI xong, yêu cầu đối với các phương tiện phục vụ là:","o":[["A","Tất cả tiếp tục đỗ quanh tàu bay."],["B","Tất cả phương tiện phải rút hết khỏi tàu bay, chỉ để lại xe thang phục vụ chuyên cơ, chuyên khoang theo quy định."],["C","Chỉ xe cung ứng suất ăn được ở lại."],["D","Chỉ xe băng chuyền được ở lại."]],"a":"B","e":"","g":"PHẦN II. TÌNH HUỐNG THỰC TẾ (Câu 16 – Câu 30)"},{"n":28,"q":"Khi bảo vệ tàu bay chuyên cơ, chuyên khoang không khai thác, đỗ qua đêm, trước khi ký nhận bàn giao, cán bộ, chiến sĩ phải:","o":[["A","Chỉ kiểm tra giấy tờ của thợ máy."],["B","Kiểm tra tình trạng bên ngoài của tàu bay."],["C","Chỉ kiểm tra khu vực cabin."],["D","Chỉ kiểm tra khu vực hầm hàng."]],"a":"B","e":"","g":"PHẦN II. TÌNH HUỐNG THỰC TẾ (Câu 16 – Câu 30)"},{"n":29,"q":"Khi tàu bay chuyên cơ, chuyên khoang không khai thác đỗ qua đêm, biện pháp bảo vệ được yêu cầu là:","o":[["A","Chỉ bố trí camera giám sát."],["B","Triển khai hàng rào mềm xung quanh tàu bay và tổ chức giám sát liên tục."],["C","Chỉ khóa cửa tàu bay."],["D","Không cần bố trí lực lượng nếu tàu bay đã tắt máy."]],"a":"B","e":"","g":"PHẦN II. TÌNH HUỐNG THỰC TẾ (Câu 16 – Câu 30)"},{"n":30,"q":"Trong tình huống phát hiện dấu hiệu nghi vấn có đối tượng xuất cảnh trái phép đang trên tàu bay, cán bộ, chiến sĩ phải:","o":[["A","Tự ý kiểm tra tàu bay ngay."],["B","Bỏ qua nếu tàu bay chuẩn bị cất cánh."],["C","Bằng cách nhanh nhất báo cáo Chỉ huy Đội để xin ý kiến lãnh đạo Công an cửa khẩu trực ca công tác và thực hiện theo chỉ đạo, quy định."],["D","Chỉ báo cho hãng hàng không."]],"a":"C","e":"","g":"PHẦN II. TÌNH HUỐNG THỰC TẾ (Câu 16 – Câu 30)"}]},{"id":"xnc","name":"Kiến thức XNC (xuất nhập cảnh)","open":false,"qs":[{"n":1,"q":"Khi lượng khách tăng cao, cách hiểu nào đúng về nguyên tắc kết hợp bảo đảm an ninh với tạo thuận lợi hàng không?","o":[["A","Có thể bỏ bước kiểm tra đã được hãng hàng không thực hiện."],["B","Ưu tiên giải phóng hành khách; những nội dung chưa kiểm tra sẽ bổ sung sau."],["C","Giảm thiểu thủ tục nhưng vẫn phải bảo đảm kiểm soát an ninh, xuất nhập cảnh chặt chẽ, đúng quy định."],["D","Chỉ thực hiện đầy đủ quy trình đối với hành khách có dấu hiệu nghi vấn."]],"a":"C","e":"Tạo thuận lợi không đồng nghĩa với bỏ bước kiểm soát bắt buộc. Căn cứ: khoản 6 Điều 2 Quy trình 14764.","g":""},{"n":2,"q":"Việc phân công cán bộ, chiến sĩ vào các vị trí công tác trong ca phải được thực hiện như thế nào?","o":[["A","Chỉ huy Đội phân công và báo cáo lãnh đạo Công an cửa khẩu trực ca trước khi triển khai ca công tác."],["B","Cán bộ tự thống nhất vị trí, cuối ca báo cáo Chỉ huy Đội."],["C","Chỉ huy Đội phân công, chỉ báo cáo lãnh đạo khi xảy ra vụ việc."],["D","Cán bộ ca trước trực tiếp quyết định người thay thế mình."]],"a":"A","e":"Điểm dễ nhầm là thời điểm báo cáo: trước khi triển khai ca, không phải chờ kết thúc ca. Căn cứ: khoản 2 Điều 4.","g":""},{"n":3,"q":"Chỉ huy Đội gặp vụ việc vượt quá thẩm quyền giải quyết của mình. Phương án đúng là gì?","o":[["A","Tự quyết định để tránh chậm chuyến, sau đó báo cáo."],["B","Chuyển toàn bộ trách nhiệm quyết định cho hãng hàng không."],["C","Chờ hết ca để bàn giao Chỉ huy Đội ca sau."],["D","Báo cáo kịp thời lãnh đạo Công an cửa khẩu trực ca công tác để xin ý kiến chỉ đạo."]],"a":"D","e":"Không được lấy yêu cầu giải phóng khách làm căn cứ tự mở rộng thẩm quyền. Căn cứ: khoản 5 Điều 4.","g":""},{"n":4,"q":"Phạm vi trách nhiệm của Chỉ huy Đội trực ca được hiểu đúng như thế nào?","o":[["A","Chỉ chịu trách nhiệm tại các bục kiểm soát xuất nhập cảnh."],["B","Đôn đốc, kiểm tra nhiệm vụ tại các vị trí được phân công; tổ chức, quản lý cán bộ trong ca và thực hiện xử lý theo thẩm quyền."],["C","Chỉ chịu trách nhiệm đối với vụ việc đã được cán bộ báo cáo bằng văn bản."],["D","Không chịu trách nhiệm về tổ chức thực hiện tại vị trí do cán bộ có kinh nghiệm đảm nhiệm."]],"a":"B","e":"Trách nhiệm chỉ huy không chỉ giới hạn ở việc trực tiếp xử lý hồ sơ hoặc ở bục kiểm soát. Căn cứ: khoản 5 Điều 4.","g":""},{"n":5,"q":"Khi nhận phương tiện, thiết bị phục vụ công tác, cán bộ thấy số lượng đủ nhưng chưa kiểm tra tình trạng hoạt động. Có thể ký nhận ngay không?","o":[["A","Có, vì số lượng là nội dung bắt buộc duy nhất."],["B","Có, nếu người bàn giao xác nhận thiết bị hoạt động tốt."],["C","Không; phải kiểm tra số lượng, tình trạng hoạt động, đối chiếu nhật ký ca trước và xác nhận vào sổ nhật ký."],["D","Có, nếu thiết bị chưa đến kỳ bảo dưỡng."]],"a":"C","e":"Đủ số lượng không thay thế việc kiểm tra tình trạng và đối chiếu bàn giao. Căn cứ: khoản 2 Điều 5.","g":""},{"n":6,"q":"Trong khâu chuẩn bị ca, cán bộ phát hiện nhiệm vụ được giao có điểm chưa rõ hoặc dấu hiệu khác thường, trái quy định. Cách xử lý đúng là gì?","o":[["A","Tự điều chỉnh nhiệm vụ theo kinh nghiệm."],["B","Thực hiện trước, ghi nhật ký sau."],["C","Trao đổi với hãng hàng không để thống nhất cách làm."],["D","Báo cáo ngay Chỉ huy Đội để báo cáo lãnh đạo Công an cửa khẩu trực ca quyết định."]],"a":"D","e":"Quy trình xác định rõ tuyến báo cáo, không cho phép cán bộ tự hợp thức hóa nội dung chưa rõ. Căn cứ: khoản 3 Điều 5.","g":""},{"n":7,"q":"Một hành khách cao tuổi đề nghị được ưu tiên tại khu vực trước bục kiểm soát. Cán bộ cần làm gì?","o":[["A","Chủ động hướng dẫn, sắp xếp ưu tiên xếp hàng phù hợp, nhưng không mặc nhiên miễn các bước kiểm soát."],["B","Cho đi thẳng qua bục kiểm soát nếu có người thân bảo lãnh."],["C","Chỉ ưu tiên khi có công văn đề nghị của hãng hàng không."],["D","Hướng dẫn sang lối đi nội bộ để tránh xếp hàng."]],"a":"A","e":"Ưu tiên trong điều tiết, phục vụ không phải là miễn thủ tục xuất nhập cảnh. Căn cứ: điểm a khoản 2 Điều 17.","g":""},{"n":8,"q":"Hành khách không hoàn thành thủ tục tại cửa kiểm soát xuất nhập cảnh tự động. Hướng xử lý đúng là gì?","o":[["A","Cho thử lại đến khi cửa mở, không cần chuyển làn."],["B","Yêu cầu chuyển sang luồng làm thủ tục kiểm soát xuất nhập cảnh thủ công."],["C","Cho qua nếu hãng hàng không xác nhận đủ điều kiện vận chuyển."],["D","Mặc nhiên lập biên bản không cho xuất cảnh hoặc chưa cho nhập cảnh."]],"a":"B","e":"Không hoàn thành tại cửa tự động chưa đồng nghĩa với không đủ điều kiện xuất nhập cảnh. Căn cứ: điểm c khoản 2 Điều 17.","g":""},{"n":9,"q":"Camera tại cửa kiểm soát xuất nhập cảnh tự động báo “hình không khớp dữ liệu”. Nhiệm vụ được Quy trình quy định trực tiếp là gì?","o":[["A","Chấp nhận kết quả nếu hộ chiếu còn hạn."],["B","Chỉ yêu cầu khách tháo kính rồi cho qua."],["C","Tự kết luận hành khách sử dụng hộ chiếu giả."],["D","Nhận diện hành khách qua camera và xử lý vấn đề phát sinh theo nhiệm vụ giám sát."]],"a":"D","e":"Cảnh báo là căn cứ phải kiểm tra, xử lý; không phải căn cứ tự động cho qua hoặc tự động kết luận vi phạm. Căn cứ: khoản 2 Điều 18.","g":"KIỂM SOÁT TẠI BỤC, NHẬN DẠNG VÀ XỬ LÝ DỮ LIỆU"},{"n":10,"q":"Cán bộ được giao giám sát màn hình tại cửa kiểm soát xuất nhập cảnh tự động chỉ theo dõi hình ảnh trên máy tính, không quan sát trực quan hoạt động qua cửa. Cách làm này có đúng không?","o":[["A","Không; phạm vi nhiệm vụ bao gồm giám sát màn hình và giám sát trực quan hoạt động xuất nhập cảnh qua cửa tự động."],["B","Đúng, vì quan sát trực quan thuộc hoàn toàn trách nhiệm hãng hàng không."],["C","Đúng, nếu hệ thống không báo lỗi."],["D","Đúng, nếu hành khách đã đăng ký sử dụng cửa tự động."]],"a":"A","e":"Không được thu hẹp nhiệm vụ giám sát thành chỉ xem màn hình. Căn cứ: khoản 1 Điều 18.","g":"KIỂM SOÁT TẠI BỤC, NHẬN DẠNG VÀ XỬ LÝ DỮ LIỆU"},{"n":11,"q":"Nguyên tắc tiếp nhận hộ chiếu, giấy tờ xuất nhập cảnh tại Bước 1 được quy định thế nào?","o":[["A","Luôn nhận theo cả đoàn để giảm thời gian."],["B","Nhận trực tiếp lần lượt từng người; có ngoại lệ đối với hành khách danh sách do người đại diện, trưởng đoàn xuất trình và trẻ em đi cùng bố hoặc mẹ theo Quy trình."],["C","Chỉ được nhận trực tiếp từng người, không có ngoại lệ."],["D","Có thể nhận từ bất kỳ nhân viên phục vụ mặt đất nào."]],"a":"B","e":"Điểm cần nhớ là nguyên tắc từng người nhưng có ngoại lệ được quy định, không tuyệt đối hóa một trong hai cách. Căn cứ: khoản 1 Điều 19.","g":"KIỂM SOÁT TẠI BỤC, NHẬN DẠNG VÀ XỬ LÝ DỮ LIỆU"},{"n":12,"q":"Trong trình tự tại Điều 19, Bước 2 quy định việc lấy thông tin sinh trắc đối với nhóm nào?","o":[["A","Tất cả công dân Việt Nam xuất cảnh."],["B","Chỉ người nước ngoài xuất cảnh."],["C","Người nước ngoài khi nhập cảnh, theo hướng dẫn của Cục Quản lý xuất nhập cảnh."],["D","Chỉ hành khách bị hệ thống cảnh báo."]],"a":"C","e":"Không được tự đổi đối tượng hoặc điều kiện thực hiện Bước 2. Căn cứ: khoản 2 Điều 19.","g":"KIỂM SOÁT TẠI BỤC, NHẬN DẠNG VÀ XỬ LÝ DỮ LIỆU"},{"n":13,"q":"Khi thực hiện Bước 3 đối với trẻ em đi cùng hộ chiếu của bố hoặc mẹ, nhận định nào đúng?","o":[["A","Phải đối chiếu trẻ em đi cùng hộ chiếu; không chỉ nhận dạng người lớn."],["B","Chỉ cần nhận dạng bố hoặc mẹ vì trẻ không có hộ chiếu riêng."],["C","Chỉ đối chiếu trẻ khi hãng hàng không đề nghị."],["D","Có thể thay việc đối chiếu bằng xác nhận miệng của người đi cùng."]],"a":"A","e":"Trẻ em đi cùng hộ chiếu cũng thuộc nội dung đối chiếu được quy định tại bước nhận dạng. Căn cứ: khoản 3 Điều 19.","g":"KIỂM SOÁT TẠI BỤC, NHẬN DẠNG VÀ XỬ LÝ DỮ LIỆU"},{"n":14,"q":"Máy đọc đã đưa thông tin hộ chiếu lên màn hình. Kiểm soát viên phải làm gì ở Bước 5?","o":[["A","Chấp nhận toàn bộ vì thông tin được máy đọc tự động."],["B","Chỉ kiểm tra quốc tịch và ngày hết hạn."],["C","Chỉ chỉnh sửa khi hành khách chủ động phản ánh."],["D","Kiểm tra, nhập đầy đủ và chính xác các trường thông tin theo quy định."]],"a":"D","e":"Tự động hóa không loại trừ trách nhiệm kiểm tra, chuẩn hóa dữ liệu của kiểm soát viên. Căn cứ: khoản 5 Điều 19.","g":"KIỂM SOÁT TẠI BỤC, NHẬN DẠNG VÀ XỬ LÝ DỮ LIỆU"},{"n":15,"q":"Thao tác để chương trình tự động kiểm tra thông tin nhân thân ở Bước 6 được thực hiện vào thời điểm nào?","o":[["A","Ngay khi đặt hộ chiếu vào máy, không cần đối chiếu."],["B","Sau khi kiểm tra thông tin nhân thân trên máy đầy đủ, chính xác theo quy định."],["C","Sau khi trả hộ chiếu cho khách."],["D","Chỉ khi nhận thấy dấu hiệu nghi vấn bằng mắt thường."]],"a":"B","e":"Không đảo trình tự giữa kiểm tra tính chính xác dữ liệu và thao tác kiểm tra trên hệ thống. Căn cứ: khoản 6 Điều 19.","g":"KIỂM SOÁT TẠI BỤC, NHẬN DẠNG VÀ XỬ LÝ DỮ LIỆU"},{"n":16,"q":"Số hộ chiếu của khách trùng số hộ chiếu đã thông báo không còn giá trị sử dụng. Kiểm soát viên phải làm gì?","o":[["A","Dừng kiểm soát, báo cáo Chỉ huy Đội để chuyển Chỉ huy Đội Tổng hợp kiểm tra, báo cáo xử lý theo quy định."],["B","Cho qua nếu khách khẳng định đã tìm lại hộ chiếu."],["C","Cho qua nếu trang nhân thân còn nguyên vẹn."],["D","Tự phục hồi giá trị hộ chiếu ngay tại bục."]],"a":"A","e":"Hình thức hộ chiếu còn nguyên vẹn không tự làm mất hiệu lực của thông báo trên hệ thống. Căn cứ: điểm a khoản 6 Điều 19.","g":"KIỂM SOÁT TẠI BỤC, NHẬN DẠNG VÀ XỬ LÝ DỮ LIỆU"},{"n":17,"q":"Màn hình hiển thị “CẤM”. Kiểm soát viên phải xử lý thế nào?","o":[["A","Tiếp tục nếu hành khách xuất trình đủ vé và thị thực."],["B","Cho khách qua rồi chuyển thông tin cho Đội Tổng hợp."],["C","Ngừng làm thủ tục, báo cáo Chỉ huy Đội để bàn giao người cùng hộ chiếu, giấy tờ cho Chỉ huy Đội Tổng hợp xử lý."],["D","Tự xóa cảnh báo nếu thấy hành khách có nhân thân rõ ràng."]],"a":"C","e":"Không tự giải tỏa cảnh báo hoặc chuyển sang cơ chế “cho qua trước, xác minh sau”. Căn cứ: điểm c khoản 6 Điều 19.","g":"KIỂM SOÁT TẠI BỤC, NHẬN DẠNG VÀ XỬ LÝ DỮ LIỆU"},{"n":18,"q":"Hệ thống hiển thị “ĐƯỢC PHÉP” đối với công dân Việt Nam xuất cảnh hoặc nhập cảnh. Theo Quy trình 14764, việc đóng dấu kiểm chứng được thực hiện thế nào?","o":[["A","Luôn đóng dấu khi xuất cảnh, không đóng khi nhập cảnh."],["B","Luôn đóng dấu khi nhập cảnh, không đóng khi xuất cảnh."],["C","Đóng dấu nếu hành khách yêu cầu."],["D","Kiểm soát viên không đóng dấu kiểm chứng."]],"a":"D","e":"Đây là điểm cần phân biệt với cách xử lý giấy tờ của người nước ngoài. Căn cứ: điểm d khoản 6 Điều 19.","g":"KIỂM SOÁT TẠI BỤC, NHẬN DẠNG VÀ XỬ LÝ DỮ LIỆU"},{"n":19,"q":"Một người nước ngoài đủ điều kiện xuất cảnh có thị thực đã hết giá trị sử dụng. Theo nhánh xử lý tại khoản 6 Điều 19, dấu nào được sử dụng đối với thị thực này?","o":[["A","Dấu gia hạn tạm trú."],["B","Dấu “USED”."],["C","Dấu chứng nhận tạm trú mới."],["D","Không được xử lý xuất cảnh trong mọi trường hợp."]],"a":"B","e":"Quy trình quy định sử dụng dấu “USED” đối với thị thực hết giá trị sử dụng; không được nhầm với việc gia hạn hay cấp mới. Căn cứ: điểm d khoản 6 Điều 19.","g":"KIỂM SOÁT TẠI BỤC, NHẬN DẠNG VÀ XỬ LÝ DỮ LIỆU"},{"n":20,"q":"Với hành khách thông thường, sau khi hệ thống cho phép và hoàn thành xử lý giấy tờ, kiểm soát viên có thể trả ngay hộ chiếu mà không đối chiếu lại người nhận không?","o":[["A","Có, vì đã nhận dạng ở Bước 3."],["B","Có, nếu khách đứng nguyên tại bục."],["C","Không; Bước 7 yêu cầu nhận dạng, đối chiếu trước khi trả hộ chiếu, giấy tờ."],["D","Có, nếu hộ chiếu có gắn chíp."]],"a":"C","e":"Nhận dạng ở đầu quy trình không thay thế bước đối chiếu trước khi trả giấy tờ. Căn cứ: khoản 7 Điều 19.","g":"KIỂM SOÁT TẠI BỤC, NHẬN DẠNG VÀ XỬ LÝ DỮ LIỆU"},{"n":21,"q":"Cách làm nào đúng đối với khách VIP xuất cảnh theo Quy trình 14764?","o":[["A","Làm thủ tục xuất cảnh bình thường; không nhận diện, đối chiếu khách với ảnh trong hộ chiếu; ghi “VIP” vào trường “Ghi chú”."],["B","Không nhập dữ liệu xuất cảnh vì thuộc diện VIP."],["C","Chỉ kiểm tra thẻ lên tàu bay, không kiểm tra hộ chiếu."],["D","Chỉ xử lý nếu có văn bản riêng cho từng chuyến."]],"a":"A","e":"Ngoại lệ được quy định cụ thể, không phải miễn toàn bộ thủ tục xuất cảnh. Căn cứ: điểm c khoản 8 Điều 19.","g":"CÁC TRƯỜNG HỢP XUẤT NHẬP CẢNH DỄ ÁP DỤNG NHẦM NGOẠI LỆ"},{"n":22,"q":"Đối với khách VIP nhập cảnh, nội dung nào đúng?","o":[["A","Phải nhận diện, đối chiếu ảnh như khách thông thường nhưng không nhập máy."],["B","Không phải thực hiện bất kỳ thủ tục nhập cảnh nào."],["C","Chỉ ghi “VIP” khi khách có yêu cầu."],["D","Không thực hiện nhận diện, đối chiếu khách với ảnh trong hộ chiếu; ghi “VIP” vào trường “Ghi chú”."]],"a":"D","e":"Không được lấy quy trình thông thường để phủ nhận ngoại lệ, cũng không mở rộng ngoại lệ thành miễn mọi thủ tục. Căn cứ: điểm c khoản 9 Điều 19.","g":"CÁC TRƯỜNG HỢP XUẤT NHẬP CẢNH DỄ ÁP DỤNG NHẦM NGOẠI LỆ"},{"n":23,"q":"Hồ sơ hành khách có vướng mắc về thủ tục đã được lãnh đạo Công an cửa khẩu trực ca chỉ đạo giải quyết. Khi tiếp tục làm thủ tục, kiểm soát viên cần bổ sung gì?","o":[["A","Chỉ ghi tên nhân viên hãng hàng không đã liên hệ."],["B","Không ghi thêm vì đã có chỉ đạo trực tiếp."],["C","Ghi tên người chỉ đạo của lãnh đạo Công an cửa khẩu trực ca vào mục “Ghi chú” trong máy tính."],["D","Ghi chung “đã xin ý kiến”, không cần xác định người chỉ đạo."]],"a":"C","e":"Yêu cầu này phục vụ xác định quá trình và trách nhiệm giải quyết vướng mắc. Căn cứ: điểm d khoản 8 và điểm d khoản 9 Điều 19.","g":"CÁC TRƯỜNG HỢP XUẤT NHẬP CẢNH DỄ ÁP DỤNG NHẦM NGOẠI LỆ"},{"n":24,"q":"Người nước ngoài xuất cảnh sử dụng hộ chiếu có chứng nhận tạm trú gần nhất ký hiệu “EV”, nhưng trường thị thực không có dữ liệu thị thực điện tử. Cách xử lý đúng là gì?","o":[["A","Mặc nhiên giải quyết vì hộ chiếu đã có chứng nhận tạm trú."],["B","Báo cáo Chỉ huy Đội kiểm tra, xử lý."],["C","Tự nhập lại dữ liệu từ lời khai của khách."],["D","Đương nhiên kết luận khách sử dụng thị thực giả."]],"a":"B","e":"Không có dữ liệu phải được kiểm tra, xử lý theo tuyến; không tự suy đoán theo hướng cho qua hoặc kết luận vi phạm. Căn cứ: điểm đ khoản 8 Điều 19.","g":"CÁC TRƯỜNG HỢP XUẤT NHẬP CẢNH DỄ ÁP DỤNG NHẦM NGOẠI LỆ"},{"n":25,"q":"Hộ chiếu của người nước ngoài xuất cảnh có chứng nhận tạm trú gần nhất ký hiệu “KTVB”, nhưng trường mục đích không thể hiện “đến khu kinh tế ven biển du lịch” hoặc không có dữ liệu. Phương án đúng là gì?","o":[["A","Chỉ cần có vé quốc tế là giải quyết."],["B","Tự sửa mục đích thành “du lịch” để tiếp tục."],["C","Áp dụng ngay chế độ miễn thị thực đơn phương."],["D","Báo cáo Chỉ huy Đội kiểm tra, xử lý."]],"a":"D","e":"Không tự sửa dữ liệu để làm cho hồ sơ có vẻ phù hợp với điều kiện. Căn cứ: điểm e khoản 8 Điều 19.","g":"CÁC TRƯỜNG HỢP XUẤT NHẬP CẢNH DỄ ÁP DỤNG NHẦM NGOẠI LỆ"},{"n":26,"q":"Khách nhập cảnh bằng thị thực điện tử có đầy đủ dữ liệu trên hệ thống. Dấu kiểm chứng và chứng nhận tạm trú được đóng ở đâu?","o":[["A","Chỉ đóng trên bản in thị thực điện tử."],["B","Đóng vào hộ chiếu; không đóng vào bản in thị thực điện tử."],["C","Phải đóng đồng thời vào hộ chiếu và bản in thị thực."],["D","Không đóng vào bất kỳ giấy tờ nào vì thị thực là điện tử."]],"a":"B","e":"Cần phân biệt hình thức thị thực với nơi đóng dấu kiểm chứng, chứng nhận tạm trú. Căn cứ: điểm e khoản 9 Điều 19.","g":"CÁC TRƯỜNG HỢP XUẤT NHẬP CẢNH DỄ ÁP DỤNG NHẦM NGOẠI LỆ"},{"n":27,"q":"Hành khách xuất trình bản in thị thực điện tử, nhưng trường “thị thực điện tử” trong máy tính không có thông tin. Kiểm soát viên phải làm gì?","o":[["A","Chấp nhận bản in thay cho việc kiểm tra dữ liệu."],["B","Tự kết luận chưa cho nhập cảnh mà không báo cáo."],["C","Báo cáo Chỉ huy Đội để bàn giao Đội Tổng hợp xác minh, xử lý."],["D","Hướng dẫn hành khách chuyển sang cửa tự động."]],"a":"C","e":"Bản in không phải căn cứ để bỏ qua tình trạng thiếu dữ liệu; việc xử lý phải qua bước xác minh được quy định. Căn cứ: điểm e khoản 9 Điều 19.","g":"CÁC TRƯỜNG HỢP XUẤT NHẬP CẢNH DỄ ÁP DỤNG NHẦM NGOẠI LỆ"},{"n":28,"q":"Thành viên tổ bay là người nước ngoài có thị thực nhiều lần, thẻ tạm trú hoặc thẻ thường trú. Quy trình phân biệt lần nhập cảnh sử dụng thị thực đầu và các lần tiếp theo thế nào?","o":[["A","Lần sử dụng thị thực đầu đóng dấu kiểm chứng nhập cảnh và cấp chứng nhận tạm trú; các lần nhập cảnh tiếp theo chỉ đóng dấu kiểm chứng nhập cảnh."],["B","Mọi lần nhập cảnh đều phải cấp chứng nhận tạm trú như nhau."],["C","Không đóng dấu kiểm chứng trong mọi trường hợp vì là tổ bay."],["D","Chỉ nhập dữ liệu vào máy, không xử lý giấy tờ."]],"a":"A","e":"Đây là ngoại lệ riêng của thành viên tổ bay; không áp dụng máy móc cách xử lý hành khách thông thường. Căn cứ: điểm b khoản 9 Điều 19.","g":"CÁC TRƯỜNG HỢP XUẤT NHẬP CẢNH DỄ ÁP DỤNG NHẦM NGOẠI LỆ"},{"n":29,"q":"Đối với thành viên tổ bay nhập cảnh thuộc diện miễn thị thực theo hiệp định, thỏa thuận, nhận định nào đúng?","o":[["A","Không cần kiểm tra điều kiện nhập cảnh."],["B","Vẫn kiểm tra điều kiện nhập cảnh và nhập máy xác thời hạn tạm trú; không mặc nhiên đóng dấu vào hộ chiếu như khách thông thường, mà thực hiện theo ngoại lệ về lần đầu hoặc yêu cầu của thành viên tổ bay."],["C","Mọi lần nhập cảnh đều phải đóng dấu và cấp chứng nhận tạm trú giống khách du lịch."],["D","Chỉ hãng hàng không quản lý, Công an cửa khẩu không thực hiện thủ tục."]],"a":"B","e":"Miễn thị thực theo hiệp định, thỏa thuận không đồng nghĩa với miễn kiểm tra điều kiện nhập cảnh hoặc miễn nhập dữ liệu. Căn cứ: điểm b khoản 9 Điều 19.","g":"CÁC TRƯỜNG HỢP XUẤT NHẬP CẢNH DỄ ÁP DỤNG NHẦM NGOẠI LỆ"},{"n":30,"q":"Thành viên tổ bay không thuộc diện miễn thị thực theo hiệp định, thỏa thuận, nhưng thuộc diện Việt Nam đơn phương miễn thị thực. Cách xử lý nào đúng?","o":[["A","Áp dụng toàn bộ ngoại lệ dành cho tổ bay được miễn thị thực theo hiệp định."],["B","Không cần chứng nhận tạm trú vì là tổ bay."],["C","Chỉ nhận danh sách tổ bay thay cho thủ tục nhập cảnh."],["D","Kiểm tra điều kiện nhập cảnh, đóng dấu kiểm chứng và cấp chứng nhận tạm trú như hành khách nhập cảnh."]],"a":"D","e":"Miễn thị thực đơn phương và miễn thị thực theo hiệp định, thỏa thuận dành cho tổ bay là hai nhánh không được đánh đồng. Căn cứ: điểm b khoản 9 Điều 19.","g":"CÁC TRƯỜNG HỢP XUẤT NHẬP CẢNH DỄ ÁP DỤNG NHẦM NGOẠI LỆ"},{"n":31,"q":"Theo điểm đ khoản 9 Điều 19, người nước ngoài thuộc diện Việt Nam đơn phương miễn thị thực nhập cảnh vào khu kinh tế ven biển áp dụng chính sách miễn thị thực. Thời hạn chứng nhận tạm trú trong nhánh này là bao nhiêu?","o":[["A","Luôn 15 ngày."],["B","Luôn 30 ngày vì đến khu kinh tế ven biển."],["C","45 ngày."],["D","90 ngày."]],"a":"C","e":"Không được thấy địa điểm là khu kinh tế ven biển rồi mặc nhiên áp dụng thời hạn 30 ngày cho mọi đối tượng. Căn cứ: điểm đ khoản 9 Điều 19.","g":"CÁC TRƯỜNG HỢP XUẤT NHẬP CẢNH DỄ ÁP DỤNG NHẦM NGOẠI LỆ"},{"n":32,"q":"Người nước ngoài chỉ được xem xét theo chế độ miễn thị thực để đến khu kinh tế ven biển, nhập cảnh tại cửa khẩu hàng không khác và xuất trình vé nối chuyến nội địa phù hợp. Nhánh xử lý nào được Quy trình quy định?","o":[["A","Cấp chứng nhận tạm trú 30 ngày, nhập mục đích đến khu kinh tế ven biển du lịch, ghi “KTVB” và thực hiện bàn giao cho đại diện hãng theo quy định."],["B","Cấp 45 ngày cho mọi quốc tịch."],["C","Cấp 90 ngày do có vé nối chuyến."],["D","Chỉ kiểm tra vé rồi để khách tự di chuyển, không phải thực hiện các bước bàn giao."]],"a":"A","e":"Phải phân biệt nhánh này với người đã có căn cứ miễn thị thực khác; Quy trình còn quy định việc sao chụp, bàn giao để quản lý chuyến nối. Căn cứ: điểm đ khoản 9 Điều 19.","g":"CÁC TRƯỜNG HỢP XUẤT NHẬP CẢNH DỄ ÁP DỤNG NHẦM NGOẠI LỆ"},{"n":33,"q":"Hành khách xuất cảnh có hộ chiếu hợp lệ nhưng thông tin trên thẻ lên tàu bay không thống nhất với giấy tờ nhân thân. Nhận định nào đúng?","o":[["A","Thẻ lên tàu bay thuộc trách nhiệm hãng nên kiểm soát viên không phải kiểm tra."],["B","Kiểm soát viên phải kiểm tra sự đồng nhất của thông tin, cùng nội dung liên quan đến kết quả soi chiếu hành lý ký gửi nếu có."],["C","Chỉ cần đối chiếu số ghế."],["D","Chỉ kiểm tra thẻ lên tàu bay khi hộ chiếu hết hạn."]],"a":"B","e":"Kiểm tra thẻ lên tàu bay là nội dung được nêu riêng đối với hành khách xuất cảnh. Căn cứ: điểm a khoản 8 Điều 19.","g":"CÁC TRƯỜNG HỢP XUẤT NHẬP CẢNH DỄ ÁP DỤNG NHẦM NGOẠI LỆ"},{"n":34,"q":"Thành viên tổ bay là người nước ngoài xuất cảnh, thuộc diện miễn thị thực theo hiệp định, thỏa thuận. Việc đóng dấu kiểm chứng xuất cảnh được thực hiện thế nào?","o":[["A","Luôn đóng dấu cho mọi thành viên tổ bay."],["B","Không bao giờ đóng dấu, kể cả khi thành viên tổ bay đề nghị."],["C","Do hãng hàng không tự lựa chọn cách đóng dấu."],["D","Kiểm soát viên đóng dấu kiểm chứng xuất cảnh khi thành viên tổ bay đề nghị, đồng thời vẫn thực hiện các nội dung kiểm tra theo Quy trình."]],"a":"D","e":"Không nhầm ngoại lệ về đóng dấu với việc miễn kiểm tra thời hạn tạm trú hoặc miễn quản lý thông tin tổ bay. Căn cứ: điểm b khoản 8 Điều 19.","g":"CÁC TRƯỜNG HỢP XUẤT NHẬP CẢNH DỄ ÁP DỤNG NHẦM NGOẠI LỆ"},{"n":35,"q":"Phạm vi “khu vực cách ly xuất cảnh” tại Điều 22 được xác định thế nào?","o":[["A","Từ bục kiểm soát xuất cảnh đến cửa làm thủ tục đi tàu bay."],["B","Từ quầy làm thủ tục hãng hàng không đến bục xuất cảnh."],["C","Từ cửa vào nhà ga đến quầy làm thủ tục hàng không."],["D","Chỉ khu vực ngay trước cửa tàu bay."]],"a":"A","e":"Phải xác định đúng ranh giới trách nhiệm, không đồng nhất khu vực làm thủ tục hãng với khu vực cách ly xuất cảnh. Căn cứ: điểm a khoản 1 Điều 22.","g":"KHU VỰC CÁCH LY, TÀU BAY, QUÁ CẢNH VÀ KHÁCH BỊ TỪ CHỐI NHẬP CẢNH"},{"n":36,"q":"Khách đã hoàn thành thủ tục xuất cảnh nhưng không xuất cảnh cùng chuyến bay và đề nghị quay lại. Cách xử lý đúng là gì?","o":[["A","Chỉ cần hãng hàng không đồng ý là cho ra."],["B","Chỉ hủy thẻ lên tàu bay, không cần xử lý dữ liệu xuất nhập cảnh."],["C","Báo cáo Chỉ huy Đội, làm rõ lý do; phối hợp Đội Tổng hợp báo cáo lãnh đạo trực ca thực hiện hủy dấu kiểm chứng đã đóng, điều chỉnh thông tin nhân thân và nhập máy theo quy định."],["D","Cho ra trước, cuối ngày xử lý dữ liệu tập trung."]],"a":"C","e":"Việc không thực hiện chuyến bay phải được xử lý cả về quản lý hành khách, dấu đã đóng nếu có và dữ liệu. Căn cứ: điểm a khoản 4 Điều 22.","g":"KHU VỰC CÁCH LY, TÀU BAY, QUÁ CẢNH VÀ KHÁCH BỊ TỪ CHỐI NHẬP CẢNH"},{"n":37,"q":"Chuyến bay bị hủy sau khi hành khách đã hoàn thành thủ tục xuất cảnh và đang chờ trong khu vực cách ly. Phương án nào đúng?","o":[["A","Hãng hàng không tự đưa khách ra khỏi khu vực cách ly."],["B","Chỉ lập danh sách khách, giữ nguyên toàn bộ thông tin xuất cảnh."],["C","Chờ chuyến bay kế tiếp, không cần xử lý dù khách được đưa ra ngoài."],["D","Chỉ huy Đội trao đổi Đội Tổng hợp, báo cáo lãnh đạo trực ca; thực hiện hủy dấu kiểm chứng đã đóng nếu có, hủy thông tin nhân thân liên quan và điều chỉnh thông tin chuyến bay theo Quy trình."]],"a":"D","e":"Cần phân biệt chuyến chỉ lùi giờ, vẫn quản lý khách chờ, với chuyến bị hủy và phải xử lý lại thủ tục. Căn cứ: điểm b khoản 4 Điều 22.","g":"KHU VỰC CÁCH LY, TÀU BAY, QUÁ CẢNH VÀ KHÁCH BỊ TỪ CHỐI NHẬP CẢNH"},{"n":38,"q":"Khi kiểm soát tàu bay xuất cảnh, số khách lên tàu bay không khớp số khách do cán bộ khu vực cách ly xuất cảnh thông báo. Cách xử lý đúng là gì?","o":[["A","Lấy số của hãng làm số chính thức và cho tàu bay đi."],["B","Báo cáo ngay Chỉ huy Đội để báo cáo lãnh đạo Công an cửa khẩu trực ca xem xét, xử lý."],["C","Chỉ ghi chênh lệch vào nhật ký sau khi tàu bay cất cánh."],["D","Bỏ qua nếu chênh lệch chỉ một người."]],"a":"B","e":"Không có ngoại lệ “chênh lệch ít thì bỏ qua”. Căn cứ: điểm a khoản 2 Điều 23.","g":"KHU VỰC CÁCH LY, TÀU BAY, QUÁ CẢNH VÀ KHÁCH BỊ TỪ CHỐI NHẬP CẢNH"},{"n":39,"q":"Tiếp nhận hành khách bị từ chối nhập cảnh và vật dụng cá nhân từ hãng hàng không phải dựa trên hình thức nào?","o":[["A","Biên bản bàn giao, có sự chứng kiến của đại diện Cảng vụ hàng không."],["B","Xác nhận miệng của nhân viên hãng."],["C","Tin nhắn của đại diện hãng kèm ảnh hộ chiếu."],["D","Chỉ danh sách chuyến bay."]],"a":"A","e":"Tiếp nhận người và tài sản không chỉ là việc chuyển giao thực tế; phải có hồ sơ bàn giao theo Quy trình. Căn cứ: điểm a khoản 5 Điều 22.","g":"KHU VỰC CÁCH LY, TÀU BAY, QUÁ CẢNH VÀ KHÁCH BỊ TỪ CHỐI NHẬP CẢNH"},{"n":40,"q":"Người quen của hành khách bị từ chối nhập cảnh đề nghị vào khu lưu trú để đưa thức ăn. Cách xử lý nào phù hợp Quy trình?","o":[["A","Cho vào nếu hành khách đồng ý."],["B","Cho vào nếu xuất trình căn cước."],["C","Không cho người không có nhiệm vụ tiếp cận; việc mở cửa khu lưu trú thực hiện trong trường hợp và điều kiện được Quy trình cho phép."],["D","Chuyển quyền quyết định hoàn toàn cho hành khách."]],"a":"C","e":"Quy trình kiểm soát chặt việc tiếp cận và tiếp tế; đại diện hãng thực hiện nhiệm vụ cũng phải đáp ứng điều kiện, sự đồng ý theo quy định. Căn cứ: điểm b khoản 5 Điều 22.","g":"KHU VỰC CÁCH LY, TÀU BAY, QUÁ CẢNH VÀ KHÁCH BỊ TỪ CHỐI NHẬP CẢNH"},{"n":41,"q":"Khi kết thúc quản lý, giám sát và bàn giao khách bị từ chối nhập cảnh cho hãng hàng không, yêu cầu nào đúng?","o":[["A","Chỉ cần giao hộ chiếu cho nhân viên hãng."],["B","Chỉ ký sổ nội bộ, không cần biên bản với hãng."],["C","Bàn giao qua điện thoại nếu khách sắp đến giờ bay."],["D","Lập biên bản bàn giao, có sự chứng kiến của đại diện Cảng vụ hàng không."]],"a":"D","e":"Phải phân biệt bàn giao ca nội bộ với bàn giao khách cho hãng để tiếp tục thực hiện trách nhiệm vận chuyển. Căn cứ: điểm c khoản 5 Điều 22.","g":"KHU VỰC CÁCH LY, TÀU BAY, QUÁ CẢNH VÀ KHÁCH BỊ TỪ CHỐI NHẬP CẢNH"},{"n":42,"q":"Phát hiện khách quá cảnh có dấu hiệu nghi vấn tại khu vực làm thủ tục hàng không chuyển tàu bay đi nước thứ ba. Hướng xử lý nào đúng?","o":[["A","Cho khách tự sang khu nhập cảnh để giải thích."],["B","Báo cáo lãnh đạo Đội để trao đổi Đội Trinh sát, phối hợp nhân viên hàng không kiểm tra; thông báo cho các bộ phận liên quan theo Quy trình."],["C","Chỉ kiểm tra vé nối chuyến, không kiểm tra giấy tờ."],["D","Tự kết luận khách nhập cảnh trái phép."]],"a":"B","e":"Không tự chuyển tình trạng quá cảnh thành nhập cảnh hoặc tự kết luận vi phạm khi chưa kiểm tra, xử lý. Căn cứ: điểm a khoản 2 Điều 24.","g":"KHU VỰC CÁCH LY, TÀU BAY, QUÁ CẢNH VÀ KHÁCH BỊ TỪ CHỐI NHẬP CẢNH"},{"n":43,"q":"Thành viên tổ bay là người nước ngoài đi chuyến bay nội địa có phải thực hiện thủ tục nhập cảnh không?","o":[["A","Phải thực hiện, trừ trường hợp vận chuyển quốc tế kết hợp nhiều điểm tại Việt Nam theo quy định pháp luật."],["B","Không bao giờ phải thực hiện vì chỉ bay nội địa."],["C","Chỉ thực hiện nếu có hành lý ký gửi."],["D","Chỉ cần có tên trong danh sách tổ bay."]],"a":"A","e":"Đây là trường hợp dễ nhầm giữa tính chất chặng bay nội địa và tình trạng nhập cảnh của thành viên tổ bay. Căn cứ: điểm e khoản 3 Điều 23.","g":"KHU VỰC CÁCH LY, TÀU BAY, QUÁ CẢNH VÀ KHÁCH BỊ TỪ CHỐI NHẬP CẢNH"},{"n":44,"q":"Tàu bay phải quay lại vì lý do kỹ thuật, an toàn hoặc an ninh hàng không. Cán bộ có được tự để hành khách rời khu vực kiểm soát không?","o":[["A","Có, vì tàu bay đã quay về sân bay xuất phát."],["B","Có, nếu cơ trưởng thông báo chuyến bay kết thúc."],["C","Không; phải báo cáo Chỉ huy Đội để báo cáo lãnh đạo Công an cửa khẩu trực ca và phối hợp kiểm tra, giám sát theo Quy trình."],["D","Chỉ cần báo hãng hàng không."]],"a":"C","e":"Việc tàu bay quay lại không tự động giải quyết tình trạng thủ tục và quản lý hành khách. Căn cứ: điểm b khoản 4 Điều 23.","g":"KHU VỰC CÁCH LY, TÀU BAY, QUÁ CẢNH VÀ KHÁCH BỊ TỪ CHỐI NHẬP CẢNH"},{"n":45,"q":"Nhân viên hãng hàng không có thẻ kiểm soát an ninh hợp lệ đề nghị đi từ khu vực công cộng vào khu vực hạn chế nhưng không qua kiểm tra người và đồ vật. Nhận định nào đúng?","o":[["A","Có thẻ hợp lệ thì được miễn mọi hình thức kiểm tra."],["B","Kiểm tra thẻ và kiểm tra an ninh người, đồ vật là những nội dung riêng; thẻ hợp lệ không tự thay thế việc kiểm tra an ninh."],["C","Chỉ cần đồng phục hãng hàng không là đủ."],["D","Chỉ kiểm tra khi thẻ đã hết hạn."]],"a":"B","e":"Không đánh đồng quyền được vào khu vực với đã hoàn thành kiểm tra an ninh khi vào. Căn cứ: các điểm a, c khoản 1 Điều 25.","g":"KIỂM SOÁT LỐI ĐI NỘI BỘ"},{"n":46,"q":"Một nhân viên đã ở trong khu vực hạn chế muốn qua lối nội bộ sang khu vực hạn chế khác. Có thể bỏ kiểm tra giấy tờ vì người đó “đã ở bên trong” không?","o":[["A","Có, vì mọi khu vực hạn chế có cùng điều kiện ra vào."],["B","Có, nếu nhân viên làm việc thường xuyên tại sân bay."],["C","Có, nếu cán bộ trực đã quen mặt."],["D","Không; phải giám sát, kiểm soát, kiểm tra giấy tờ để bảo đảm đủ điều kiện vào, hoạt động tại khu vực tương ứng."]],"a":"D","e":"Quyền vào một khu vực hạn chế không mặc nhiên là quyền vào mọi khu vực hạn chế khác. Căn cứ: điểm a khoản 2 Điều 26.","g":"KIỂM SOÁT LỐI ĐI NỘI BỘ"},{"n":47,"q":"Phương tiện có giấy phép kiểm soát an ninh hợp lệ đi vào khu vực hạn chế. Đối với người điều khiển phương tiện, kiểm tra nào vẫn phải thực hiện theo Điều 25?","o":[["A","Kiểm tra giấy phép lái xe và giấy tờ kiểm soát an ninh phù hợp, đồng thời thực hiện các nội dung kiểm tra theo quy định."],["B","Không cần kiểm tra vì giấy phép phương tiện đã bao gồm người lái."],["C","Chỉ kiểm tra biển số xe."],["D","Chỉ kiểm tra giấy giới thiệu của doanh nghiệp."]],"a":"A","e":"Giấy phép của phương tiện không thay cho điều kiện, giấy tờ của người điều khiển. Căn cứ: điểm a khoản 1 Điều 25.","g":"KIỂM SOÁT LỐI ĐI NỘI BỘ"},{"n":48,"q":"Đối với người, phương tiện, đồ vật ra khỏi khu vực hạn chế qua lối nội bộ, nhận định nào đúng?","o":[["A","Không bao giờ kiểm tra vì đang đi ra."],["B","Mọi trường hợp đều phải áp dụng đúng một chế độ kiểm tra giống nhau, không xét tình huống."],["C","Kiểm tra khi có nghi vấn, biểu hiện bất thường hoặc trong trường hợp bảo đảm an ninh hàng không theo chỉ đạo được quy định."],["D","Chỉ kiểm tra khi doanh nghiệp chủ quản đề nghị."]],"a":"C","e":"Quy trình có quy định kiểm tra chiều ra, nhưng không được diễn giải thành “không kiểm tra” hoặc tự đặt một chế độ tuyệt đối cho mọi trường hợp. Căn cứ: điểm a khoản 2 Điều 25.","g":"KIỂM SOÁT LỐI ĐI NỘI BỘ"},{"n":49,"q":"Khách đã hoàn thành kiểm soát an ninh vào khu vực hạn chế cần ra ngoài trong trường hợp đặc biệt theo yêu cầu của cơ quan có thẩm quyền hoặc đơn vị được Quy trình nêu. Cách xử lý đúng là gì?","o":[["A","Cho ra và yêu cầu khách tự quay lại trước giờ bay."],["B","Chỉ ghi số ghế."],["C","Giao toàn bộ việc quản lý cho người thân khách."],["D","Báo cáo Chỉ huy Đội; tạm giữ hộ chiếu hoặc giấy tờ tùy thân và yêu cầu đơn vị liên quan đón, chịu trách nhiệm dẫn khách ra, đưa khách trở lại."]],"a":"D","e":"Cho ra trong trường hợp đặc biệt phải đi kèm biện pháp quản lý người và giấy tờ, không phải mở lối tự do. Căn cứ: điểm d khoản 2 Điều 26.","g":"KIỂM SOÁT LỐI ĐI NỘI BỘ"},{"n":50,"q":"Hành khách ở Câu 49 quay trở lại cùng nhân viên hãng hàng không. Cán bộ có thể bỏ nhận dạng và soi chiếu lại không?","o":[["A","Có, vì đã có người của hãng đưa trở lại."],["B","Không; phải nhận dạng, đối chiếu với giấy tờ, trả giấy tờ đúng người và yêu cầu tái kiểm tra an ninh theo quy định."],["C","Có, nếu thời gian ra ngoài dưới 10 phút."],["D","Có, nếu hành khách cam kết không nhận thêm đồ vật."]],"a":"B","e":"Người dẫn đi không thay thế việc xác định đúng người và tái kiểm tra an ninh khi trở lại. Căn cứ: điểm d khoản 2 Điều 26.","g":"KIỂM SOÁT LỐI ĐI NỘI BỘ"},{"n":51,"q":"Công dân Việt Nam có hộ chiếu còn nguyên vẹn, còn hạn 4 tháng; đáp ứng điều kiện được nước đến cho nhập cảnh và không thuộc trường hợp bị hạn chế xuất cảnh. Có thể từ chối chỉ vì hộ chiếu “chưa đủ 6 tháng” không?","o":[["A","Không thể tự đặt điều kiện chung 6 tháng thay cho điều kiện tại Điều 33; vẫn phải xét đầy đủ điều kiện của nước đến và các điều kiện xuất cảnh khác."],["B","Có, vì mọi công dân Việt Nam xuất cảnh đều bắt buộc hộ chiếu còn ít nhất 6 tháng."],["C","Có, trừ người có hộ chiếu gắn chíp."],["D","Có, trừ người đã từng xuất cảnh."]],"a":"A","e":"Điều 33 quy định giấy tờ xuất nhập cảnh còn nguyên vẹn, còn thời hạn; không được đánh đồng với yêu cầu riêng của nước đến. Căn cứ: khoản 1 Điều 33 trong Văn bản hợp nhất 71.","g":"PHÁP LUẬT XUẤT NHẬP CẢNH VÀ CÁC NỘI DUNG SỬA ĐỔI"},{"n":52,"q":"Công dân Việt Nam nhập cảnh bằng hộ chiếu còn nguyên vẹn và còn hạn 7 ngày. Nhận định nào đúng về điều kiện thời hạn giấy tờ?","o":[["A","Phải còn ít nhất 6 tháng."],["B","Phải còn ít nhất 3 tháng."],["C","Điều 34 yêu cầu giấy tờ còn nguyên vẹn, còn thời hạn sử dụng; không đặt điều kiện còn tối thiểu 3 hoặc 6 tháng."],["D","Chỉ được nhập cảnh nếu hãng hàng không có văn bản bảo lãnh."]],"a":"C","e":"Điều kiện nhập cảnh của công dân Việt Nam không được suy diễn từ điều kiện thị thực hoặc vận chuyển của nước ngoài. Căn cứ: Điều 34.","g":"PHÁP LUẬT XUẤT NHẬP CẢNH VÀ CÁC NỘI DUNG SỬA ĐỔI"},{"n":53,"q":"Công dân Việt Nam 13 tuổi có hộ chiếu, thị thực hợp lệ nhưng xuất cảnh một mình. Theo Điều 33, điều kiện nào còn phải được xem xét?","o":[["A","Chỉ cần có vé khứ hồi."],["B","Chỉ cần hãng hàng không nhận vận chuyển trẻ đi một mình."],["C","Chỉ cần có bản sao giấy khai sinh."],["D","Phải có người đại diện hợp pháp đi cùng theo quy định."]],"a":"D","e":"Dịch vụ vận chuyển trẻ đi một mình không tự thay thế điều kiện về người đại diện hợp pháp theo Luật. Căn cứ: khoản 2 Điều 33.","g":"PHÁP LUẬT XUẤT NHẬP CẢNH VÀ CÁC NỘI DUNG SỬA ĐỔI"},{"n":54,"q":"Đối với người đã được xác định là công dân Việt Nam nhưng không đủ điều kiện nhập cảnh, Điều 35 quy định hướng giải quyết nào?","o":[["A","Từ chối nhập cảnh như đối với người nước ngoài trong mọi trường hợp."],["B","Xử lý theo pháp luật về xử lý vi phạm hành chính, sau đó giải quyết cho nhập cảnh."],["C","Chỉ giải quyết nếu có người thân bảo lãnh."],["D","Để hãng hàng không toàn quyền quyết định."]],"a":"B","e":"Không áp dụng máy móc cơ chế chưa cho nhập cảnh của người nước ngoài đối với công dân Việt Nam. Căn cứ: điểm c khoản 2 Điều 35.","g":"PHÁP LUẬT XUẤT NHẬP CẢNH VÀ CÁC NỘI DUNG SỬA ĐỔI"},{"n":55,"q":"Một công dân đang thuộc diện tạm hoãn xuất cảnh có hộ chiếu mới được cấp, còn hạn 10 năm. Hộ chiếu mới có tự làm mất hiệu lực của việc tạm hoãn xuất cảnh không?","o":[["A","Có, vì quyết định cũ chỉ gắn với số hộ chiếu cũ."],["B","Có, nếu hộ chiếu mới có gắn chíp."],["C","Không; có hộ chiếu hợp lệ không thay thế điều kiện không thuộc trường hợp bị tạm hoãn xuất cảnh."],["D","Có, nếu người đó đổi nơi thường trú."]],"a":"C","e":"Điều kiện về giấy tờ và điều kiện về hạn chế xuất cảnh là các điều kiện riêng, phải đồng thời được đáp ứng. Căn cứ: điểm a, c khoản 1 Điều 33.","g":"PHÁP LUẬT XUẤT NHẬP CẢNH VÀ CÁC NỘI DUNG SỬA ĐỔI"},{"n":56,"q":"Sau khi công dân được cấp hộ chiếu phổ thông mới, hộ chiếu phổ thông cũ vẫn còn thời hạn in trên giấy. Nhận định nào đúng theo nội dung sửa đổi năm 2025?","o":[["A","Cơ quan cấp hộ chiếu thực hiện hủy giá trị sử dụng của hộ chiếu phổ thông được cấp trước đó còn thời hạn."],["B","Cả hai hộ chiếu luôn được sử dụng song song đến ngày hết hạn."],["C","Chỉ hủy hộ chiếu cũ nếu người dân tự nguyện."],["D","Chỉ hủy khi hộ chiếu cũ bị rách."]],"a":"A","e":"Ngày hết hạn in trên hộ chiếu không phải căn cứ duy nhất xác định giá trị sử dụng hiện tại. Căn cứ: khoản 1 Điều 31a được bổ sung bởi khoản 10 Điều 3 Luật 118/2025/QH15.","g":"PHÁP LUẬT XUẤT NHẬP CẢNH VÀ CÁC NỘI DUNG SỬA ĐỔI"},{"n":57,"q":"Công dân tìm lại hộ chiếu phổ thông đã bị hủy giá trị sử dụng do báo mất trong nước. Hộ chiếu còn nguyên vẹn và có thị thực nước ngoài còn hạn. Cách hiểu đúng là gì?","o":[["A","Hộ chiếu tự động có giá trị trở lại ngay khi tìm thấy."],["B","Chỉ cần trình giấy báo mất tại cửa khẩu là được sử dụng."],["C","Hãng hàng không có quyền phục hồi giá trị hộ chiếu."],["D","Thuộc trường hợp được xem xét khôi phục theo thủ tục; không tự động phục hồi."]],"a":"D","e":"Phải phân biệt đủ điều kiện được xem xét khôi phục với đã được khôi phục giá trị sử dụng. Căn cứ: Điều 32.","g":"PHÁP LUẬT XUẤT NHẬP CẢNH VÀ CÁC NỘI DUNG SỬA ĐỔI"},{"n":58,"q":"Hộ chiếu phổ thông cấp theo thủ tục rút gọn được quy định thế nào sau sửa đổi?","o":[["A","Có thời hạn 5 năm và sử dụng nhiều lần."],["B","Có thời hạn không quá 12 tháng, không được gia hạn và chỉ có giá trị sử dụng một lần khi xuất cảnh Việt Nam hoặc nhập cảnh Việt Nam."],["C","Có thời hạn 12 tháng và được gia hạn một lần."],["D","Chỉ sử dụng để nhập cảnh, không thể sử dụng để xuất cảnh trong bất kỳ trường hợp nào."]],"a":"B","e":"Có ba yếu tố cần nhớ đồng thời: không quá 12 tháng – không gia hạn – sử dụng một lần. Căn cứ: khoản 1 Điều 3 Luật 118/2025/QH15 sửa điểm c khoản 2 Điều 7.","g":"PHÁP LUẬT XUẤT NHẬP CẢNH VÀ CÁC NỘI DUNG SỬA ĐỔI"},{"n":59,"q":"Thời hạn tạm hoãn xuất cảnh đã hết, không có quyết định hủy bỏ và cũng không được gia hạn. Theo Điều 38, tình trạng pháp lý của việc tạm hoãn thế nào?","o":[["A","Tiếp tục có hiệu lực cho đến khi có văn bản hủy bỏ."],["B","Tự động được gia hạn thêm một thời hạn bằng thời hạn cũ."],["C","Đương nhiên được hủy bỏ theo quy định."],["D","Do hãng hàng không quyết định chấp nhận hay không."]],"a":"C","e":"Không được nhầm giữa trường hợp hủy bỏ trước hạn và trường hợp hết hạn mà không được gia hạn. Căn cứ: khoản 2 Điều 38.","g":"PHÁP LUẬT XUẤT NHẬP CẢNH VÀ CÁC NỘI DUNG SỬA ĐỔI"},{"n":60,"q":"Giấy tờ, thông tin thuộc thành phần hồ sơ giải quyết thủ tục hành chính về xuất nhập cảnh của công dân Việt Nam đã có trong cơ sở dữ liệu và có thể khai thác, sử dụng. Cơ quan giải quyết phải xử lý thế nào?","o":[["A","Không yêu cầu công dân cung cấp lại giấy tờ, thông tin đó theo quy định; không được suy diễn thành miễn xuất trình giấy tờ khi kiểm soát tại cửa khẩu."],["B","Vẫn bắt buộc cung cấp lại để lưu đủ bản giấy trong mọi trường hợp."],["C","Miễn toàn bộ giấy tờ ở mọi khâu, kể cả kiểm soát qua cửa khẩu."],["D","Chỉ được sử dụng dữ liệu nếu công dân in dữ liệu ra giấy."]],"a":"A","e":"Phạm vi sửa đổi là giấy tờ, thông tin của hồ sơ thủ tục hành chính đã khai thác được; nghĩa vụ xuất trình tại cửa khẩu được quy định riêng. Căn cứ: khoản 2 Điều 40 và khoản 1 Điều 35.","g":"PHÁP LUẬT XUẤT NHẬP CẢNH VÀ CÁC NỘI DUNG SỬA ĐỔI"},{"n":61,"q":"Theo Luật 118/2025/QH15, thời hạn tối đa của thị thực và thẻ tạm trú ký hiệu UD1, UD2 được phân biệt thế nào?","o":[["A","Thị thực tối đa 10 năm, thẻ tạm trú tối đa 5 năm."],["B","Thị thực không quá 5 năm; thẻ tạm trú không quá 10 năm."],["C","Cả thị thực và thẻ tạm trú đều không quá 10 năm."],["D","Cả hai đều không quá 2 năm."]],"a":"B","e":"Không đánh đồng thời hạn của thị thực với thời hạn của thẻ tạm trú dù cùng ký hiệu. Căn cứ: khoản 3 và khoản 10 Điều 2 Luật 118/2025/QH15.","g":"PHÁP LUẬT XUẤT NHẬP CẢNH VÀ CÁC NỘI DUNG SỬA ĐỔI"},{"n":62,"q":"Ký hiệu thị thực UD2 được bổ sung để cấp cho nhóm nào?","o":[["A","Mọi người thân của người được cấp UD1, không giới hạn quan hệ."],["B","Cha, mẹ và mọi con của người được cấp UD1."],["C","Vợ, chồng và con dưới 21 tuổi của người được cấp UD1."],["D","Người nước ngoài là vợ, chồng, con dưới 18 tuổi của người được cấp thị thực UD1."]],"a":"D","e":"Hai điểm dễ nhầm là phạm vi quan hệ thân nhân và mốc dưới 18 tuổi. Căn cứ: khoản 2 Điều 2 Luật 118/2025/QH15.","g":"PHÁP LUẬT XUẤT NHẬP CẢNH VÀ CÁC NỘI DUNG SỬA ĐỔI"},{"n":63,"q":"Nhận định nào đúng về phạm vi điều chỉnh của Thông tư 71/2026/TT-BCA?","o":[["A","Điều chỉnh mọi trường hợp tạm hoãn xuất cảnh, chưa cho nhập cảnh, không có ngoại lệ."],["B","Chỉ điều chỉnh người nước ngoài."],["C","Có những trường hợp bị loại trừ tại khoản 2 Điều 1, trong đó có các quyết định vì lý do an ninh quốc gia, trật tự, an toàn xã hội."],["D","Chỉ điều chỉnh quyết định gửi bằng văn bản giấy."]],"a":"C","e":"Không được sử dụng Thông tư này như một quy trình bao trùm mọi căn cứ, mọi loại quyết định. Căn cứ: khoản 2 Điều 1.","g":"TẠM HOÃN XUẤT CẢNH, CHƯA CHO NHẬP CẢNH"},{"n":64,"q":"Dữ liệu điện tử về quyết định được trao đổi qua kết nối với hệ thống thông tin Quản lý xuất nhập cảnh có giá trị pháp lý thế nào?","o":[["A","Có giá trị như văn bản giấy khi đáp ứng yêu cầu về xác thực, toàn vẹn dữ liệu theo pháp luật về giao dịch điện tử."],["B","Chỉ có giá trị tham khảo, luôn phải chờ bản giấy."],["C","Có giá trị như bản giấy dù không xác định được nguồn gửi."],["D","Chỉ có giá trị nếu hành khách ký xác nhận."]],"a":"A","e":"Giá trị pháp lý đi kèm điều kiện xác thực, toàn vẹn; không phải mọi tệp hoặc ảnh chụp điện tử đều tương đương văn bản giấy. Căn cứ: điểm b khoản 1 Điều 2.","g":"TẠM HOÃN XUẤT CẢNH, CHƯA CHO NHẬP CẢNH"},{"n":65,"q":"Không thực hiện được việc trao đổi qua kết nối điện tử. Quyết định, đề nghị được gửi bằng phương thức thay thế nào?","o":[["A","Bản chụp qua tài khoản nhắn tin cá nhân là đủ."],["B","Thông báo qua điện thoại là đủ."],["C","Bản sao không xác thực qua thư điện tử thông thường là đủ."],["D","Trực tiếp, qua đường công văn hoặc chuyển phát nhanh; phải là bản chính, đầy đủ thông tin và tuân thủ bảo mật."]],"a":"D","e":"Không nhầm cơ chế kết nối dữ liệu điện tử hợp lệ với việc gửi ảnh chụp qua phương tiện cá nhân. Căn cứ: khoản 2 Điều 2.","g":"TẠM HOÃN XUẤT CẢNH, CHƯA CHO NHẬP CẢNH"},{"n":66,"q":"Cơ quan điều tra đăng ký, quản lý trường hợp tạm hoãn xuất cảnh theo Bộ luật Tố tụng hình sự phải dùng biểu mẫu nào?","o":[["A","Bắt buộc dùng M01 cho mọi trường hợp."],["B","Dùng mẫu M02 về chưa cho nhập cảnh."],["C","Dùng quyết định tạm hoãn xuất cảnh và quyết định hủy bỏ biện pháp ngăn chặn theo biểu mẫu tố tụng hình sự."],["D","Tự lập mẫu, chỉ cần đủ họ tên và số hộ chiếu."]],"a":"C","e":"Thông tư không buộc mọi cơ quan, mọi căn cứ tạm hoãn phải dùng chung mẫu M01. Căn cứ: điểm b khoản 1 Điều 3.","g":"TẠM HOÃN XUẤT CẢNH, CHƯA CHO NHẬP CẢNH"},{"n":67,"q":"Cục Quản lý xuất nhập cảnh nhận quyết định tạm hoãn xuất cảnh, nhưng kiểm tra thấy người đó đã xuất cảnh. Cách xử lý được quy định là gì?","o":[["A","Sửa lùi thời gian xuất cảnh để phù hợp quyết định."],["B","Thông báo theo mẫu M05 cho cơ quan, người có thẩm quyền đã ra quyết định."],["C","Không xử lý vì quyết định không còn ý nghĩa."],["D","Tự chuyển quyết định thành chưa cho nhập cảnh."]],"a":"B","e":"Không được tự đổi bản chất quyết định hoặc bỏ qua trách nhiệm phản hồi tình trạng xuất nhập cảnh. Căn cứ: điểm a khoản 1 Điều 5.","g":"TẠM HOÃN XUẤT CẢNH, CHƯA CHO NHẬP CẢNH"},{"n":68,"q":"Đối với quyết định tạm hoãn xuất cảnh, chưa cho nhập cảnh tại khoản 1 Điều 5, nếu người đó chưa xuất cảnh hoặc chưa nhập cảnh, thời điểm cập nhật thông tin là khi nào?","o":[["A","Ngay trong ngày nhận được quyết định."],["B","Trong mọi trường hợp là 24 giờ kể từ khi nhận."],["C","Trong 02 ngày làm việc."],["D","Trong 05 ngày làm việc."]],"a":"A","e":"Phải phân biệt cụm “ngay trong ngày” với mốc “không quá 24 giờ” dành cho nhánh khác. Căn cứ: điểm b khoản 1 Điều 5.","g":"TẠM HOÃN XUẤT CẢNH, CHƯA CHO NHẬP CẢNH"},{"n":69,"q":"Cục Quản lý xuất nhập cảnh nhận quyết định gia hạn, hủy bỏ, giải tỏa tạm hoãn xuất cảnh hoặc giải tỏa chưa cho nhập cảnh. Thời điểm cập nhật và thông báo là khi nào?","o":[["A","Sau khi có đề nghị của hành khách."],["B","Trong 03 ngày làm việc."],["C","Ngay trong ngày nhận được quyết định."],["D","Chỉ khi người đó đến cửa khẩu làm thủ tục."]],"a":"C","e":"Quyết định giải tỏa, hủy bỏ cũng phải được cập nhật kịp thời; không chờ đương sự xuất hiện. Căn cứ: khoản 2 Điều 5.","g":"TẠM HOÃN XUẤT CẢNH, CHƯA CHO NHẬP CẢNH"},{"n":70,"q":"Đối với văn bản đề nghị Bộ trưởng Bộ Công an ra quyết định tạm hoãn xuất cảnh, thời hạn Cục trưởng Cục Quản lý xuất nhập cảnh báo cáo Bộ trưởng xem xét quyết định là bao lâu?","o":[["A","Không quá 24 giờ."],["B","Không quá 05 ngày làm việc."],["C","Ngay trong ngày trong mọi trường hợp."],["D","Không quá 02 ngày làm việc."]],"a":"D","e":"Đây là thời hạn báo cáo xem xét quyết định, không phải thời hạn cập nhật quyết định đã nhận. Căn cứ: điểm a khoản 3 Điều 5.","g":"TẠM HOÃN XUẤT CẢNH, CHƯA CHO NHẬP CẢNH"},{"n":71,"q":"Trong nhánh quy định tại khoản 3 Điều 5, sau khi nhận quyết định tạm hoãn xuất cảnh của Bộ trưởng Bộ Công an, thời hạn cập nhật và thông báo là bao lâu?","o":[["A","Không quá 02 ngày làm việc."],["B","Không quá 03 ngày làm việc."],["C","Không quá 24 giờ kể từ khi nhận được quyết định."],["D","Chờ bản giấy đến cửa khẩu mới cập nhật."]],"a":"C","e":"Không lấy mốc 02 ngày làm việc của khâu đề xuất để áp dụng cho khâu cập nhật quyết định. Căn cứ: điểm b khoản 3 Điều 5.","g":"TẠM HOÃN XUẤT CẢNH, CHƯA CHO NHẬP CẢNH"},{"n":72,"q":"Đơn vị kiểm soát xuất nhập cảnh phát hiện người có nghĩa vụ chấp hành quyết định tạm hoãn xuất cảnh, chưa cho nhập cảnh. Trách nhiệm thông báo nào đúng?","o":[["A","Thông báo ngay kết quả thực hiện về Cục Quản lý xuất nhập cảnh; thông báo cơ quan, người ra quyết định để phối hợp xử lý nếu có yêu cầu."],["B","Chỉ thông báo hãng hàng không."],["C","Chờ kết thúc ca mới báo cáo tổng hợp."],["D","Chỉ thông báo cơ quan ra quyết định, không cần báo Cục Quản lý xuất nhập cảnh."]],"a":"A","e":"Quy trình yêu cầu thông tin về Cục để thống nhất quản lý, không chỉ trao đổi riêng giữa cửa khẩu và cơ quan đề nghị. Căn cứ: khoản 4 Điều 5.","g":"TẠM HOÃN XUẤT CẢNH, CHƯA CHO NHẬP CẢNH"},{"n":73,"q":"Khi kiểm tra quyết định, đề nghị, Cục Quản lý xuất nhập cảnh thấy chưa đúng thẩm quyền hoặc thông tin chưa đầy đủ. Cách xử lý được quy định là gì?","o":[["A","Tự sửa thẩm quyền và bổ sung dữ liệu còn thiếu."],["B","Yêu cầu bổ sung ngay trong ngày nhận được quyết định, đề nghị."],["C","Vẫn thực hiện trước, yêu cầu bổ sung sau 07 ngày."],["D","Không cần phản hồi cho cơ quan gửi."]],"a":"B","e":"Việc kiểm tra thẩm quyền, nội dung, hình thức là bước bắt buộc; không tự hợp thức hóa thay cơ quan gửi. Căn cứ: khoản 2 Điều 6.","g":"TẠM HOÃN XUẤT CẢNH, CHƯA CHO NHẬP CẢNH"},{"n":74,"q":"Quyết định tạm hoãn xuất cảnh hoặc chưa cho nhập cảnh được ban hành trước ngày Thông tư 71 có hiệu lực được xử lý thế nào?","o":[["A","Tự động hết hiệu lực khi Thông tư mới có hiệu lực."],["B","Chỉ có giá trị sau khi cơ quan ban hành đổi sang mẫu mới."],["C","Phải tạm dừng thực hiện 30 ngày để chuyển đổi."],["D","Vẫn còn hiệu lực cho đến khi hết thời hạn của quyết định theo điều khoản chuyển tiếp."]],"a":"D","e":"Văn bản hướng dẫn mới không tự động làm mất hiệu lực của mọi quyết định đã ban hành trước đó. Căn cứ: khoản 2 Điều 8.","g":"TẠM HOÃN XUẤT CẢNH, CHƯA CHO NHẬP CẢNH"},{"n":75,"q":"Kiểm soát xuất nhập cảnh là:","o":[["A","Kiểm tra, giám sát, kiểm chứng người và giấy tờ xuất nhập cảnh theo quy định của pháp luật Việt Nam"],["B","Kiểm tra hộ chiếu và giấy tờ của hành khách khi họ xuất cảnh, nhập cảnh Việt Nam"],["C","Kiểm tra hộ chiếu, thị thực của khách để xác định có phải đối tượng chưa cho nhập cảnh hoặc tạm hoãn xuất cảnh"]],"a":"A","e":"","g":"TẠM HOÃN XUẤT CẢNH, CHƯA CHO NHẬP CẢNH"},{"n":76,"q":"Giấy tờ xuất nhập cảnh bao gồm:","o":[["A","Hộ chiếu phổ thông"],["B","Hộ chiếu ngoại giao, hộ chiếu công vụ, hộ chiếu phổ thông, giấy thông hành"],["C","Tất cả các loại hộ chiếu"]],"a":"B","e":"","g":"TẠM HOÃN XUẤT CẢNH, CHƯA CHO NHẬP CẢNH"},{"n":77,"q":"Quy định về đóng dấu kiểm chứng XNC:","o":[["A","Đóng vào bất kỳ trang trống, thuận tiện"],["B","Đóng dấu từ trang hộ chiếu nhỏ đến lớn, từ trái sang phải, từ trên xuống dưới, không đóng dấu vào trang bị chú"],["C","Đóng vào các trang có ghi chữ VISAS đầu trang"]],"a":"B","e":"","g":"TẠM HOÃN XUẤT CẢNH, CHƯA CHO NHẬP CẢNH"},{"n":78,"q":"Trách nhiệm của Kiểm soát viên trong quản lý dấu kiểm chứng XNC:","o":[["A","Khi có việc ra khỏi bục kiểm soát phải mang dấu theo để bảo quản"],["B","Nhờ người khác nhận thay dấu khi kẹt xe đến trễ và tự mình phải trả dấu"],["C","Trực tiếp nhận, trả dấu trong ca công tác; không được tự ý mang dấu ra khỏi bục kiểm soát"]],"a":"C","e":"","g":"TẠM HOÃN XUẤT CẢNH, CHƯA CHO NHẬP CẢNH"},{"n":79,"q":"Luật nhập cảnh, xuất cảnh, quá cảnh, cư trú của người nước ngoài tại Việt Nam quy định thị thực có bao nhiêu ký hiệu:","o":[["A","19"],["B","21"],["C","23"]],"a":"B","e":"","g":"TẠM HOÃN XUẤT CẢNH, CHƯA CHO NHẬP CẢNH"},{"n":80,"q":"Thời hạn của thị thực ký hiệu DL:","o":[["A","30 ngày"],["B","Tối đa không quá 90 ngày"],["C","Tùy theo nhu cầu lưu trú của khách"]],"a":"B","e":"","g":"TẠM HOÃN XUẤT CẢNH, CHƯA CHO NHẬP CẢNH"},{"n":81,"q":"Thời hạn thị thực ngắn hơn thời hạn hộ chiếu hoặc giấy tờ có giá trị đi lại quốc tế bao nhiêu ngày:","o":[["A","Tối thiểu bằng thời hạn hộ chiếu"],["B","Ít nhất 30 ngày"],["C","Tối thiểu 3 tháng"]],"a":"B","e":"","g":"TẠM HOÃN XUẤT CẢNH, CHƯA CHO NHẬP CẢNH"},{"n":82,"q":"Điều kiện nhập cảnh của người nước ngoài:","o":[["A","Có hộ chiếu và thị thực Việt Nam"],["B","Có hộ chiếu hoặc giấy tờ có giá trị đi lại quốc tế và thị thực"],["C","Có hộ chiếu hoặc giấy tờ có giá trị đi lại quốc tế và thị thực (trừ trường hợp được miễn thị thực); không thuộc trường hợp chưa cho nhập cảnh"]],"a":"C","e":"","g":"TẠM HOÃN XUẤT CẢNH, CHƯA CHO NHẬP CẢNH"},{"n":83,"q":"Người nước ngoài nhập cảnh theo diện đơn phương miễn thị thực thì hộ chiếu phải còn thời hạn sử dụng:","o":[["A","Ít nhất 06 tháng"],["B","Ít nhất 03 tháng"],["C","Ít nhất 01 tháng"]],"a":"A","e":"","g":"TẠM HOÃN XUẤT CẢNH, CHƯA CHO NHẬP CẢNH"},{"n":84,"q":"Người nước ngoài mang hộ chiếu của nước mà Việt Nam đơn phương miễn thị thực nếu hộ chiếu còn thời hạn dưới 06 tháng:","o":[["A","Vẫn được nhập cảnh nếu cam kết xuất cảnh trước khi hộ chiếu hết hạn"],["B","Không được nhập cảnh Việt Nam, trả lại theo hành trình"],["C","Được nhập cảnh nếu có thị thực còn giá trị"]],"a":"C","e":"","g":"TẠM HOÃN XUẤT CẢNH, CHƯA CHO NHẬP CẢNH"},{"n":85,"q":"Điều kiện xuất cảnh của người nước ngoài:","o":[["A","Có hộ chiếu hoặc giấy tờ có giá trị đi lại quốc tế; chứng nhận tạm trú, thẻ tạm trú hoặc thẻ thường trú còn giá trị; không thuộc trường hợp bị tạm hoãn xuất cảnh"],["B","Có hộ chiếu hoặc giấy tờ có giá trị đi lại quốc tế; chứng nhận tạm trú, thẻ tạm trú hoặc thẻ thường trú còn giá trị"],["C","Nếu họ có hộ chiếu hoặc giấy tờ có giá trị đi lại quốc tế và không thuộc trường hợp bị tạm hoãn xuất cảnh"]],"a":"A","e":"","g":"TẠM HOÃN XUẤT CẢNH, CHƯA CHO NHẬP CẢNH"},{"n":86,"q":"Người nước ngoài quá cảnh khi có các điều kiện sau:","o":[["A","Chỉ cần hộ chiếu và vé đi nước thứ 3"],["B","Có hộ chiếu, vé đi nước thứ 3 và thị thực của nước thứ 3"],["C","Hộ chiếu hoặc giấy tờ có giá trị đi lại quốc tế; vé phương tiện phù hợp với hành trình đi nước thứ ba; thị thực của nước thứ ba, trừ trường hợp được miễn thị thực."]],"a":"C","e":"","g":"TẠM HOÃN XUẤT CẢNH, CHƯA CHO NHẬP CẢNH"},{"n":87,"q":"Điều kiện xuất cảnh của công dân Việt Nam:","o":[["A","Có hộ chiếu, thị thực của nước đến"],["B","Có giấy tờ xuất nhập cảnh còn nguyên vẹn, còn thời hạn sử dụng; có thị thực hoặc giấy tờ xác nhận, chứng minh được nước đến cho nhập cảnh, trừ trường hợp được miễn thị thực"],["C","Có giấy tờ xuất nhập cảnh còn nguyên vẹn, còn thời hạn sử dụng; có thị thực hoặc giấy tờ xác nhận, chứng minh được nước đến cho nhập cảnh, trừ trường hợp được miễn thị thực; không thuộc trường hợp tạm hoãn xuất cảnh theo quy định của pháp luật."]],"a":"C","e":"","g":"TẠM HOÃN XUẤT CẢNH, CHƯA CHO NHẬP CẢNH"},{"n":88,"q":"Điều kiện nhập cảnh của công dân Việt Nam:","o":[["A","Có hộ chiếu Việt Nam"],["B","Có giấy tờ xuất nhập cảnh còn nguyên vẹn, còn thời hạn sử dụng"],["C","Có căn cước công dân hoặc giấy khai sinh"]],"a":"B","e":"","g":"TẠM HOÃN XUẤT CẢNH, CHƯA CHO NHẬP CẢNH"},{"n":89,"q":"Sau khi nhập thông tin nhân sự của khách vào máy tính bằng cách sử dụng máy đọc hộ chiếu, nếu các trường dữ liệu đã được điền đầy đủ, bước tiếp theo, kiểm soát viên:","o":[["A","Bấm tổ hợp phím Alt + K để hệ thống máy tính kiểm tra thông tin của khách"],["B","Yêu cầu khách xuất trình Căn cước công dân, ID card để kiểm tra"],["C","Kiểm tra, đối chiếu để xác định sự đồng nhất các thông tin nhân thân trong hộ chiếu với thông tin trên màn hình máy tính"]],"a":"C","e":"","g":"TẠM HOÃN XUẤT CẢNH, CHƯA CHO NHẬP CẢNH"},{"n":90,"q":"Các Quốc gia trong khối ASEAN khi nhập cảnh Việt Nam được miễn thị thực nhập cảnh bao nhiêu ngày:","o":[["A","30 ngày"],["B","Số ngày tùy theo Hiệp định song phương được ký kết với mỗi quốc gia"],["C","21 ngày"]],"a":"B","e":"","g":"TẠM HOÃN XUẤT CẢNH, CHƯA CHO NHẬP CẢNH"},{"n":91,"q":"Công dân Trung Quốc, sử dụng thẻ thường trú nhân của Mỹ đã được cơ quan đại diện ngoại giao của Việt Nam cấp giấy miễn thị thực theo thẻ thường trú nhân, khi nhập cảnh Việt Nam:","o":[["A","Được cấp chứng nhận tạm trú 180 ngày theo quy định"],["B","Không giải quyết nhập cảnh theo thẻ thường trú nhân và giấy miễn thị thực."],["C","Cấp chứng nhận tạm trú phù hợp với thời gian cư trú của hành khách"]],"a":"B","e":"","g":"TẠM HOÃN XUẤT CẢNH, CHƯA CHO NHẬP CẢNH"},{"n":92,"q":"Theo Nghị quyết 44/NQ-CP ngày 07/3/2025 của Chính phủ, công dân 12 nước nào được miễn thị thực nhập cảnh Việt Nam với thời hạn tạm trú đến 45 ngày:","o":[["A","Đức, Pháp, Ý, Tây Ban Nha, Anh, Nga, Nhật Bản, Hàn Quốc, Đan Mạch, Thụy Điển, Na-Uy và Thái Lan"],["B","Đức, Pháp, Ý, Tây Ban Nha, Anh, Nga, Nhật Bản, Hàn Quốc, Đan Mạch, Thụy Điển, Na-Uy và Phần Lan"],["C","Đức, Pháp, Ý, Tây Ban Nha, Anh, Nga, Nhật Bản, Hàn Quốc, Đan Mạch, Thụy Điển, Thụy Sĩ và Phần Lan"]],"a":"B","e":"","g":"TẠM HOÃN XUẤT CẢNH, CHƯA CHO NHẬP CẢNH"},{"n":93,"q":"Đối với khách sử dụng thị thực điện tử nhập cảnh, kiểm soát viên đóng dấu kiểm chứng vào:","o":[["A","Bản in thị thực điện tử của khách xuất trình"],["B","Hộ chiếu của khách (trừ hộ chiếu Trung Quốc)"],["C","Yêu cầu khách liên hệ Đội Tổng hợp cấp visa giấy"]],"a":"B","e":"","g":"TẠM HOÃN XUẤT CẢNH, CHƯA CHO NHẬP CẢNH"},{"n":94,"q":"Khi kiểm soát một hành khách XNC, kiểm soát viên cần:","o":[["A","Thực hiện đầy đủ các bước của quy trình kiểm soát theo quy định"],["B","Thực hiện đầy đủ các bước của quy trình kiểm soát theo quy định, kết hợp kiểm tra danh sách đối tượng nóng tại bục (nếu có)"],["C","Thực hiện đầy đủ các bước của quy trình kiểm soát theo quy định, kết hợp kiểm tra danh sách đối tượng nóng tại bục (nếu có) và theo yêu cầu công tác nghiệp vụ tại từng thời điểm đối với một số đối tượng cụ thể"]],"a":"C","e":"","g":"TẠM HOÃN XUẤT CẢNH, CHƯA CHO NHẬP CẢNH"},{"n":95,"q":"Người nước ngoài mang hộ chiếu của nước được Việt Nam đơn phương miễn thị thực, khi khách nhập cảnh, kiểm soát viên cấp chứng nhận tạm trú:","o":[["A","45 ngày kể từ ngày nhập cảnh"],["B","Theo thời hạn của quy định miễn thị thực đơn phương đối với nước đó"],["C","Theo thời hạn của thẻ tạm trú, thẻ thường trú, giấy miễn thị thực, thị thực… mà họ được cơ quan có thẩm quyền của Việt Nam cấp còn giá trị."]],"a":"C","e":"","g":"TẠM HOÃN XUẤT CẢNH, CHƯA CHO NHẬP CẢNH"},{"n":96,"q":"Giám sát 1 tại khu nhập cảnh, xuất cảnh có nhiệm vụ:","o":[["A","Hướng dẫn, điều tiết khách xếp hàng trật tự trước các bục kiểm soát; giám sát người ra vào khu vụ kiểm soát XNC; hỗ trợ người cao tuổi, trẻ em nhỏ, phụ nữ mang thai, người khuyết tật; không được chỉ dẫn những điều cần thiết khi khách đề nghị hoặc thắc mắc"],["B","Hướng dẫn, điều tiết khách xếp hàng trật tự trước các bục kiểm soát; giám sát người ra vào khu vụ kiểm soát XNC; hỗ trợ người cao tuổi, trẻ em nhỏ, phụ nữ mang thai, người khuyết tật; chỉ dẫn những điều cần thiết khi khách đề nghị hoặc thắc mắc"],["C","Hướng dẫn, điều tiết khách xếp hàng trật tự trước các bục kiểm soát; có quyền cho người ra vào khu vụ kiểm soát XNC; hỗ trợ người cao tuổi, trẻ em nhỏ, phụ nữ mang thai, người khuyết tật; chỉ dẫn những điều cần thiết khi khách đề nghị hoặc thắc mắc"]],"a":"B","e":"","g":"TẠM HOÃN XUẤT CẢNH, CHƯA CHO NHẬP CẢNH"},{"n":97,"q":"Nhiệm vụ của Giám sát 5:","o":[["A","Kiểm soát người đủ điều kiện ra vào khu vực cách ly XNC; kịp thời phát hiện, xử lý người vi phạm quy định ra vào khu vực cách ly XNC;"],["B","Kiểm soát người đủ điều kiện ra vào khu vực cách ly XNC; kịp thời phát hiện, xử lý người vi phạm quy định ra vào khu vực cách ly XNC; chỉ được phép giải quyết cho người không đủ điều kiện ra vào khu vực nếu có quen biết."],["C","Kiểm soát người đủ điều kiện ra vào khu vực cách ly XNC; kịp thời phát hiện, xử lý người vi phạm quy định ra vào khu vực cách ly XNC; nếu khách đã hoàn tất thủ tục xuất cảnh, có việc quay ra ngoài thì giữ hộ chiếu khách, giải quyết cho ra ngoài và yêu cầu quy lại sớm."]],"a":"A","e":"","g":"TẠM HOÃN XUẤT CẢNH, CHƯA CHO NHẬP CẢNH"},{"n":98,"q":"Trong quá trình kiểm soát khách XNC nếu phát hiện \"đối tượng nóng\" (có danh sách tại bục) làm thủ tục XNC, kiểm soát viên sẽ:","o":[["A","Trả hộ chiếu cho đương sự, không giải quyết thủ tục, yêu cầu liên hệ Đội Tổng hợp để giải quyết"],["B","Hô to lên để mọi người cùng chú ý và nhanh chóng khống chế đương sự"],["C","Khéo léo, mưu trí thực hiện theo yêu cầu phối hợp xử lý khi phát hiện đối tượng, đáp ứng yêu cầu nghiệp vụ"]],"a":"C","e":"","g":"TẠM HOÃN XUẤT CẢNH, CHƯA CHO NHẬP CẢNH"},{"n":99,"q":"Khi nhận ca công tác tại bục kiểm soát, kiểm soát viên:","o":[["A","Chào giao ca, đóng bục kiểm soát, ghi sổ tình hình, sắp xếp đồ dùng cá nhân mang theo, đăng nhập hệ thống máy tính kiểm soát XNC"],["B","Chào giao ca, thong thả trao đổi tình hình với cán bộ ca trước, kiểm tra danh sách đối tượng nóng, sổ ghi tình hình và vệ sinh tại bục công tác, đăng nhập hệ thống máy tính kiểm soát XNC và thực hiện công tác kiểm soát XNC"],["C","Chào giao ca, nhanh chóng trao đổi tình hình với cán bộ ca trước, kiểm tra danh sách đối tượng nóng, sổ ghi tình hình và vệ sinh tại bục công tác, đăng nhập hệ thống máy tính kiểm soát XNC và thực hiện công tác kiểm soát XNC"]],"a":"C","e":"","g":"TẠM HOÃN XUẤT CẢNH, CHƯA CHO NHẬP CẢNH"},{"n":100,"q":"Theo quy định của Luật Xuất cảnh, nhập cảnh của công dân Việt Nam, thời hạn của hộ chiếu phổ thông cấp cho người từ đủ 14 tuổi trở lên là bao nhiêu năm?","o":[["A","05 năm và không được gia hạn"],["B","05 năm và được gia hạn 01 lần"],["C","10 năm và không được gia hạn"],["D","10 năm và được gia hạn 01 lần"]],"a":"C","e":"","g":"CÂU HỎI BỔ SUNG VỀ PHÁP LUẬT XUẤT NHẬP CẢNH"},{"n":101,"q":"Hộ chiếu phổ thông cấp cho người chưa đủ 14 tuổi có thời hạn tối đa là bao nhiêu năm?","o":[["A","02 năm"],["B","03 năm"],["C","05 năm"],["D","10 năm"]],"a":"C","e":"","g":"CÂU HỎI BỔ SUNG VỀ PHÁP LUẬT XUẤT NHẬP CẢNH"},{"n":102,"q":"Giấy tờ nào sau đây KHÔNG thuộc danh mục giấy tờ xuất nhập cảnh của công dân Việt Nam?","o":[["A","Hộ chiếu ngoại giao"],["B","Hộ chiếu công vụ"],["C","Giấy thông hành"],["D","Thẻ thường trú"]],"a":"D","e":"","g":"CÂU HỎI BỔ SUNG VỀ PHÁP LUẬT XUẤT NHẬP CẢNH"},{"n":103,"q":"Công dân Việt Na
