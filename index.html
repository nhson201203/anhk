HỎI BỔ SUNG VỀ PHÁP LUẬT XUẤT NHẬP CẢNH"},{"n":109,"q":"Thị thực ký hiệu \"LD2\" cấp cho người nước ngoài thuộc đối tượng nào?","o":[["A","Người nước ngoài làm việc tại Việt Nam thuộc diện không phải cấp giấy phép lao động"],["B","Người nước ngoài vào làm việc tại Việt Nam phải có giấy phép lao động"],["C","Luật sư nước ngoài hành nghề tại Việt Nam"],["D","Phóng viên nước ngoài thường trú tại Việt Nam"]],"a":"B","e":"","g":"CÂU HỎI BỔ SUNG VỀ PHÁP LUẬT XUẤT NHẬP CẢNH"},{"n":110,"q":"Thẻ tạm trú cấp cho người nước ngoài thuộc diện ký hiệu \"ĐT1\" có thời hạn tối đa không quá bao nhiêu năm?","o":[["A","03 năm"],["B","05 năm"],["C","10 năm"],["D","15 năm"]],"a":"C","e":"","g":"CÂU HỎI BỔ SUNG VỀ PHÁP LUẬT XUẤT NHẬP CẢNH"},{"n":111,"q":"Điều kiện để người nước ngoài được xem xét cấp thẻ thường trú tại Việt Nam là gì?","o":[["A","Đã tạm trú liên tục tại Việt Nam từ 01 năm trở lên"],["B","Đã tạm trú liên tục tại Việt Nam từ 03 năm trở lên và có chỗ ở hợp pháp, thu nhập ổn định"],["C","Có nhà ở tại Việt Nam"],["D","Đã kết hôn với công dân Việt Nam dưới 01 năm"]],"a":"B","e":"","g":"CÂU HỎI BỔ SUNG VỀ PHÁP LUẬT XUẤT NHẬP CẢNH"},{"n":112,"q":"Người nước ngoài nhập cảnh theo diện đơn phương miễn thị thực được cấp chứng nhận tạm trú tại cửa khẩu với thời hạn bao nhiêu ngày?","o":[["A","15 ngày"],["B","30 ngày"],["C","45 ngày"],["D","90 ngày"]],"a":"C","e":"","g":"CÂU HỎI BỔ SUNG VỀ PHÁP LUẬT XUẤT NHẬP CẢNH"},{"n":113,"q":"Cơ quan nào có thẩm quyền quyết định tạm hoãn xuất cảnh đối với người nước ngoài đang cư trú tại Việt Nam theo yêu cầu của cơ quan điều tra?","o":[["A","Bộ trưởng Bộ Công an"],["B","Thủ trưởng cơ quan điều tra các cấp"],["C","Tòa án nhân dân tối cao"],["D","Viện trưởng Viện kiểm sát nhân dân tối cao"]],"a":"A","e":"","g":"CÂU HỎI BỔ SUNG VỀ PHÁP LUẬT XUẤT NHẬP CẢNH"},{"n":114,"q":"Người nước ngoài bị buộc rời khỏi lãnh thổ Việt Nam thông qua hình thức nào sau đây?","o":[["A","Trục xuất hoặc buộc xuất cảnh"],["B","Tự nguyện đăng ký chuyển đi"],["C","Cách ly bắt buộc"],["D","Tạm hoãn cư trú"]],"a":"A","e":"","g":"CÂU HỎI BỔ SUNG VỀ PHÁP LUẬT XUẤT NHẬP CẢNH"},{"n":115,"q":"Cơ quan, tổ chức, cá nhân trực tiếp quản lý, điều hành cơ sở lưu trú có trách nhiệm làm gì khi có người nước ngoài đến lưu trú?","o":[["A","Thu giữ hộ chiếu của người nước ngoài"],["B","Khai báo tạm trú cho người nước ngoài qua Hệ thống thông tin khai báo tạm trú hoặc Công an xã/phường/thị trấn"],["C","Đưa người nước ngoài đến trình diện Công an tỉnh"],["D","Cấp giấy xác nhận lưu trú cho người nước ngoài"]],"a":"B","e":"","g":"CÂU HỎI BỔ SUNG VỀ PHÁP LUẬT XUẤT NHẬP CẢNH"},{"n":116,"q":"Thị thực (Visa) cấp cho người nước ngoài có giá trị sử dụng như thế nào?","o":[["A","Được chuyển đổi mục đích sử dụng trong mọi trường hợp"],["B","Có giá trị một lần hoặc nhiều lần và không được chuyển đổi mục đích, trừ các trường hợp luật định"],["C","Luôn luôn có giá trị nhiều lần"],["D","Do người nước ngoài tự quyết định thời hạn khi nhập cảnh"]],"a":"B","e":"","g":"CÂU HỎI BỔ SUNG VỀ PHÁP LUẬT XUẤT NHẬP CẢNH"},{"n":117,"q":"Người nước ngoài tạm trú tại Việt Nam phải thông qua cơ quan, tổ chức, cá nhân mời, bảo lãnh để làm thủ tục đề nghị cấp thị thực, gia hạn tạm trú tại cơ quan nào?","o":[["A","Cơ quan Quản lý xuất nhập cảnh Công an cấp tỉnh hoặc Cục Quản lý xuất nhập cảnh"],["B","UBND cấp huyện nơi tạm trú"],["C","Bộ Ngoại giao"],["D","Sở Lao động - Thương binh và Xã hội"]],"a":"A","e":"","g":"CÂU HỎI BỔ SUNG VỀ PHÁP LUẬT XUẤT NHẬP CẢNH"},{"n":118,"q":"Hộ chiếu của công dân Việt Nam bị hỏng hoặc bị mất thì phải làm thủ tục báo mất trong thời hạn bao lâu kể từ khi phát hiện?","o":[["A","24 giờ"],["B","48 giờ"],["C","72 giờ"],["D","05 ngày"]],"a":"B","e":"","g":"CÂU HỎI BỔ SUNG VỀ PHÁP LUẬT XUẤT NHẬP CẢNH"},{"n":119,"q":"Trách nhiệm hủy giá trị sử dụng hộ chiếu còn thời hạn đối với người bị mất hộ chiếu thuộc thẩm quyền của cơ quan nào?","o":[["A","Cơ quan Quản lý xuất nhập cảnh Bộ Công an hoặc Cơ quan đại diện Việt Nam ở nước ngoài"],["B","UBND cấp xã nơi thường trú"],["C","Công an huyện nơi cư trú"],["D","Tòa án nhân dân cấp tỉnh"]],"a":"A","e":"","g":"CÂU HỎI BỔ SUNG VỀ PHÁP LUẬT XUẤT NHẬP CẢNH"}]},{"id":"tlxnc","name":"Xử lý tình huống XNC","open":false,"qs":[{"n":1,"q":"Ông John (quốc tịch Mỹ) muốn nhập cảnh vào Việt Nam bằng thị thực điện tử (E-visa) để đi du lịch và kết hợp khảo sát thị trường trong vòng 2,5 tháng. Theo Luật số 23/2023/QH15, thời hạn tối đa của E-visa mà ông John có thể được cấp là bao lâu và có được xuất nhập cảnh nhiều lần không?","o":[["A","30 ngày, chỉ được nhập cảnh 1 lần."],["B","90 ngày, chỉ được nhập cảnh 1 lần."],["C","90 ngày, được giá trị nhập cảnh một lần hoặc nhiều lần."],["D","60 ngày, được nhập cảnh nhiều lần."]],"a":"C","e":"Theo Khoản 2 Điều 2 Luật số 23/2023/QH15 (sửa đổi Điều 9 của Luật số 47/2014/QH13), thị thực điện tử có giá trị nhiều lần hoặc một lần, thời hạn của thị thực điện tử tăng từ tối đa 30 ngày lên không quá 90 ngày.","g":""},{"n":2,"q":"Chị Tanaka (quốc tịch Nhật Bản) nhập cảnh Việt Nam theo diện đơn phương miễn thị thực để du lịch ngắn ngày. Theo quy định mới nhất, chị Tanaka được tạm trú tại Việt Nam trong thời gian bao lâu kể từ ngày nhập cảnh?","o":[["A","15 ngày"],["B","30 ngày"],["C","45 ngày"],["D","90 ngày"]],"a":"C","e":"Theo Khoản 7 Điều 2 Luật số 23/2023/QH15 (sửa đổi Điều 31 của Luật số 47/2014/QH13), công dân của nước được Việt Nam đơn phương miễn thị thực thì được quyết định thời hạn tạm trú 45 ngày (quy định cũ là 15 ngày) và được xem xét cấp thị thực, gia hạn tạm trú theo quy định.","g":""},{"n":3,"q":"Anh Minh (25 tuổi, công dân Việt Nam) làm thủ tục cấp hộ chiếu phổ thông lần đầu để đi du lịch nước ngoài. Theo quy định, thời hạn của hộ chiếu phổ thông cấp cho anh Minh là bao lâu?","o":[["A","5 năm"],["B","10 năm"],["C","2 năm"],["D","Vô thời hạn"]],"a":"B","e":"Theo Khoản 1 Điều 7 Luật số 49/2019/QH14, hộ chiếu phổ thông cấp cho người từ đủ 14 tuổi trở lên có thời hạn 10 năm và không được gia hạn.","g":""},{"n":4,"q":"Chị Hoa muốn làm hộ chiếu phổ thông cho con trai mình hiện nay mới 10 tuổi để cháu đi du học hè. Thời hạn của hộ chiếu cấp cho cháu bé là bao lâu?","o":[["A","5 năm"],["B","10 năm"],["C","3 năm"],["D","Cùng thời hạn với hộ chiếu của mẹ"]],"a":"A","e":"Theo Khoản 2 Điều 7 Luật số 49/2019/QH14, hộ chiếu phổ thông cấp cho người chưa đủ 14 tuổi có thời hạn 5 năm và không được gia hạn.","g":""},{"n":5,"q":"Một khách sạn tại Thành phố Hồ Chí Minh tiếp nhận một khách du lịch người Pháp đến lưu trú lúc 21h00. Khách sạn phải thực hiện việc khai báo tạm trú cho người nước ngoài này trong thời hạn bao lâu kể từ khi khách đến?","o":[["A","Trong vòng 12 giờ"],["B","Trong vòng 24 giờ"],["C","Trong vòng 48 giờ"],["D","Ngay lập tức trước khi khách nhận phòng"]],"a":"B","e":"Theo Khoản 1 Điều 33 Luật số 47/2014/QH13, người trực tiếp quản lý, điều hành hoạt động của cơ sở lưu trú có trách nhiệm ghi đầy đủ nội dung thông tin khai báo tạm trú của người nước ngoài và chuyển đến Công an xã, phường, thị trấn hoặc đồn, trạm Công an nơi có cơ sở lưu trú trong thời hạn 24 giờ kể từ khi người nước ngoài đến lưu trú.","g":""},{"n":6,"q":"Anh Nam đang ở nước ngoài thì bị mất hộ chiếu phổ thông nhưng cần phải về nước ngay lập tức do có việc gia đình đột xuất. Cơ quan đại diện Việt Nam ở nước ngoài có thể cấp loại giấy tờ nào sau đây theo thủ tục rút gọn cho anh Nam?","o":[["A","Cấp lại hộ chiếu phổ thông thời hạn 10 năm."],["B","Cấp hộ chiếu phổ thông có thời hạn không quá 12 tháng."],["C","Cấp giấy thông hành."],["D","Cấp thị thực nhập cảnh."]],"a":"B","e":"Theo Khoản 4 Điều 7 và Điều 17 Luật số 49/2019/QH14, đối với người bị mất hộ chiếu ở nước ngoài có nhu cầu về nước ngay, cơ quan đại diện Việt Nam tại nước ngoài sẽ thực hiện cấp hộ chiếu phổ thông theo thủ tục rút gọn, thời hạn không quá 12 tháng và không được gia hạn.","g":""},{"n":7,"q":"Một người nước ngoài nhập cảnh vào Việt Nam bằng thị thực du lịch (ký hiệu DL) có thời hạn 3 tháng. Sau khi vào Việt Nam, người này tìm được việc làm và muốn chuyển đổi sang thị thực lao động (ký hiệu LĐ) để ở lại làm việc lâu dài mà không muốn xuất cảnh khỏi Việt Nam. Trường hợp này có được phép chuyển đổi mục đích thị thực không?","o":[["A","Tuyệt đối không được chuyển đổi mục đích trong mọi trường hợp."],["B","Được chuyển đổi nếu có hợp đồng lao động và văn bản xác nhận của cơ quan, tổ chức mời, bảo lãnh."],["C","Được chuyển đổi nhưng phải đóng phạt hành chính."],["D","Chỉ được chuyển đổi nếu có thẻ tạm trú cũ."]],"a":"B","e":"Theo Khoản 2 Điều 1 Luật số 23/2023/QH15 và Luật số 47, thị thực không được chuyển đổi mục đích, trừ các trường hợp cụ thể như: Có giấy tờ chứng minh là nhà đầu tư; Có giấy tờ chứng minh quan hệ là cha, mẹ, vợ, chồng, con với người mời, bảo lãnh; Được cơ quan, tổ chức mời, bảo lãnh vào làm việc và có giấy phép lao động hoặc xác nhận không thuộc diện cấp giấy phép lao động.","g":""},{"n":8,"q":"Công ty A tại Việt Nam muốn mời ông Smith (chuyên gia nước ngoài) vào làm việc. Công ty A cần thực hiện thủ tục gì trước khi ông Smith nhập cảnh?","o":[["A","Chờ ông Smith tự xin visa du lịch rồi đến công ty làm việc."],["B","Gửi văn bản đề nghị cấp thị thực tại cơ quan quản lý xuất nhập cảnh (Cục Quản lý xuất nhập cảnh)."],["C","Trực tiếp cấp giấy phép nhập cảnh cho ông Smith."],["D","Báo cáo Ủy ban nhân dân cấp tỉnh để xin phép."]],"a":"B","e":"Theo Điều 16 Luật số 47/2014/QH13, cơ quan, tổ chức, cá nhân mời, bảo lãnh người nước ngoài trực tiếp gửi văn bản đề nghị cấp thị thực tại cơ quan quản lý xuất nhập cảnh trước khi người nước ngoài nhập cảnh.","g":""},{"n":9,"q":"Cơ quan quản lý xuất nhập cảnh có quyền từ chối cấp hộ chiếu phổ thông cho công dân Việt Nam trong trường hợp nào sau đây?","o":[["A","Người đang có nghĩa vụ chấp hành bản án dân sự, kinh tế."],["B","Người đang thất nghiệp không có thu nhập ổn định."],["C","Người chưa từng đi ra nước ngoài bao giờ."],["D","Người thuộc diện hộ nghèo."]],"a":"A","e":"Theo Điều 21 Luật số 49/2019/QH14, các trường hợp chưa được cấp giấy tờ xuất nhập cảnh bao gồm: Người nợ án phí, tiền phạt; Người đang có nghĩa vụ chấp hành bản án, quyết định dân sự, kinh tế; Người đang bị khởi tố, người chuẩn bị bị khởi tố...","g":""},{"n":10,"q":"Ông David là người nước ngoài đang tạm trú tại Việt Nam. Do vi phạm nghiêm trọng pháp luật Việt Nam, ông David bị cơ quan có thẩm quyền ra quyết định buộc xuất cảnh. Cơ quan nào có thẩm quyền gia hạn tạm trú hoặc quyết định cưỡng chế xuất cảnh trong trường hợp này?","o":[["A","Bộ Ngoại giao."],["B","Cơ quan quản lý xuất nhập cảnh hoặc cơ quan có thẩm quyền của Bộ Công an."],["C","Ủy ban nhân dân cấp xã nơi ông David lưu trú."],["D","Sở Tư pháp địa phương."]],"a":"B","e":"Theo Luật số 47/2014/QH13, cơ quan quản lý xuất nhập cảnh thuộc Bộ Công an có thẩm quyền quản lý, gia hạn, thu hồi, hủy bỏ các giấy tờ có giá trị nhập cảnh, cư trú và ra quyết định trục xuất, buộc xuất cảnh đối với người nước ngoài vi phạm pháp luật.","g":""},{"n":11,"q":"Theo Luật số 23/2023/QH15, khi công dân thực hiện thủ tục cấp hộ chiếu phổ thông trên môi trường điện tử (cổng dịch vụ công trực tuyến), họ có bắt buộc phải đến trực tiếp cơ quan xuất nhập cảnh để nộp hồ sơ giấy không?","o":[["A","Bắt buộc phải đến đối chiếu vân tay."],["B","Không bắt buộc, công dân có thể nộp hồ sơ, thanh toán lệ phí và nhận hộ chiếu qua dịch vụ bưu chính."],["C","Chỉ áp dụng nộp trực tuyến cho người trên 60 tuổi."],["D","Bắt buộc phải đến để chụp ảnh chân dung trực tiếp."]],"a":"B","e":"Đây là một trong những cải cách hành chính lớn của Luật số 23/2023/QH15, cho phép thực hiện toàn bộ quy trình cấp hộ chiếu phổ thông trên môi trường điện tử nhằm tạo điều kiện thuận lợi tối đa cho công dân.","g":""},{"n":12,"q":"Đối tượng nào sau đây thuộc diện được cấp hộ chiếu ngoại giao khi đi công tác nước ngoài?","o":[["A","Mọi công dân Việt Nam có nhu cầu."],["B","Doanh nhân thuộc các thành phần kinh tế tư nhân."],["C","Chủ tịch nước, Phó Chủ tịch nước, Đại biểu Quốc hội, Bộ trưởng và các chức danh tương đương theo quy định."],["D","Người nước ngoài có đóng góp lớn cho nền kinh tế Việt Nam."]],"a":"C","e":"Theo Điều 8 Luật số 49/2019/QH14, hộ chiếu ngoại giao chỉ được cấp cho các cán bộ, công chức cấp cao của Đảng và Nhà nước được quy định cụ thể tại điều này khi được cử đi nước ngoài thực hiện nhiệm vụ ngoại giao, công vụ.","g":""},{"n":13,"q":"Một người nước ngoài đang tạm trú tại Việt Nam bằng Thẻ tạm trú. Khi thẻ tạm trú hết hạn, người này muốn tiếp tục ở lại Việt Nam để làm việc thì phải làm thủ tục gì?","o":[["A","Không cần làm gì, thẻ tự động gia hạn thêm 1 năm."],["B","Phải xuất cảnh khỏi Việt Nam rồi làm thủ tục nhập cảnh lại từ đầu."],["C","Cơ quan, tổ chức, cá nhân mời, bảo lãnh phải làm thủ tục cấp thẻ tạm trú mới tại cơ quan quản lý xuất nhập cảnh."],["D","Đến đồn công an gần nhất để đóng dấu gia hạn."]],"a":"C","e":"Theo quy định của Luật số 47/2014/QH13, khi thẻ tạm trú hết hạn, người nước ngoài nếu muốn tiếp tục cư trú phải được cơ quan, tổ chức, cá nhân bảo lãnh làm thủ tục cấp thẻ mới tại Cơ quan quản lý xuất nhập cảnh.","g":""},{"n":14,"q":"Thẻ thường trú cấp cho người nước ngoài tại Việt Nam có thời hạn định kỳ phải đổi là bao lâu?","o":[["A","3 năm một lần."],["B","5 năm một lần."],["C","10 năm một lần."],["D","Vô thời hạn, không bao giờ phải đổi."]],"a":"C","e":"Theo Điều 43 Luật số 47/2014/QH13, định kỳ 10 năm một lần, người nước ngoài thường trú phải đến Công an tỉnh, thành phố trực thuộc trung ương nơi thường trú để đổi thẻ thường trú.","g":""},{"n":15,"q":"Trường hợp công dân Việt Nam bị tạm hoãn xuất cảnh theo quy định của pháp luật, thời hạn tạm hoãn xuất cảnh tối đa là bao lâu (trừ trường hợp liên quan đến tội phạm hình sự nguy hiểm)?","o":[["A","Không quá 1 tháng."],["B","Không quá 3 tháng."],["C","Không quá 3 năm và có thể gia hạn."],["D","Không quá thời hạn giải quyết vụ việc của cơ quan có thẩm quyền theo quy định của luật."]],"a":"D","e":"Theo Điều 22 Luật số 49/2019/QH14, thời hạn tạm hoãn xuất cảnh, gia hạn tạm hoãn xuất cảnh không quá thời hạn giải quyết vụ việc của cơ quan có thẩm quyền theo quy định của pháp luật. Khi hết thời hạn tạm hoãn mà không có quyết định gia hạn thì người bị tạm hoãn đương nhiên được xuất cảnh.","g":""},{"n":16,"q":"Thẻ tạm trú cấp cho người lao động nước ngoài làm việc tại Việt Nam (ký hiệu LĐ1, LĐ2) có thời hạn tối đa theo quy định của pháp luật hiện hành là bao lâu?","o":[["A","1 năm"],["B","3 năm"],["C","10 năm"],["D","2 năm"]],"a":"D","e":"Theo quy định, thẻ tạm trú ký hiệu LĐ1, LĐ2 cấp cho người lao động nước ngoài có thời hạn tối đa không qua 2 năm (gắn liền với thời hạn của giấy phép lao động).","g":""},{"n":17,"q":"Theo Thông tư 14/2026/TT-BCA, hãng hàng không phải chịu trách nhiệm đối với hành khách do hãng chuyên chở bị Việt Nam từ chối nhập cảnh, quá cảnh và có nghĩa vụ:","o":[["A","Chuyên chở hành khách rời Việt Nam trong thời gian sớm nhất."],["B","Tự ý cho hành khách nhập cảnh."],["C","Bỏ mặc hành khách tại sân bay."],["D","Hủy hộ chiếu của hành khách."]],"a":"A","e":"Căn cứ: khoản 1 Điều 35 Thông tư 14/2026/TT-BCA","g":""},{"n":18,"q":"Theo Luật số 49/2019/QH14, công dân Việt Nam được xuất cảnh khi nào?","o":[["A","Chỉ cần có hộ chiếu còn hạn."],["B","Có giấy tờ xuất nhập cảnh còn nguyên vẹn, còn hạn; có thị thực hoặc giấy tờ xác nhận nước đến cho nhập cảnh, trừ trường hợp được miễn; và không thuộc trường hợp bị cấm, không được hoặc tạm hoãn xuất cảnh."],["C","Chỉ cần có vé máy bay."],["D","Chỉ cần được hãng hàng không xác nhận đặt chỗ."]],"a":"B","e":"Căn cứ: khoản 1 Điều 33 Luật số 49/2019/QH14, được sửa đổi bởi Luật số 23/2023/QH15. Quy định đặt ra đồng thời các điều kiện về giấy tờ, quyền nhập cảnh của nước đến và tình trạng pháp lý của người xuất cảnh.","g":""},{"n":19,"q":"Người chưa đủ 14 tuổi khi xuất cảnh, ngoài các điều kiện chung, phải đáp ứng điều kiện nào?","o":[["A","Phải có ít nhất hai người đi cùng."],["B","Phải có người đại diện hợp pháp đi cùng."],["C","Phải có xác nhận của hãng hàng không."],["D","Phải có xác nhận của Công an cấp xã nơi cư trú."]],"a":"B","e":"Căn cứ: khoản 2 Điều 33 Luật số 49/2019/QH14.","g":""},{"n":20,"q":"Theo Luật số 49/2019/QH14, nguyên tắc xuất cảnh, nhập cảnh phải:","o":[["A","Chỉ bảo đảm thuận lợi cho hoạt động du lịch."],["B","Tuân thủ Hiến pháp, pháp luật Việt Nam và điều ước quốc tế có liên quan."],["C","Chỉ tuân thủ quy định của hãng hàng không."],["D","Chỉ tuân thủ quy định của nước đến."]],"a":"B","e":"Căn cứ: Điều 3 Luật số 49/2019/QH14.","g":""},{"n":21,"q":"“Cửa khẩu” theo Luật số 47/2014/QH13 được hiểu là:","o":[["A","Nơi chỉ làm thủ tục hải quan."],["B","Nơi người nước ngoài được phép nhập cảnh, xuất cảnh, quá cảnh."],["C","Nơi máy bay đỗ."],["D","Nơi cấp hộ chiếu."]],"a":"B","e":"Căn cứ: Điều 3 Luật số 47/2014/QH13.","g":""},{"n":22,"q":"Người nước ngoài nhập cảnh theo diện đơn phương miễn thị thực phải có hộ chiếu còn thời hạn ít nhất:","o":[["A","03 tháng."],["B","04 tháng."],["C","06 tháng."],["D","12 tháng."]],"a":"C","e":"Căn cứ: điểm a khoản 1 Điều 20 Luật số 47/2014/QH13.","g":""},{"n":23,"q":"Theo Luật số 23/2023/QH15, công dân nước được Việt Nam đơn phương miễn thị thực được cấp tạm trú:","o":[["A","15 ngày."],["B","30 ngày."],["C","45 ngày."],["D","90 ngày."]],"a":null,"e":"","g":""},{"n":24,"q":"“Khu vực cách ly” được xác định là:","o":[["A","Khu vực từ bãi đỗ xe đến nhà ga."],["B","Một phần khu vực hạn chế từ sau điểm kiểm tra an ninh hành khách, hành lý xách tay đến cửa khởi hành."],["C","Khu vực ngoài sân bay."],["D","Khu vực làm thủ tục hải quan."]],"a":"B","e":"Căn cứ: khoản 19 Điều 3 Thông tư 14/2026/TT-BCA.","g":""},{"n":25,"q":"Căn cứ tính chất, mức độ vi phạm, cơ quan quyết định cấm vận chuyển có thời hạn hoặc vĩnh viễn là:","o":[["A","Hãng hàng không."],["B","Cục Quản lý xuất nhập cảnh."],["C","Cảng vụ hàng không."],["D","Người chỉ huy tàu bay."]],"a":"B","e":"Căn cứ: khoản 5 Điều 21 Nghị định 215/2026/NĐ-CP.","g":""},{"n":26,"q":"Người nước ngoài sử dụng thị thực điện tử để xuất cảnh phải:","o":[["A","Xuất cảnh tại mọi cửa khẩu."],["B","Xuất cảnh qua các cửa khẩu quốc tế do Chính phủ quyết định và đáp ứng các điều kiện luật định."],["C","Xuất cảnh bằng đường biển."],["D","Có xác nhận của hãng hàng không."]],"a":"B","e":"Căn cứ: khoản 2 Điều 27 Luật số 47/2014/QH13.","g":""},{"n":27,"q":"Người nước ngoài giả mạo giấy tờ hoặc khai sai sự thật để được cấp giấy tờ có giá trị nhập cảnh, xuất cảnh, cư trú thuộc trường hợp:","o":[["A","Được ưu tiên nhập cảnh."],["B","Chưa cho nhập cảnh."],["C","Được miễn thị thực."],["D","Được cấp thị thực tại cửa khẩu."]],"a":"B","e":"Căn cứ: khoản 3 Điều 21 Luật số 47/2014/QH13.","g":""},{"n":28,"q":"Hành vi nào sau đây bị cấm theo Luật số 49/2019/QH14?","o":[["A","Làm giả hoặc sử dụng giấy tờ xuất nhập cảnh giả."],["B","Đăng ký chuyến bay quốc tế."],["C","Sử dụng hộ chiếu còn hạn."],["D","Khai báo thông tin hành khách."]],"a":"A","e":"Căn cứ: Điều 4 Luật số 49/2019/QH14.","g":""},{"n":29,"q":"Khi công dân Việt Nam xuất cảnh, nhập cảnh tại cửa khẩu, giấy tờ được xuất trình cho ai?","o":[["A","Nhân viên hãng hàng không."],["B","Người làm nhiệm vụ kiểm soát xuất nhập cảnh hoặc cổng kiểm soát tự động."],["C","Nhân viên hải quan."],["D","Nhân viên an ninh hàng không của hãng."]],"a":"B","e":"Căn cứ: khoản 1 Điều 35 Luật số 49/2019/QH14.","g":""},{"n":30,"q":"Người sử dụng thị thực điện tử để nhập cảnh Việt Nam phải:","o":[["A","Nhập cảnh qua bất kỳ địa điểm nào."],["B","Đủ điều kiện theo Điều 20 và nhập cảnh qua cửa khẩu quốc tế do Chính phủ quyết định."],["C","Chỉ nhập cảnh bằng đường biển."],["D","Chỉ nhập cảnh qua sân bay Nội Bài."]],"a":"B","e":"Căn cứ: khoản 2 Điều 20 Luật số 47/2014/QH13.","g":""},{"n":31,"q":"Thông tư số 87/2026/TT-BCA của Bộ Công an có hiệu lực thi hành từ ngày tháng năm nào và thay thế văn bản nào trước đây?","o":[["A","Có hiệu lực từ ngày 01/01/2026, thay thế Thông tư số 53/2016/TT-BCA."],["B","Có hiệu lực từ ngày 24/07/2026, thay thế Thông tư số 53/2016/TT-BCA."],["C","Có hiệu lực từ ngày 01/01/2026, thay thế Thông tư số 54/2016/TT-BCA. (ban hành Nội quy cơ sở lưu trú)"],["D","Có hiệu lực từ ngày 24/07/2026, thay thế Thông tư số 54/2016/TT-BCA."]],"a":"B","e":"Thông tư số 87/2026/TT-BCA được Bộ trưởng Bộ Công an ký ban hành ngày 09/6/2026 và chính thức có hiệu lực từ ngày 24/7/2026, thay thế Thông tư số 53/2016/TT-BCA.","g":""},{"n":32,"q":"Theo Thông tư 87/2026/TT-BCA, đối tượng nào có trách nhiệm trực tiếp thực hiện việc khai báo tạm trú cho người nước ngoài với cơ quan công an?","o":[["A","Người nước ngoài đến trực tiếp tại trụ sở Công an xã/ phường nơi cơ sở kinh doanh lưu trú đứng chân."],["B","Hướng dẫn viên du lịch có trách nhiệm thực hiện việc khai báo tạm trú đối với người nước ngoài tại trụ sở Công an xã/phường nơi cơ sở lưu trú đứng chân."],["C","Chủ cơ sở lưu trú, người đại diện theo pháp luật, người quản lý hoặc người được ủy quyền của cơ sở lưu trú có trách nhiệm thực hiện việc khai báo tạm trú đối với người nước ngoài."],["D","Công an cấp xã nơi cơ sở lưu trú đứng chân."]],"a":"C","e":"Chủ cơ sở lưu trú (khách sạn, nhà nghỉ, homestay, khu nghỉ dưỡng...) hoặc người đại diện, quản lý, người được ủy quyền có trách nhiệm trực tiếp thực hiện khai báo tạm trú khi có người nước ngoài đến lưu trú.","g":""},{"n":33,"q":"Hệ thống điện tử chính thức dùng để tiếp nhận khai báo tạm trú cho người nước ngoài theo quy định hiện hành là gì?","o":[["A","Cổng dịch vụ công quốc gia (https://tbltkbtt.dichvucong.gov.vn)."],["B","Hệ thống khai báo tạm trú cho người nước ngoài và thông báo lưu trú cho công dân Việt Nam (https://tbltkbtt.bocongan.gov.vn)."],["C","Trang thông tin điện tử Cục Quản lý xuất nhập cảnh (https:// tbltkbtt.xuatnhapcanh.gov.vn/)."],["D","Ứng dụng định danh quốc gia VNeID (chỉ dành riêng cho cá nhân)."]],"a":"B","e":"Các cơ sở lưu trú thực hiện khai báo tạm trú điện tử thông qua hệ thống chuyên ngành của Bộ Công an tại địa chỉ (https://tbltkbtt.bocongan.gov.vn).","g":""},{"n":34,"q":"Thời điểm cơ sở lưu trú phải thực hiện việc khai báo tạm trú cho người nước ngoài là khi nào?","o":[["A","Chậm nhất trước 22h00 hằng ngày."],["B","Ngay khi người nước ngoài đến lưu trú, không chờ đến cuối ngày."],["C","Trong vòng 12 giờ kể từ khi người nước ngoài nhận phòng."],["D","Trong vòng 24 giờ kể từ khi người nước ngoài vào Việt Nam."]],"a":"B","e":"Cơ sở lưu trú bắt buộc phải thực hiện khai báo tạm trú ngay khi người nước ngoài đến, tuyệt đối không được chờ đến cuối ngày hoặc thời điểm khác.","g":""},{"n":35,"q":"Các thông tin tối thiểu cần khai báo về người nước ngoài gồm những nội dung nào?","o":[["A","Họ tên, giới tính, ngày sinh, quốc tịch, số hộ chiếu hoặc giấy tờ có giá trị đi lại quốc tế."],["B","Họ tên, nghề nghiệp và mục đích nhập cảnh."],["C","Họ tên, giới tính, ngày sinh ,số hộ chiếu, địa chỉ thường trú tại nước sở tại và tên công ty bảo lãnh."],["D","Họ tên, giới tính, ngày sinh, quốc tịch, địa chỉ thường trú tại nước sở tại và tên công ty bảo lãnh."]],"a":"A","e":"Các thông tin cơ bản bắt buộc kê khai gồm: họ tên, giới tính, ngày sinh, quốc tịch, số hộ chiếu hoặc giấy tờ có giá trị đi lại quốc tế; cùng với thời hạn chứng nhận tạm trú, gia hạn tạm trú hoặc thẻ tạm trú (nếu có) và thời gian dự kiến lưu trú.","g":""},{"n":36,"q":"Trong trường hợp hệ thống mạng internet gặp sự cố hoặc trường hợp đặc biệt không thể khai báo điện tử, cơ sở lưu trú sử dụng biểu mẫu nào và nộp cho cơ quan nào?","o":[["A","Sử dụng mẫu NA16 nộp trực tiếp tại Phòng Quản lý xuất nhập cảnh cấp tỉnh."],["B","Sử dụng Phiếu khai báo tạm trú mẫu NA17 và nộp trực tiếp đến Công an cấp xã."],["C","Sử dụng mẫu NA14 gửi qua đường bưu điện cho Công an huyện."],["D","Viết giấy biên nhận thủ tục hành chính trực tiếp tại Đồn Biên phòng cửa khẩu."]],"a":"B","e":"Trường hợp đặc biệt không thể khai báo qua mạng điện tử, cơ sở lưu trú phải sử dụng Phiếu khai báo tạm trú theo mẫu NA17 và nộp trực tiếp đến Công an cấp xã.","g":""},{"n":37,"q":"Khi sử dụng Phiếu khai báo tạm trú (mẫu NA17) nộp trực tiếp do lỗi hệ thống/đặc biệt, thời hạn nộp đối với địa bàn ở vùng sâu, vùng xa là bao lâu kể từ khi người nước ngoài đến?","o":[["A","12 giờ."],["B","24 giờ."],["C","48 giờ."],["D","72 giờ."]],"a":"B","e":"Thời hạn nộp phiếu trực tiếp là trong vòng 12 giờ đối với các địa bàn thuận tiện giao thông và 24 giờ đối với địa bàn vùng sâu, vùng xa.","g":""},{"n":38,"q":"Cơ quan Công an nào có thẩm quyền trực tiếp tiếp nhận, kiểm tra và quản lý thông tin khai báo tạm trú của người nước ngoài trên địa bàn cơ sở lưu trú đứng chân?","o":[["A","Chỉ Cục Quản lý xuất nhập cảnh Bộ Công an."],["B","Phòng Quản lý xuất nhập cảnh Công an cấp tỉnh."],["C","Công an cấp xã (Công an xã, phường, thị trấn) nơi cơ sở lưu trú hoạt động."],["D","Bộ Tư lệnh Bộ đội Biên phòng."]],"a":"C","e":"","g":""},{"n":39,"q":"Trường hợp người nước ngoài đến lưu trú tại nhà riêng của công dân Việt Nam (hoặc người nước ngoài thường trú/tạm trú dài hạn tại VN), ai là người chịu trách nhiệm khai báo tạm trú?","o":[["A","Bản thân người nước ngoài tự khai báo qua ứng dụng cá nhân."],["B","Chủ hộ gia đình hoặc người đại diện chỗ ở."],["C","Tổ trưởng dân phố nơi có nhà cho thuê/ở nhờ."],["D","Công an khu vực tự động lập danh sách."]],"a":"B","e":"","g":""},{"n":40,"q":"Nghị định số 289/2026/NĐ-CP của Chính phủ quy định về lĩnh vực gì và có hiệu lực thi hành từ ngày tháng năm nào?","o":[["A","Về quản lý, bảo đảm an ninh, trật tự tại cửa khẩu cảng do Bộ Công an quản lý; có hiệu lực từ ngày 01/10/2026."],["B","Về cách thức thực hiện khai báo, tiếp nhận thông tin tạm trú của người nước ngoài tại Việt Nam; có hiệu lực từ ngày 24/07/2026."],["C","Về Quy định trình tự, thủ tục, thẩm quyền cấp và quản lý thẻ đi lại doanh nhân APEC; có hiệu lực từ ngày 01/07/2026."],["D","Về Quy định mức thu, chế độ thu, nộp phí, lệ phí trong lĩnh vực xuất cảnh, nhập cảnh, quá cảnh, cư trú tại Việt Nam; có hiệu lực từ ngày 01/04/2026"]],"a":"A","e":"","g":""},{"n":41,"q":"Đối tượng nào sau đây không thuộc phạm vi áp dụng của Nghị định 289/2026/NĐ-CP về quản lý, bảo đảm an ninh, trật tự tại cửa khẩu cảng do Bộ Công an quản lý?","o":[["A","Các cơ quan, tổ chức, cá nhân Việt Nam hoạt động tại cửa khẩu cảng."],["B","Tàu thuyền và các loại phương tiện của nước ngoài ra, vào cửa khẩu cảng."],["C","Người sử dụng và được chuyên chở bằng phương tiện ra, vào cửa khẩu cảng để thực hiện nhiệm vụ quốc phòng, an ninh."],["D","Thuyền viên nước ngoài làm việc trên tàu neo đậu tại cảng."]],"a":"C","e":"","g":""},{"n":42,"q":"Cơ quan quản lý nhà nước chuyên ngành tại cửa khẩu cảng do Bộ Công an quản lý bao gồm những cơ quan nào?","o":[["A","Cảng vụ hàng hải, Cảng vụ đường thủy nội địa, Hải quan cửa khẩu, Công an cửa khẩu cảng, Kiểm dịch y tế, Kiểm dịch động vật, Kiểm dịch thực vật."],["B","Chỉ có Công an cửa khẩu cảng và Hải quan cửa khẩu."],["C","Bộ đội Biên phòng và Cảng vụ hàng hải."],["D","Sở Giao thông vận tải và Công an cấp tỉnh."]],"a":"A","e":"","g":""},{"n":43,"q":"Theo Quyết định số 28/2026/QĐ-TTg, thời hạn tối đa của thẻ ABTC cấp cho doanh nhân Việt Nam là bao lâu?","o":[["A","Không quá 03 năm kể từ ngày cấp."],["B","Không quá 05 năm kể từ ngày được hệ thống các nền kinh tế thành viên APEC chấp thuận, không quá thời hạn của hộ chiếu và không được gia hạn."],["C","Cố định đúng 5 năm và có thể được gia hạn 1 lần."],["D","Bằng thời hạn hiệu lực còn lại của hộ chiếu."]],"a":"B","e":"","g":""},{"n":44,"q":"Thẻ ABTC sau khi đã được cấp có được phép gia hạn khi hết thời hạn sử dụng hay không?","o":[["A","Được phép gia hạn tối đa 1 lần nếu doanh nghiệp có yêu cầu."],["B","Không được gia hạn; khi hết hạn hoặc sắp hết thời hạn chấp thuận, phải làm thủ tục cấp lại thẻ mới theo quy định."],["C","Được phép gia hạn tự động trên hệ thống dịch vụ công quốc gia."],["D","Được gia hạn nếu có xác nhận của Liên đoàn Thương mại và Công nghiệp Việt Nam (VCCI)."]],"a":"B","e":"","g":""},{"n":45,"q":"Doanh nhân Việt Nam được cấp thẻ ABTC có trách nhiệm sử dụng thẻ trong trường hợp nào sau đây?","o":[["A","Sử dụng để đi du lịch cá nhân và thăm thân nhân ở nước ngoài vào dịp nghỉ hè."],["B","Sử dụng để làm giấy tờ tùy thân thay thế chứng minh nhân dân/căn cước khi ở trong nước"],["C","Sử dụng đi lại thực hiện các hoạt động của cơ quan, tổ chức, doanh nghiệp hoặc tham dự hội nghị, hội thảo, cuộc họp tại các nền kinh tế thành viên APEC."],["D","Sử dụng đi lại thực hiện các hoạt động của cá nhân, cơ quan, tổ chức, doanh nghiệp hoặc tham dự hội nghị, hội thảo, cuộc họp tại các nền kinh tế thành viên APEC."]],"a":"C","e":"","g":""},{"n":46,"q":"Thẻ ABTC thể hiện các nền kinh tế thành viên APEC như thế nào?","o":[["A","Mặc định tất cả các nước APEC."],["B","Chỉ ghi tên các nền kinh tế thành viên APEC mà doanh nhân đã nộp lệ phí bổ sung."],["C","Thể hiện rõ thông tin các nền kinh tế thành viên APEC đã xem xét và đồng ý cho doanh nhân nhập cảnh."],["D","Thể hiện rõ thông tin các nền kinh tế thành viên APEC do doanh nhân đề nghị cơ quan có thẩm quyền xem xét."]],"a":"C","e":"","g":""},{"n":47,"q":"Theo Quyết định 28/2026/QĐ-TTg, doanh nghiệp đề nghị sử dụng thẻ ABTC cho doanh nhân phải đáp ứng điều kiện về thời gian hoạt động liên tục tối thiểu là bao lâu tính đến thời điểm đề nghị?","o":[["A","Từ 12 tháng trở lên."],["B","Từ 24 tháng trở lên."],["C","Từ 36 tháng trở lên."],["D","Không bắt buộc thời gian hoạt động, chỉ cần có giấy phép là được."]],"a":"B","e":"","g":""},{"n":48,"q":"Doanh nghiệp đề nghị cấp thẻ ABTC phải chấp hành tốt các quy định nào của pháp luật theo quy định mới?","o":[["A","Chỉ cần chấp hành tốt pháp luật về thương mại, hải quan, lao động và bảo hiểm xã hội."],["B","Chỉ cần chấp hành tốt pháp luật về thương mại."],["C","Chấp hành tốt các quy định của pháp luật về thuế, hải quan, lao động, bảo hiểm xã hội và các quy định pháp luật có liên quan."],["D","Chấp hành tốt các quy định của pháp luật về thuế, hải quan, lao động và các quy định pháp luật có liên quan."]],"a":"C","e":"","g":""},{"n":49,"q":"Về phía cá nhân doanh nhân, để được đề nghị cấp thẻ ABTC, doanh nhân phải có thời gian làm việc tại cơ quan, tổ chức, doanh nghiệp tối thiểu là bao lâu tính đến thời điểm đề nghị?","o":[["A","Đủ 06 tháng trở lên."],["B","Đủ 12 tháng trở lên."],["C","Đủ 24 tháng trở lên."],["D","Không giới hạn thời gian làm việc tại doanh nghiệp."]],"a":"B","e":"","g":""},{"n":50,"q":"Theo Luật, “người nước ngoài” được hiểu là:","o":[["A","Người có quốc tịch nước ngoài đang cư trú tại Việt Nam."],["B","Người mang giấy tờ xác định quốc tịch nước ngoài và người không quốc tịch nhập cảnh, xuất cảnh, quá cảnh, cư trú tại Việt Nam."],["C","Chỉ bao gồm người mang hộ chiếu nước ngoài."],["D","Người nước ngoài đang làm việc tại Việt Nam."]],"a":"B","e":"Theo khoản 1 Điều 3 VBHN 62/VBHN-VPQH ngày 23/03/2026, “người nước ngoài” là người mang giấy tờ xác định quốc tịch nước ngoài và người không quốc tịch nhập cảnh, xuất cảnh, quá cảnh, cư trú tại Việt Nam. Vì vậy đáp án B đúng.","g":""},{"n":51,"q":"Người nước ngoài có nhiều hộ chiếu thì khi nhập cảnh, xuất cảnh, quá cảnh, cư trú tại Việt Nam:","o":[["A","Được sử dụng tất cả các hộ chiếu."],["B","Được sử dụng tối đa 02 hộ chiếu."],["C","Chỉ được sử dụng một hộ chiếu."],["D","Được lựa chọn hộ chiếu khác nhau cho từng lần nhập cảnh."]],"a":"C","e":"Khoản 4 Điều 4 VBHN 62 ngày 23/03/2026 quy định người nước ngoài có nhiều hộ chiếu chỉ được sử dụng một hộ chiếu để nhập cảnh, xuất cảnh, quá cảnh, cư trú tại Việt Nam. Vì vậy đáp án C đúng.","g":""},{"n":52,"q":"Thị thực có thể được cấp dưới hình thức nào?","o":[["A","Chỉ cấp vào hộ chiếu."],["B","Chỉ cấp rời."],["C","Cấp vào hộ chiếu, cấp rời hoặc cấp qua giao dịch điện tử."],["D","Chỉ cấp dưới dạng điện tử."]],"a":"C","e":"Khoản 1 Điều 7 VBHN 62 ngày 23/03/2026 quy định thị thực được cấp vào hộ chiếu, cấp rời hoặc cấp qua giao dịch điện tử; thị thực cấp qua giao dịch điện tử là thị thực điện tử. Vì vậy đáp án C đúng.","g":""},{"n":53,"q":"Thị thực ký hiệu LĐ2 được cấp cho:","o":[["A","Người nước ngoài làm việc tại Việt Nam không thuộc diện phải có giấy phép lao động."],["B","Người nước ngoài làm việc tại Việt Nam thuộc diện phải có giấy phép lao động."],["C","Nhà đầu tư nước ngoài."],["D","Người nước ngoài vào học tập."]],"a":"B","e":"Điểm 16a Điều 8 VBHN 62 ngày 23/03/2026 quy định thị thực ký hiệu LĐ2 cấp cho người nước ngoài làm việc tại Việt Nam thuộc diện phải có giấy phép lao động. Vì vậy đáp án B đúng.","g":""},{"n":54,"q":"Thị thực ký hiệu ĐT1 áp dụng đối với nhà đầu tư nước ngoài có vốn góp:","o":[["A","Dưới 03 tỷ đồng."],["B","Từ 03 tỷ đồng đến dưới 50 tỷ đồng."],["C","Từ 50 tỷ đồng đến dưới 100 tỷ đồng."],["D","Từ 100 tỷ đồng trở lên hoặc đầu tư vào ngành, nghề, địa bàn ưu đãi đầu tư theo quy định."]],"a":"D","e":"Điểm 7a Điều 8 VBHN 62 ngày 23/03/2026 quy định thị thực ĐT1 áp dụng cho nhà đầu tư nước ngoài tại Việt Nam và người đại diện cho tổ chức nước ngoài đầu tư tại Việt Nam có vốn góp từ 100 tỷ đồng trở lên hoặc đầu tư vào ngành, nghề ưu đãi đầu tư, địa bàn ưu đãi đầu tư do Chính phủ quyết định. Vì vậy đáp án D đúng.","g":""},{"n":55,"q":"Thị thực ký hiệu HN, DL, EV có thời hạn tối đa:","o":[["A","30 ngày."],["B","45 ngày."],["C","60 ngày."],["D","90 ngày."]],"a":"D","e":"Khoản 2 Điều 9 VBHN 62 ngày 23/03/2026 quy định thị thực ký hiệu HN, DL, EV có thời hạn không quá 90 ngày. Vì vậy đáp án D đúng.","g":""},{"n":56,"q":"Công dân Việt Nam thường trú ở trong nước khi mời, bảo lãnh người nước ngoài vào Việt Nam thăm phải:","o":[["A","Có giấy phép lao động."],["B","Có giấy tờ chứng minh quan hệ với người được mời, bảo lãnh."],["C","Có thẻ tạm trú."],["D","Có thẻ thường trú của người nước ngoài."]],"a":"B","e":"Khoản 2 Điều 14 VBHN 62 ngày 23/03/2026 quy định công dân Việt Nam thường trú ở trong nước được mời, bảo lãnh người nước ngoài vào Việt Nam thăm và phải có giấy tờ chứng minh quan hệ với người được mời, bảo lãnh. Vì vậy đáp án B đúng.","g":""},{"n":57,"q":"Thời hạn cơ quan quản lý xuất nhập cảnh xem xét, giải quyết và trả lời đề nghị cấp thị thực điện tử là:","o":[["A","01 ngày làm việc."],["B","02 ngày làm việc."],["C","03 ngày làm việc."],["D","05 ngày làm việc."]],"a":"C","e":"Khoản 2 Điều 16a VBHN 62 ngày 23/03/2026 quy định cơ quan quản lý xuất nhập cảnh xem xét, giải quyết và trả lời đề nghị cấp thị thực điện tử trong thời hạn 03 ngày làm việc kể từ ngày nhận đủ thông tin đề nghị và phí cấp thị thực. Vì vậy đáp án C đúng.","g":""},{"n":58,"q":"Người nước ngoài nhập cảnh theo diện đơn phương miễn thị thực thì hộ chiếu phải còn thời hạn sử dụng ít nhất: 03 tháng.","o":[["B","04 tháng."],["C","06 tháng."],["D","12 tháng."]],"a":"C","e":"Điểm a khoản 1 Điều 20 VBHN 62 ngày 23/03/2026 quy định người nước ngoài nhập cảnh theo diện đơn phương miễn thị thực phải có hộ chiếu còn thời hạn sử dụng ít nhất 06 tháng. Vì vậy đáp án C đúng.","g":""},{"n":59,"q":"Người nước ngoài quá cảnh đường biển có nhu cầu xuất cảnh qua cửa khẩu khác thì được xét cấp thị thực ký hiệu:","o":[["A","DL."],["B","EV."],["C","VR."],["D","TT."]],"a":"C","e":"Điều 26 VBHN 62 quy định người nước ngoài quá cảnh đường biển nếu có nhu cầu xuất cảnh qua cửa khẩu khác thì được xét cấp thị thực ký hiệu VR. Vì vậy đáp án C đúng.","g":""},{"n":60,"q":"Trường hợp người nước ngoài chưa hoàn thành nghĩa vụ nộp thuế, thẩm quyền quyết định tạm hoãn xuất cảnh thuộc:","o":[["A","Bộ trưởng Bộ Công an."],["B","Bộ trưởng Bộ Quốc phòng."],["C","Thủ trưởng cơ quan quản lý thuế."],["D","Chủ tịch UBND cấp tỉnh."]],"a":"C","e":"Điểm c khoản 1 Điều 28 VBHN 62 ngày 23/03/2026 xác định người nước ngoài chưa hoàn thành nghĩa vụ nộp thuế có thể bị tạm hoãn xuất cảnh. Khoản 2 Điều 29 quy định Thủ trưởng cơ quan quản lý thuế quyết định tạm hoãn xuất cảnh đối với trường hợp này. Vì vậy đáp án C đúng.","g":""},{"n":61,"q":"Công dân của nước được Việt Nam đơn phương miễn thị thực được cấp chứng nhận tạm trú:","o":[["A","15 ngày."],["B","30 ngày."],["C","45 ngày."],["D","90 ngày."]],"a":"C","e":"Điểm c khoản 1 Điều 31 VBHN 62 ngày 23/03/2026 quy định công dân của nước được Việt Nam đơn phương miễn thị thực được cấp chứng nhận tạm trú 45 ngày và được xem xét cấp thị thực, gia hạn tạm trú theo quy định. Vì vậy đáp án C đúng.","g":""},{"n":62,"q":"Người nước ngoài thường trú tại Việt Nam phải đến Công an cấp tỉnh nơi thường trú để rting"],["D","Observe, assess the nature of the case. Make decision. Superior reporting (if necessary)."]],"a":"D","e":"","g":""},{"n":6,"q":"How is the screening of high-risk goods (goods originating from countries with unstable political and social order according to the recommendations of state management agencies) conducted?","o":[["A","In addition to the process applied to normal goods, for high-risk goods, measures of using explosive detection devices and increasing visual inspection are also applied."],["B","Like ordinary goods"],["C","Exemption from screening check"],["D","All above are correct"]],"a":"A","e":"","g":""},{"n":7,"q":"What are high-risk goods?","o":[["A","Goods originating from countries with unstable political and social situation according to the recommendations of state management agencies."],["B","Goods from Europe"],["C","Goods from the Americas"],["D","Goods from the South East Asia"]],"a":"A","e":"","g":""},{"n":8,"q":"What are purposes and requirements of the security check of goods and postal items carried on board?","o":[["A","Ensure that the goods and postal items are loaded onto the aircraft to the right subjects and according to regulations."],["B","Detect, prevent bringing dangerous items into restricted areas, illegally boarding aircraft"],["C","Cooperate in detecting and preventing other illegal acts"],["D","All above are correct"]],"a":"D","e":"","g":""},{"n":9,"q":"What are responsibilities of Tan Son Nhat International Airport for the security check of goods and postal items carried on board?","o":[["A","Check and supervise aviation security for goods and postal items as prescribed"],["B","Ensuring aviation security for aircraft carrying cargo and postal items as prescribed"],["C","Handle violations and situations arising in the course of aviation security inspection and supervision of goods and postal items according to regulations."],["D","All above are correct"]],"a":"D","e":"","g":""},{"n":10,"q":"What is the security check and supervision of crew members?","o":[["A","Exemption from security check and supervision"],["B","As passengers and luggage"],["C","Manual check is compulsory"],["D","Checking by walk-through metal detector"]],"a":"B","e":"","g":""},{"n":11,"q":"Cargo and postal items in transit must be screening checked and monitored for aviation security like departing goods and postal items, except for the following cases:","o":[["A","Cargo and postal items in transit or transshipment have a security declaration proving that the aviation security check has been carried out 100% of the goods and postal items at the point of departure"],["B","Cargo and postal items in transit or transshipment do not leave the aircraft, aircraft apron or do not leave restricted areas and are subject to continuous appropriate aviation security supervision"],["C","Cargo and postal items in transit or transshipment are transported from the aircraft apron to the cargo storage area through a public area that is not a restricted area and vice versa, which is sealed and has measures for security supervision, continuous appropriate security during transport to prevent the unauthorized introduction of dangerous items into the goods or items"],["D","All above are correct"]],"a":"D","e":"","g":""},{"n":12,"q":"Who is responsible for providing information about the origin of goods and postal items with high aviation security risks to the aviation security control force of Tan Son Nhat International Airport?","o":[["A","Airlines and goods service provider"],["B","Southern Airports Authority"],["C","Cargo companies"],["D","Customs"]],"a":"A","e":"","g":""},{"n":13,"q":"Which unit is responsible for checking and determining compliance with the regulations on transporting dangerous goods by air before accepting the transportation of dangerous goods?","o":[["A","Aviation Security Center"],["B","Airlines"],["C","Cargo companies"],["D","Southern Airports Authority"]],"a":"B","e":"","g":""},{"n":14,"q":"How does the screening staff handle when detecting dangerous items in goods and postal items?","o":[["A","Identify and predict the type of dangerous items, assess the level of danger for appropriate handling"],["B","Coordinate with visual inspection staff for inspection. Make a decision to handle"],["C","Report to superviser, team leader arising situations"],["D","All above are correct"]],"a":"D","e":"","g":""},{"n":15,"q":"Which measures to check security for live animals and fresh goods?","o":[["A","Carry out screening checks like normal baggage and cargo procedures"],["B","Other appropriate measures for non-X-ray examination"],["C","Carry out screening checks like normal baggage and cargo procedures; Visual inspection or other appropriate measures for non-X-ray"],["D","Visual inspection only"]],"a":"C","e":"","g":""},{"n":16,"q":"Which case of aviation security must re-check?","o":[["A","Passengers and hand luggage have gone through the aviation security check but have left the sterile area isolation area; In case of contact or mixing between passengers, checked hand luggage and those who have not passed the aviation security check"],["B","Passengers and hand luggage have gone through the aviation security check but have left the sterile area; In case of contact or mixing between passengers, checked hand luggage and those who have not passed the aviation security check"],["C","Passengers and hand luggage have gone through the aviation security check but have left the sterile area; In case of contact or mixing between passengers, checked hand luggage and those who have not passed the aviation security check; In case the security seal is not intact or checked baggage, goods, postal items, items served on the aircraft, cabinets, meal bags are torn or broken"],["D","Passengers and hand luggage have gone through the aviation security check."]],"a":"C","e":"","g":""},{"n":17,"q":"How many steps to test the X-ray machine?","o":[["A","4 steps"],["B","5 steps"],["C","6 steps"],["D",  considered high-risk if it meets which of the following criterias?","o":[["A","Specific intelligence indicates that the cargo or mail poses a threat to civil aviation"],["B","The cargo or mail show anomalies that give rise to suspicion"],["C","The nature of the cargo or mail is such that baseline security measures alone are unlikely to detect prohibited items that could endanger the aircraft."],["D","All above are correct"]],"a":"D","e":"","g":""},{"n":24,"q":"Definition of \"Screening\"?","o":[["A","The application of technical which are intended to identify and/or detect weapons, explosives or other dangerous devices, articles or substances."],["B","The application of technical or other means which are intended to identify and/or detect weapons, explosives which may be used to commit an act of unlawful inteference."],["C","The application of technical or other means which are intended to identify and/or detect dangerous devices, articles or substances which may be used to commit an act of unlawful inteference."],["D","The application of technical or other means which are intended to identify and/or detect weapons, explosives, dangerous devices, articles or substances which may be used to commit an act of unlawful inteference."]],"a":"D","e":"","g":""},{"n":25,"q":"The screening of passengers and cabin baggage may be carried out by?","o":[["A","Manual searches; the use of metal detectors."],["B","X-ray equipment or other detectors of explosives and dangerous substances"],["C","A combination of manual procedures and screening equipment/ technology."],["D","All above are correct"]],"a":"D","e":"","g":""},{"n":26,"q":"What is the minimum percentage of random check with passengers, crew, cabin baggage and accompanied baggage?","o":[["A","0.05"],["B","10%"],["C","15%"],["D","20%"]],"a":"B","e":"","g":""},{"n":27,"q":"Which organization is responsible for checking and determining compliance with the regulations on transporting dangerous goods by aircraft?","o":[["A","Tan Son Nhat International Airport"],["B","Tan Son Nhat Security Center"],["C","Airlines"],["D","Southern Airports Authority"]],"a":"C","e":"","g":""},{"n":28,"q":"What does catering supplies include?","o":[["A","Food, beverages, other dry stores used on board an aircraft; Any property carried on an aircraft."],["B","Associated equipment used on board an aircraft; Any property carried on an aircraft."],["C","Food, beverages, other dry stores used on board an aircraft; Associated equipment used on board an aircraft."],["D","Any property carried on an aircraft."]],"a":"C","e":"","g":""},{"n":29,"q":"What is cargo and mail departing on an aircraft other than that on which it arrived?","o":[["A","Transfer cargo and mail."],["B","Transfer passengers and baggage."],["C","Transit cargo and mail."],["D","Transit passenger and baggage."]],"a":"A","e":"","g":""},{"n":30,"q":"What is baggage that arrives at an airport and is not picked up or claimed by a passenger or crew?","o":[["A","Unaccompanied baggage"],["B","Unclaimed baggage"],["C","Unidentified baggage"],["D","Hold baggage"]],"a":"B","e":"","g":""},{"n":31,"q":"What are passengers departing from an airport on the same flight as that on which they arrived?","o":[["A","Transit passengers."],["B","Transfer passengers."],["C","Hold passengers."],["D","All above are wrong."]],"a":"A","e":"","g":""}]},{"id":"tlanhk","name":"Tình huống ANHK (tự luận)","open":true,"qs":[{"n":1,"q":"Trong quá trình tuần tra khu vực Đảo thủ tục, CBCS ANHK được nhân viên thủ tục thông báo có 01 hành khách to tiếng, là ó, gây rối, yêu sách về thủ tục hàng không tại khu vực thủ tục. Anh (chị) xử lý tình huống này như thế nào?","o":[],"a":null,"e":"","g":""},{"n":2,"q":"Vào hồi 12h30' ngày …/…/…, trong khi làm nhiệm vụ tuần tra duy trì an ninh trật tự tại khu vực công cộng nhà ga hành khách, Cảng hàng không Z. CBCS kiểm soát an ninh hàng không Nguyễn Văn D phát hiện hai thanh niên đang đánh nhau, gây mất an ninh trật tự khu vực. Là CBCS Nguyễn Văn D, anh (chị) xử lý tình huống này như thế nào?","o":[],"a":null,"e":"","g":""},{"n":3,"q":"Khi nhận được thông tin, báo cáo về trường hợp hành khách gây rối, Ca /Kíp trưởng hoặc cán bộ trực Đội, CB-CS KSANQT được giao nhiệm vụ xử lý như thế nào?","o":[],"a":null,"e":"","g":""},{"n":4,"q":"CB-CS KSANQT đang làm nhiệm vụ phát hiện (hoặc nhận được thông tin báo) có đối tượng hủy hoại cố ý làm hư hỏng tài sản, trang thiết bị hàng không?","o":[],"a":null,"e":"","g":""},{"n":1,"q":"Trong trường hợp đang thực hiện nhiệm vụ, nếu phát hiện vật phẩm nguy hiểm là vũ khí quân dụng bên trong hành lý xách tay của hành khách, CBCS sẽ thực hiện xử lý như thế nào?","o":[],"a":null,"e":"","g":"AN NINH SOI CHIẾU"},{"n":2,"q":"Trong trường hợp CBCS phát hiện vật phẩm nguy hiểm là vật cấm như công cụ hỗ trợ/vũ khí quân dụng/vật liệu nổ bên trong hành lý của hành khách, Trực chỉ huy sẽ thực hiện xử lý như thế nào?","o":[],"a":null,"e":"","g":"AN NINH SOI CHIẾU"}]}];
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let W=new Set();try{W=new Set(JSON.parse(localStorage.getItem('qzw')||'[]'))}catch(e){}
const saveW=()=>{try{localStorage.setItem('qzw',JSON.stringify([...W]))}catch(e){}};
const ALL=BANKS.flatMap(b=>b.qs.map(q=>({...q,id:b.id+':'+q.n,bid:b.id,bank:b.name,open:b.open,ok:!b.open&&!!q.a&&q.o.length>1})));
const shuf=a=>{a=[...a];for(let i=a.length;i>1;){const j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let S=null,T=null,sel=new Set(BANKS.map(b=>b.id)),cfg={n:30,min:30,sh:true};
function home(){clearInterval(T);S=null;const app=$('#app');
const wc=ALL.filter(q=>W.has(q.id)&&sel.has(q.bid)).length;
app.innerHTML=`<h1>Ôn tập &amp; thi trắc nghiệm</h1><div class="card"><b>1. Chọn bộ câu hỏi</b>
<div class="row" style="margin:6px 0"><button onclick="selAll(1)">Chọn tất cả</button><button onclick="selAll(0)">Bỏ chọn</button></div>
${BANKS.map(b=>`<label class="b"><input type="checkbox" ${sel.has(b.id)?'checked':''} onchange="tg('${b.id}')"><span>${esc(b.name)} <span class="mu">(${b.qs.length} câu${b.qs.some(q=>!q.a)&&!b.open?', '+b.qs.filter(q=>!q.a).length+' câu chưa có đáp án':''})</span></span></label>`).join('')}</div>
<div class="card"><b>2. Chọn chế độ</b><div class="row" style="margin:10px 0"><label><input type="checkbox" ${cfg.sh?'checked':''} onchange="cfg.sh=this.checked"> Xáo trộn thứ tự câu (ôn tập)</label></div>
<div class="row"><button class="p" onclick="start('study')">Ôn tập (có đáp án ngay)</button><button onclick="start('wrong')" ${wc?'':'disabled'}>Ôn câu đã sai (${wc})</button></div>
<hr style="border:0;border-top:1px solid var(--bd);margin:14px 0"><div class="row"><b>Thi thử:</b> số câu <input type="number" min="1" id="nq" value="${cfg.n}"> thời gian (phút) <input type="number" min="1" id="mn" value="${cfg.min}"><button class="p" onclick="start('exam')">Bắt đầu thi</button></div>
<p class="mu">Thi thử chọn ngẫu nhiên từ các bộ đã chọn, chỉ lấy câu có đáp án, chấm điểm khi nộp bài. Câu sai được lưu trên trình duyệt này.</p></div>`}
const selAll=v=>{sel=new Set(v?BANKS.map(b=>b.id):[]);home()},tg=id=>{sel.has(id)?sel.delete(id):sel.add(id)};
function start(mode){let p=ALL.filter(q=>sel.has(q.bid));if(!p.length)return alert('Hãy chọn ít nhất một bộ câu hỏi.');
cfg.sh=$('input[type=checkbox][onchange^="cfg"]').checked;let qs,end=0;
if(mode=='exam'){cfg.n=+$('#nq').value||30;cfg.min=+$('#mn').value||30;qs=shuf(p.filter(q=>q.ok)).slice(0,cfg.n);end=Date.now()+cfg.min*6e4}
else if(mode=='wrong')qs=shuf(p.filter(q=>W.has(q.id)));else qs=cfg.sh?shuf(p):p;
if(!qs.length)return alert('Không có câu nào phù hợp.');
S={qs,i:0,a:{},mode,done:false,end,notes:{}};clearInterval(T);if(end)T=setInterval(tick,1000);quiz()}
function tick(){const r=Math.max(0,S.end-Date.now()),e=$('#tm');if(e)e.textContent=Math.floor(r/6e4)+':'+String(Math.floor(r/1e3)%60).padStart(2,'0');if(!r&&!S.done)submit(true)}
function pick(L){const q=S.qs[S.i];if(S.done||(S.mode!='exam'&&S.a[S.i]))return;S.a[S.i]=L;
if(S.mode!='exam'&&q.ok){L==q.a?W.delete(q.id):W.add(q.id);saveW()}quiz()}
function submit(auto){if(!auto&&!confirm('Nộp bài? Còn '+S.qs.filter((q,i)=>!S.a[i]).length+' câu chưa trả lời.'))return;
S.done=true;clearInterval(T);S.qs.forEach((q,i)=>{if(q.ok){S.a[i]==q.a?W.delete(q.id):W.add(q.id)}});saveW();S.i=0;quiz()}
const go=i=>{S.i=i;quiz()};
function quiz(){const q=S.qs[S.i],a=S.a[S.i],fb=S.done||(S.mode!='exam'&&a),n=S.qs.length;
const sc=S.qs.filter((x,i)=>x.ok&&S.a[i]==x.a).length,tot=S.qs.filter(x=>x.ok).length;
const st=i=>{const x=S.qs[i],y=S.a[i];return (S.done||S.mode!='exam')&&y&&x.ok?(y==x.a?'ok':'no'):y?'a':''};
$('#app').innerHTML=`<div class="row" style="margin-bottom:10px"><button onclick="if(confirm('Thoát về trang chính?'))home()">← Trang chính</button><span class="sp mu">${S.mode=='exam'?'Thi thử':S.mode=='wrong'?'Ôn câu sai':'Ôn tập'} · Câu ${S.i+1}/${n}</span>${S.mode=='exam'&&!S.done?'<b id="tm"></b><button class="p" onclick="submit()">Nộp bài</button>':''}</div>
${S.done&&S.mode=='exam'?`<div class="card"><div class="big">${sc}/${tot} câu đúng (${tot?Math.round(sc*100/tot):0}%)</div><div class="mu">Bấm số câu để xem lại đáp án và giải thích. Các câu sai đã được lưu vào mục “Ôn câu đã sai”.</div></div>`:''}
<div class="card"><div class="mu">${esc(q.bank)}${q.g?' · '+esc(q.g):''} · Câu ${q.n}</div><div class="q">${esc(q.q)}</div>
${q.t?`<div style="overflow-x:auto"><table>${q.t.map((r,k)=>'<tr>'+r.map(c=>`<${k?'td':'th'}>${esc(c)}</${k?'td':'th'}>`).join('')+'</tr>').join('')}</table></div>`:''}
${q.open?`<p class="mu">Câu tự luận, tài liệu chưa có đáp án mẫu. Bạn có thể ghi nhanh ý trả lời:</p><textarea oninput="S.notes[S.i]=this.value">${esc(S.notes[S.i]||'')}</textarea>`:
q.o.map(([L,t])=>{let c='opt';if(fb&&q.ok){if(L==q.a)c+=' ok';else if(L==a)c+=' no'}else if(L==a)c+=' sel';return `<button class="${c}" onclick="pick('${L}')"><b>${L}.</b>${esc(t)}</button>`}).join('')}
${!q.open&&!q.ok&&q.o.length?'<div class="ex">Câu này chưa có đáp án trong tài liệu gốc nên không được chấm điểm.</div>':''}
${fb&&q.ok?`<div class="ex"><b>${a==q.a?'Chính xác.':a?'Chưa đúng.':'Bạn chưa trả lời.'}</b> Đáp án đúng: <b>${q.a}</b>${q.e?'<br>'+esc(q.e):''}</div>`:''}</div>
<div class="row"><button onclick="go(S.i-1)" ${S.i?'':'disabled'}>← Câu trước</button><button class="p" onclick="go(S.i+1)" ${S.i<n-1?'':'disabled'}>Câu sau →</button>
${S.mode!='exam'?`<span class="sp"></span><span class="mu">Đúng ${sc}/${Object.keys(S.a).length} câu đã làm</span>`:''}</div>
<div class="card" style="margin-top:14px"><div class="pal">${S.qs.map((x,i)=>`<button class="${st(i)} ${i==S.i?'c':''}" onclick="go(${i})">${i+1}</button>`).join('')}</div></div>`;
if(S.end&&!S.done)tick()}
home();
</script></body></html>
